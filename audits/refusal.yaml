criteria:
  C1:
    name: Falsifiability
    status: C
    short: Two predictions in opposite directions, with the outcome measure fixed first
    verified: true
    reasoning: 'The claim states two predictions in opposite directions and fixes an outcome measure before
      either is tested: ablation must stop refusal on harmful instructions, addition must start it on
      harmless ones, and refusal is a substring match scored 0 or 1. Both predictions are also selection
      conditions, so a candidate direction can fail them, and the surviving direction''s margin is reported
      per model. LLAMA-3 70B survives on an induce_score of 0.126 against a threshold of 0, which is how
      close the procedure came to returning nothing for that model. A claim that could have come out the
      other way, with the failure condition written down in advance, is C.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, numerical. The legacy evidence reads "induce_score 0.126
        against 5--7 for the other large models (Table 5)". Table 5''s other large models are QWEN 72B
        at 1.885, YI 34B at 1.865 and LLAMA-2 70B at 5.191; the 5--7 band belongs to GEMMA 2B (6.709),
        GEMMA 7B (6.851), LLAMA-2 7B (5.941) and LLAMA-3 8B (7.681), which are the small models. Across
        all twelve other models the range is 1.107 to 7.681. The 0.126 figure and its isolation at the
        bottom of the table are correct; the comparison band is not.

        '
      legacy_evidence: 'Bidirectional and quantitative: ablation should drop refusal, addition should
        raise it on harmless prompts, and both were preconditions the selection procedure could fail to
        meet. Llama-3 70B nearly does fail --- \texttt{induce\_score} 0.126 against 5--7 for the other
        large models (Table 5)'
      numeric_correction: The cell reads 'induce_score 0.126 against 5-7 for the other large models (Table
        5)'. Table 5's other large models are Qwen 72B at 1.885, Yi 34B at 1.865 and Llama-2 70B at 5.191;
        the 5-7 band belongs to the small models. The 0.126 and its isolation hold; the comparison band
        does not.
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Mechanistically
        Supported, blocked above that by I6=U. The 35-criterion table scores the primary reading, so the
        criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: C
    short: The edit is enumerated over the five matrix kinds that write to the stream
    verified: true
    reasoning: 'The mechanism is stated in the weights. §4.1 enumerates the five kinds of matrix that
      write to the residual stream and defines the edit that removes the direction from all of them, and
      §E derives that this weight edit and the inference-time ablation compute the same thing, so the
      structural story and the behavioral intervention are one object rather than two claims that happen
      to agree. §5.2 then localizes the writers: components are ranked by the projection of their output
      onto the direction, and the top eight attention heads are identified. Structure that is implemented
      and localized rather than argued is C.

      '
    notes:
      verification: 'The cell''s enumeration of the five matrix families matches §4.1 exactly, and the
        top-eight head attribution matches §5.2 and Figure 6. Direct feature attribution is a projection
        of component outputs, so it ranks writers without establishing that any of them is necessary;
        §5.2 names MLP components as part of the analysis and reports none, which the I9 cell records.

        '
      legacy_evidence: The mechanism is realized in the weights, not argued for. \S4.1 enumerates every
        matrix that writes to the residual stream (embedding, positional embedding, attention-out, MLP-out,
        and output biases) and orthogonalizes each against $\hat r$; \S E proves the weight edit is algebraically
        identical to the inference-time ablation. Direct feature attribution locates the top eight heads
        that write the direction (Figure 6)
  C3:
    name: Convergent validity
    status: PC
    short: Two interventions agree on outcome; the estimate itself is never replicated
    verified: true
    reasoning: 'Convergence is real on the intervention side and absent on the extraction side. Directional
      ablation and activation addition are separate operations that agree on the behavioral outcome,
      and a LoRA fine-tuning comparator agrees again. Weight orthogonalization adds no independent evidence,
      because §4.1 states that it computes the same function as the ablation and therefore inherits its
      results exactly; three implementations of two operations is the honest count. The direction itself
      is produced by one estimator, a difference in means, with no second attribution family applied to
      the same question, and §7 concedes the extraction is heuristic. Agreement among consumers of one
      estimate, with the estimate itself unreplicated, is PC.

      '
    notes:
      verification: 'The cell''s claim that orthogonalization is proved equivalent to ablation is supported
        verbatim by §4.1, which goes further than the cell and says the ablation results "exactly characterize"
        the weight edit. The four independent extraction methods the cell cites (Wollschl\"ager, Prakash,
        Piras) are post-origin and are not checked here.

        '
      legacy_evidence: 'Three intervention forms agree (ablation, activation addition, weight orthogonalization)
        plus a LoRA fine-tuning comparator, but orthogonalization is \emph{proved equivalent} to ablation
        (\S E), so the count is two. Extraction is single-method throughout: difference-in-means, one
        vector, no second attribution family. Independent methods arrived later and disagree on dimensionality
        --- gradient-based extraction (Wollschl\"ager et al.\ 2025), sparse autoencoders (Prakash et al.\
        2025), self-organizing maps (Piras et al.\ 2025) each find multiple directions'
  C4:
    name: Discriminant validity
    status: PC
    short: The estimator is a harmfulness contrast, and separation is argued by citation
    verified: true
    reasoning: 'The neighboring construct is harmfulness, and the paper''s own description of the estimator
      is a description of a harmfulness contrast: the vector is defined as the axis along which mean harmful
      and harmless activations differ. §6 records that two prior groups extract a harmfulness representation
      from the same kind of contrastive pair and assert it is distinct from refusal, and the paper answers
      with a single point of disagreement about adversarial suffixes rather than a test that separates
      the two. §J then finds the same direction expressed in base models, which do not refuse, which is
      what a harmfulness feature would predict. Discrimination attempted at the level of citation rather
      than experiment is PC.

      '
    notes:
      verification: 'PARTIAL CONTRADICTION WITH THE CELL. The cell says §6 "records that Zheng et al.
        and Zou et al. assert the two are distinct and does not adjudicate". §6 does record that, and
        it also registers one empirical disagreement --- Zou reports the harmfulness representation is
        unaffected by adversarial suffixes, while §5.1 reports the refusal direction is suppressed by
        one. That is a contrast with a published result, not an experiment run here, so the cell''s conclusion
        holds and its description of §6 is incomplete.

        '
      legacy_evidence: The neighboring construct is harmfulness, and the origin's own extraction contrast
        is a harmfulness contrast (harmful vs.\ harmless \emph{instructions}, \S2.3) whose product is
        labeled a refusal direction. \S6 records that Zheng et al.\ and Zou et al.\ assert the two are
        distinct and does not adjudicate. Zhao et al.\ (2025) run the separation and find a harmfulness
        direction ``distinct from the refusal direction,'' with different steering consequences --- which
        vindicates the \emph{name} while showing the origin's instrument could not have made the distinction
  C5:
    name: Nomological validity
    status: PC
    short: The linear representation hypothesis does not entail the central parameter
    verified: true
    reasoning: 'The claim is placed in a theory that predates it. The linear representation hypothesis
      supplies the form of the answer, difference-in-means supplies the estimator with a prior track record
      on other features, and §J adds a developmental account in which the direction predates the behavior
      and is recruited by fine-tuning. What the surrounding theory does not supply is the number: nothing
      in the linear representation hypothesis predicts that one dimension should suffice, so the paper''s
      headline quantity is an empirical finding with no nomological reason behind it. A claim embedded
      in a theory that does not entail its central parameter is PC.

      '
    notes: &id001
      verification: 'The cell''s §J quotation, "exists already in the base model, and is repurposed for
        refusal during safety fine-tuning", is verbatim. The three difference-in-means citations named
        in the cell (Belrose; Marks and Tegmark; Panickssery) all appear in §2.3 as the cell states.

        '
      legacy_evidence: 'Sits inside an established line: difference-in-means as a feature-isolation estimator
        (Belrose 2023; Marks \& Tegmark 2023; Panickssery et al.\ 2023) and the linear representation
        hypothesis. \S J adds a developmental account --- the direction ``exists already in the base model,
        and is repurposed for refusal during safety fine-tuning.'''' No theory predicts \emph{one} dimension;
        one-dimensionality is an empirical finding without a nomological reason'
  C6:
    name: Complementation validity
    status: N/A
    reasoning: The claim is that one direction carries refusal, and one direction has no labeled subdivisions.
      The criterion asks whether a carving is functional, and this claim makes no carving.
    short: One direction, and a single direction has no subdivisions to carve
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: PC
    short: Sampling error over prompts throughout; nothing quantifies the instrument
    verified: true
    reasoning: 'Every uncertainty the paper reports is sampling error over prompts. §D.4 gives a binomial
      standard error at n = 100 for the two headline figures, §H.2 a standard deviation over 128 prompts
      for the suffix analysis, and §4.3 a 99% confidence interval for the capability evaluations. None
      of these bears on the estimator: generation is deterministic by construction, so repeated runs would
      agree trivially, and the direction is computed once from one 128-prompt training split with no resampling
      reported anywhere in §2.3 or §C. Uncertainty quantified for the measurement and left unquantified
      for the instrument is PC.

      '
    notes:
      verification: 'All three uncertainty statements in the cell check out, including the n values. The
        cell says estimator reliability is unaddressed; the stronger statement supported by the source
        is that the training split is used once and no procedure in §2.3 or §C repeats or resamples it,
        which is consistent with the cell.

        '
      legacy_evidence: 'The two sections that report uncertainty, \S D.4 and \S H.2, both report \emph{sampling}
        error across prompts and nothing else: \S D.4 gives a binomial standard error $\sqrt{p(1-p)/n}$
        at $n = 100$ for Figures 1 and 3, \S H.2 a standard deviation over 128 prompts for Figure 5, and
        \S4.3 a 99\% confidence-interval statement for the capability evaluations. Estimator reliability
        is unaddressed: generation is deterministic by construction (greedy decoding), and the direction
        is extracted once from a single 128-prompt training split with no resampling or repetition anywhere
        in \S2.3 or \S C'
  M2:
    name: Baseline separation
    status: PC
    short: Five attacks and a fine-tuning comparator, and no baseline for the estimate
    verified: true
    reasoning: 'The external baselines are unusually rich: five optimized jailbreak attacks, human-written
      templates, a direct-response floor, and a fine-tuning comparator with an independent literature
      behind it. One arm of the paper also carries a matched control, the length-matched random suffix
      that isolates the effect of appending any suffix at all. The comparison a directional claim most
      needs is the one that is missing: enumerating every condition in §3.1, §4.2, §4.3, §G.1, §G.3, §I.1
      and §I.2 yields the unmodified model, rival jailbreaks, fine-tuning and harmless-prompt references,
      and no random or orthogonal direction is ever ablated to show the effect is specific to this direction.
      Strong baselines for the application and none for the estimate is PC.

      '
    notes:
      verification: 'The cell''s count of seven comparison methods in Table 2 is right: GCG, GCG-M, GCG-T,
        AutoPrompt, PAIR, HUMAN templates and DR, against ORTHO. The random-suffix control is in §5.1
        as the cell says. The sentence carrying that control is broken line-by-line by the Figure 5 legend
        in the -layout extraction, so it is quoted here as three adjacent pieces that reassemble it.

        '
      legacy_evidence: 'Rich external baselines --- seven jailbreak methods in Table 2 (GCG, GCG-M, GCG-T,
        AutoPrompt, PAIR, human templates, direct response), a LoRA fine-tuning comparator (Table 8),
        and a matched random-\emph{suffix} control for the adversarial analysis. The one baseline that
        matters most for a directional claim is absent: enumerating every comparison condition in the
        paper (\S3.1, \S4.2, \S4.3, \S G.1, \S G.3, \S I.1, \S I.2) yields the unmodified model, rival
        jailbreak methods, fine-tuning, and harmless-prompt references --- no random or orthogonal direction
        is ever ablated for comparison'
  M3:
    name: Stability
    status: U
    short: Three thresholds and one objective, none of them moved
    verified: true
    reasoning: 'The selection rule is a fixed point in a search with three hard thresholds and a single
      objective, and none of the four is ever moved. No result is reported under a different kl_score
      cutoff, a different layer restriction, or a resampled training set, so nothing in the paper says
      whether the same direction would be returned by a slightly different procedure. The authors state
      the position themselves in §7: the extraction relies on several heuristics and the paper is an existence
      proof rather than a study of the estimator. Unattempted, and flagged as unattempted by the authors,
      is U.

      '
    notes:
      verification: 'The cell''s three thresholds are verbatim in §C.1 and its "relies on several heuristics"
        quotation is verbatim in §7. No sensitivity analysis appears in §C, §2.3 or any appendix from
        A to N.

        '
      legacy_evidence: 'Unattempted, and the authors flag it: the extraction ``relies on several heuristics''''
        (\S7). The three selection thresholds ($\texttt{kl\_score} < 0.1$, $\texttt{induce\_score} > 0$,
        $l < 0.8L$) are never perturbed, and no sensitivity of the selected direction to the 128-prompt
        training set is reported'
  M4:
    name: Calibration
    status: PC
    short: Both metrics' failure modes shown by example and never counted
    verified: true
    reasoning: 'The two outcome measures have documented failure modes rather than assumed validity. §2.5
      states what the string match cannot see, §D.3 exhibits both directions of disagreement between the
      two scores with worked examples, and §7 declares every coherence metric flawed. What is missing
      is the quantity that would turn documentation into calibration: no agreement rate between the substring
      match and Llama Guard 2 is reported, and neither is validated against human judgement on any sample.
      A metric whose errors are shown by example and never counted is PC.

      '
    notes:
      verification: 'The substring list in §D.1 has exactly the twelve entries the cell claims. Both directions
        of disagreement are in §D.3 as the cell says, at Figures 13 and 14 (0/1) and Figure 15 (1/0).
        The "difficult to measure the coherence of a chat model" quotation is verbatim.

        '
      legacy_evidence: 'Two outcome metrics whose failure modes are documented rather than assumed. \S
        D.3 exhibits both directions of disagreement: cases with $\texttt{refusal\_score}=0$ and $\texttt{safety\_score}=1$,
        and a case with $\texttt{refusal\_score}=1$ and $\texttt{safety\_score}=0$. The authors state
        the position plainly --- ``it is difficult to measure the coherence of a chat model, and we consider
        each metric used flawed in various ways'''' (\S7). Refusal score remains a 12-string match, which
        cannot distinguish a refusal from a completion that merely apologises'
  M5:
    name: Sensitivity
    status: PC
    short: LoRA is an independently established positive and the instrument detects it
    verified: true
    reasoning: 'A known-positive exists and the instrument detects it. LoRA fine-tuning on 243 harmful
      instruction-completion pairs is an intervention independently established to disable refusal, and
      the refusal and safety scores move from 0.95 and 0.97 to 0.00 and 0.08 under it, so a real effect
      of the expected size registers on the measure. Two limits keep this short of full sensitivity: the
      positive control is run on one model, and it tests the outcome measure rather than the extraction
      --- no synthetic direction is planted in a model and recovered by the selection procedure. A detected
      known-positive on one model is PC.

      '
    notes:
      verification: 'The 243 pairs, the 0.95 to 0.00 refusal drop and the 0.97 to 0.08 safety drop are
        all verbatim in §I.2 and Table 8, and §I.2 is LLAMA-3 8B INSTRUCT only, as the cell says.

        '
      legacy_evidence: 'A known-positive comparator exists on one model: LoRA fine-tuning on 243 harmful
        instruction--completion pairs, an intervention independently known to disable refusal, which the
        instrument detects (refusal 0.95 $\to$ 0.00, safety 0.97 $\to$ 0.08; Table 8). No planted direction
        is inserted and recovered, and the known-positive is run on Llama-3 8B only'
  M6:
    name: Invariance
    status: C
    short: 13 models, 5 families, 40x parameters, including where the effect degrades
    verified: true
    reasoning: 'The result is reported across every axis the design varies: 13 models in 5 families over
      a 40x parameter range, both alignment paradigms, four harmful instruction sources plus Alpaca, six
      capability benchmarks and cross-entropy loss on three corpora. The system-prompt condition is the
      strongest case, because it is the axis along which the result is weakest: §4.2 reports attack success
      both with and without the default system prompt and states the discrepancy for the LLAMA-2 family
      rather than pooling it away. Invariance demonstrated across the axes that matter, including one
      where the effect degrades, is C.

      '
    notes:
      verification: 'OVERSTATEMENT IN THE CELL. It says "every headline evaluation reported both with
        and without the default system prompt". Only the HARMBENCH attack success rate in §4.2 and Table
        2 is reported both ways; Figures 1 and 3, the refusal and safety scores that carry §3, state no
        system-prompt condition at all. The parenthetical "(§4.2)" in the cell points at the one place
        the claim holds.

        '
      legacy_evidence: 13 models, 5 families, 1.8B--72B, both alignment paradigms; four instruction datasets;
        six capability benchmarks plus cross-entropy loss on three corpora; and every headline evaluation
        reported both with and without the default system prompt, with the discrepancy stated rather than
        pooled away (\S4.2)
  M7:
    name: Selection correction
    status: U
    short: Positions crossed with layers, and the search size is never written down
    verified: true
    reasoning: 'The search is large and its size is never written as a number. Every post-instruction
      position crossed with every layer gives |I| x L candidates, the winner is the minimizer of bypass_score
      subject to three thresholds, and no multiplicity control is applied at any point. The selected direction''s
      own selection statistics are then reported in Table 5 as properties of that direction, which is
      the winner''s curse in its plainest form: the quantity optimized over is the quantity reported.
      Unattempted, with the exposure clearly visible in the procedure, is U.

      '
    notes:
      verification: 'The cell''s description of the search is exact: |I| x L candidates, minimum-bypass_score
        winner, three thresholds, and Table 5 reporting the selected direction''s scores. N is given only
        as the formula, never evaluated for any model.

        '
      legacy_evidence: Unattempted, and the search is large. $|I| \times L$ candidate vectors are scored
        and the minimum-\texttt{bypass\_score} survivor is taken subject to three thresholds (\S C.1).
        $N$ is given as a formula and never as a number; no multiplicity control is applied; the selected
        direction's scores are then reported as its properties (Table 5)
  I1:
    name: Necessity
    status: PC
    short: 0.95 to 0.01 on all 13 models; unnecessary for refusal produced on instruction
    verified: true
    reasoning: 'Removing the direction removes refusal, and the demonstration runs on all 13 models rather
      than on a chosen one. The single case with numbers attached drops refusal from 0.95 to 0.01 and
      safety from 0.97 to 0.15. Necessity then fails visibly in one condition the paper reports rather
      than hides: with its default system prompt, orthogonalized LLAMA-2 70B yields 4.4% attack success
      against 62.9% without it, because the instruction to avoid harmful content survives an edit that
      only removes the learned propensity. The direction is necessary for refusal the model produces on
      its own and unnecessary for refusal produced on instruction, which is PC.

      '
    notes:
      verification: 'All four numbers in the cell are verbatim: 0.95 to 0.01 refusal and 0.97 to 0.15
        safety in Table 8, and 4.4 against 62.9 in Table 2. §4.2''s explanation supports the cell''s learned-versus-instructed
        reading in the authors'' own words, though they mark it as speculation.

        '
      legacy_evidence: 'Ablating $\hat r$ at all layers and all token positions collapses refusal across
