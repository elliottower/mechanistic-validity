claim: refusal
verdict: Mechanistically Supported
readings:
- statement: Ablating one difference-in-means direction stops refusal on harmful instructions and adding
    it induces refusal on harmless ones, across 13 chat models
  verdict: Mechanistically Supported
  missing: A second estimator for the direction, since the three implementations are consumers of one
    difference in means (C3); a dissociation from any other behavior's direction (I6); sensitivity of
    the extraction to its own three thresholds (M3)
  primary: true
- statement: The direction carries refusal rather than harmfulness
  verdict: Underdetermined
  missing: The estimator is the axis along which mean harmful and harmless activations differ, which a
    harmfulness direction satisfies exactly (V4); the two constructs are separated by citation rather
    than by experiment (C4); base models that never refuse express the same direction (I11)
  primary: false
- statement: Refusal is organized along one dimension of the residual stream
  verdict: Underdetermined
  missing: The interventions license a lever rather than a representational organization, which the authors
    concede by calling the work an existence proof (V2); no rank above one is ever ablated and the search
    enumerates single vectors only (I3); refusal is scored as a twelve-substring match, an output property
    a single direction would control either way (V3)
  primary: false
- statement: Orthogonalizing the direction removes refusal whatever the prompting condition
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: with its default system prompt the orthogonalized LLAMA-2 70B
    yields 4.4\% attack success against 62.9\% without it, so refusal produced on instruction survives
    an edit that removes the learned propensity (I1, M6)'
  primary: false
