criteria:
  C1:
    name: Falsifiability
    status: C
    short: Five properties operationalised before any result is reported
    verified: true
    reasoning: 'The five properties are stated as a definition in §1.2, before any measurement, and each
      carries a directional prediction. Selectivity is the one that could have failed outright: it predicts
      a class of tasks that must survive ablation, so uniform degradation would have refuted it. The paper
      reports the discovery order explicitly — one property was used to find the object and the rest were
      then tested — which is what makes the remaining four risky rather than definitional.

      '
    notes:
      legacy_evidence: 'Five properties are operationalised \emph{before} any result --- verbal report,
        directed modulation, internal reasoning, flexible generalisation, selectivity --- each with a
        directional prediction that could fail. Selectivity is the sharpest: if every task had degraded
        under ablation, the workspace reading would have failed and a bottleneck reading would have replaced
        it'
      verification: 'Verified against the pdftotext -layout extraction. The five properties appear as
        a bulleted definition on p.3, ahead of every result. No pre-registration exists; the ordering
        claim rests on the authors'' own account of how they proceeded.

        '
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Triangulated,
        blocked above that by M7=U. The 35-criterion table scores the primary reading, so the criteria,
        the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: C
    short: $J_\ell$ derived from the architecture, not posited
    verified: true
    reasoning: 'J_ell is derived, not posited: it is the corpus-averaged Jacobian of the final-layer residual
      stream with respect to layer-ell activations, composed with the unembedding, so the object is fixed
      by the architecture and the corpus rather than chosen. Two structural corroborations follow from
      weights alone at differing removes from the lens.

      '
    notes:
      legacy_evidence: 'The object is derived from the architecture rather than posited: $J_\ell$ is the
        expected Jacobian of the final-layer residual stream with respect to layer-$\ell$ activations,
        composed with the unembedding. Three structural corroborations use no lens at all --- a CKA layer-block
        bump ``computed from the network''s weights alone, without reference to any lens or dictionary'''';
        MLP gain along J-lens directions rising to roughly $10\times$ against a neuron-direction baseline
        near 1; and broadcast-head identification from weight geometry'
      verification: 'CONTRADICTION with notes.legacy_evidence. The legacy cell says three structural corroborations
        "use no lens at all" and attributes the phrase "computed from the network''s weights alone, without
        reference to any lens or dictionary" to a CKA layer-block bump. Both halves are wrong on the source.
        (1) The CKA analysis of §4.1 is computed on J-lens vectors — it "compares, for each pair of layers,
        the matrices of pairwise similarities among J-lens vectors" — so it is lens-derived. (2) The quoted
        phrase belongs to §A.19.2, where it describes the attention-composition bump for MLP *neuron*
        directions (Figure 79), a different analysis. The MLP-gain and broadcast-head results also take
        J-lens vectors as their input population and so are lens-dependent. The only two genuinely lens-free
        measurements in the paper are that §A.19.2 neuron-direction bump and the projection-share readout
        of §4.1.1 ("a measurement that does not involve the J-lens"). The status C survives on the derivation
        argument; the "three corroborations use no lens at all" gloss does not.

        '
  C3:
    name: Convergent validity
    status: PC
    short: Three cross-checks, but almost every intervention edits along J-lens
    verified: true
    reasoning: 'Three cross-checks do not route through the lens: mean-difference activation patching
      of arithmetic intermediates recovers the depths the lens identifies; the ignition sweep is read
      out by projection share along the pure-A/pure-B line; and an SAE decomposition independently agrees
      that only a small fraction of features align with the J-space. Against that, nearly every causal
      manipulation in the paper edits along J-lens directions, so the bulk of the evidence is one method''s.
      No independent group has re-derived the J-space, which is what holds this at PC.

      '
    notes:
      legacy_evidence: 'Almost every intervention edits along J-lens directions, so the evidence family
        is one. Three genuine cross-checks exist and are labelled as such: mean-difference activation
        patching of arithmetic intermediates recovering the same causal depths the lens identifies; the
        ``ignition'''' input-mixture result, read out ``with a measurement that does not involve the J-lens'''';
        and an SAE-based decomposition agreeing that only a small fraction of features align with the
        J-space. No independent group and no independent method has re-derived the J-space'
      verification: 'Verified. The SAE cross-check is partly circular in the same direction — SAE features
        are scored by J-lens kurtosis, i.e. by projection through the lens — so it corroborates the capacity
        claim using an independent dictionary but a lens-defined statistic.

        '
  C4:
    name: Discriminant validity
    status: PC
    short: Separated from ``any direction encoding this concept'' by design
    verified: true
    reasoning: 'The neighbouring construct — any direction encoding this concept — is separated by construction
      and by number. Concept vectors built without the lens are split into a J-space component holding
      6-7% of variance and a remainder holding ~93%; the small component drives 59% of report swaps against
      5% for the large one, and independently derived intermediate probes give 61% against 28%. What is
      not separated is workspace from output preparation, which the authors concede, and which is why
      this is PC rather than C.

      '
    notes:
      legacy_evidence: 'The neighbouring construct --- ``any direction encoding this concept'''' --- is
        separated by design and by number. Concept vectors derived without the lens split into a J-space
        component carrying only 6--7\% of variance yet driving 59\% of report swaps, against 5\% for the
        93\% of variance outside it; independently trained probes give 61\% against 28\%, the residual
        falling to 6\% when J-space coordinates are clamped. What is \emph{not} separated is workspace
        from output preparation, and the authors say so: ``we did not provide a principled definition
        of what distinguishes a `workspace'' representation from a `motor'' one'''''
      verification: 'Verified. One wording correction to the legacy cell: the §3.3 intermediates are recovered
        by a mean-difference probe ("the mean residual-stream activation over a set of prompts that imply
        the same intermediate ... minus the mean over all intermediates"), not by a trained probe. Its
        J-space component explains roughly 10-15% of the probe''s variance, not the 6-7% quoted for the
        §3.1 concept vectors; the two figures come from different experiments.

        '
  C5:
    name: Nomological validity
    status: C
    short: Stated inside a named theory with disanalogies enumerated
    verified: true
    reasoning: 'The claim is embedded in a named external theory whose functional predictions are enumerated
      in advance and drawn from that literature rather than invented. The theory''s contested status is
      flagged, and the three architectural disanalogies — no separable input processors, no recurrent
      broadcast, unclear competitive ignition — are stated in the introduction rather than conceded in
      a limitations section.

      '
    notes: &id001
      legacy_evidence: 'The claim is stated inside a named external theory whose predictions are enumerated
        in advance and whose disanalogies are stated: no separable input processors, no recurrent broadcast,
        unclear competitive ignition. The theory''s status is flagged (``the global workspace model is
        not universally accepted''''), and the properties it is being tested against are drawn from that
        literature rather than invented'
      verification: 'Verified.

        '
  C6:
    name: Complementation validity
    status: N/A
    reasoning: The claim concerns one low-dimensional subspace and its contents, and the subspace is not
      divided into labeled parts. Where a claim names no subdivisions, the complementation question does
      not attach to it.
    short: One subspace, undivided, so the question does not attach
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: PC
    short: Wilson intervals and per-prompt dots throughout; no seed variance
    verified: true
    reasoning: 'Uncertainty is reported throughout: Wilson 95% intervals, standard-error bars, per-prompt
      dots, 30 rollouts per prompt, five seeds for the random-head control, ten seeds for the auditing
      agent. What is missing is inferential machinery. Reading every passage that discusses statistical
      reliability, no p-value and no named hypothesis test appears; the strongest inferential statement
      is that realism edits lower the eval-awareness score with statistical significance at a 95% confidence
      interval on eight of eleven suites. The J-lens matrix and the reflection fine-tune are each produced
      once, with method-variant sweeps standing in for replication.

      '
    notes:
      legacy_evidence: Uncertainty is reported throughout the figure captions --- 95\% Wilson intervals,
        standard-error bars, per-prompt dots, 30 rollouts per prompt, five seeds for the random-head control,
        ten investigator seeds for the auditing agent. Reading every passage in the paper that discusses
        statistical reliability, no $p$-value or named hypothesis test appears; the strongest inferential
        statement is that realism edits lower the eval-awareness score ``with statistical significance
        at a 95\% confidence interval on eight of them.'' The J-lens matrix itself and the reflection
        fine-tuning are each produced once, with no replication. Method-variant sweeps stand in --- ``our
        qualitative results are robust to these choices''
      verification: 'The "no p-value, no named test" claim was checked rather than assumed: a fixed-string
        search over the extraction returns only two occurrences of "statistical" (the A.17 co-occupancy
        aside and the A.21 realism-edit sentence) and zero hits for p-value, t-test, chi-square, Bonferroni,
        multiple comparison or false discovery. §A.7 was read in full; the method-variant results are
        reported qualitatively ("fairly consistent among these design choices") with no test statistic.

        '
  M2:
    name: Baseline separation
    status: C
    short: 'The densest negative controls in the set: logit lens and tuned lens'
    verified: true
    reasoning: 'The negative controls are the densest in the batch and they are quantitative rather than
      rhetorical. The lens is benchmarked against logit lens and tuned lens on six prompt distributions
      and on two causal measures, where J-lens ablation induces roughly twice the output KL divergence
      of either. The structural claims are guarded by matched nulls chosen to kill the specific alternative:
      a fixed random orthogonal rotation that preserves the J-lens spectrum and pairwise geometry but
      destroys its token identities, isotropic-random normalisation for MLP gain, layer-matched random
      head sets over five seeds, same-size random control sets for occupancy and variance.

      '
    notes:
      legacy_evidence: The densest set of negative controls in this batch. Quantitative comparison against
        logit lens and tuned lens on six prompt distributions; matched-norm random-direction perturbations;
        a fixed random orthogonal rotation of the J-lens vectors that ``preserves their spectrum and pairwise
        geometry''; isotropic-random normalisation for MLP gain; shuffled-position nulls; same-size random
        control sets for variance and occupancy; layer-matched random heads over five seeds. J-lens ablation
        induces ``roughly twice the output KL divergence'' of logit- or tuned-lens ablation
      verification: 'Verified. The rotation control is the strongest of these because it holds the geometry
        fixed and varies only the assignment of directions to vocabulary items, so a positive result cannot
        be a spectral artifact.

        '
  M3:
    name: Stability
    status: PC
    short: Method variants swept and robust; corpus size from 1 to 1000
    verified: true
    reasoning: 'The construction is swept along every axis the authors identify: which gradient is taken,
      how per-prompt Jacobians are aggregated, and how much data the expectation runs over, with the corpus
      swept from 1 to 1,000 prompts. Ablation is reported at three strengths and k is varied throughout.
      The parameter that defines the object is conceded to be unprincipled, which caps this at PC: robustness
      is demonstrated by sweeping k rather than by deriving it.

      '
    notes:
      legacy_evidence: 'Method variants swept and reported robust (present-only versus future-token effects,
        frozen attention patterns, corpus size from 1 to 1{,}000 prompts); the sparsity level $k$ is varied
        throughout; ablation is reported at three strengths. The parameter that defines the object is
        conceded to be unprincipled: ``this parameter is somewhat arbitrary, and we vary our choice of
        $k$ throughout the paper'''''
      verification: 'Verified. The variant sweeps of §A.7 are reported as qualitative agreement, with
        no stability statistic and no seed-to-seed variance on the J-lens matrix itself, which is computed
        once.

        '
  M4:
    name: Calibration
    status: PC
    short: Ablations normalised to unablated Sonnet with a smaller-model floor
    verified: true
    reasoning: 'The ablation battery is anchored twice — normalised to unablated Sonnet 4.5 with unablated
      Haiku 4.5 drawn as a smaller-model floor — so "below Haiku" is a degradation unit a reader can interpret
      without knowing the task scales. Report rates, reciprocal ranks and swap success rates are natively
      interpretable. The deception screen is not calibrated: it reports raw counts of top-10 token appearances
      with no threshold, no operating point and no false-positive rate, which is what holds this at PC.

      '
    notes:
      legacy_evidence: 'The ablation battery is anchored twice --- normalised to unablated Sonnet 4.5,
        with unablated Haiku 4.5 plotted as a smaller-model floor, so ``below Haiku'''' is a meaningful
        degradation unit. Report rates, reciprocal ranks and swap success rates are directly interpretable.
        Uncalibrated: per-task battery scores appear only in a figure, and the deception screen reports
        raw top-10 token counts with no threshold or operating point'
      verification: 'Verified. Per-task battery scores appear only inside Figure 24; no table in the text
        gives a number for any of the fourteen tasks.

        '
  M5:
    name: Sensitivity
    status: C
    short: A known-positive control is run and named as one
    verified: true
    reasoning: 'A known-positive control is run and named as one: before using J-space ablation to map
      capabilities, the authors verify on the multi-hop eval that the ablation removes content the earlier
      sections showed the J-space to carry, and it drops accuracy from near-ceiling to near zero under
      heavy ablation. Concept injection with a strength sweep over n=100 concepts is a second planted-signal
      recovery test, since the concept is known by construction and the measurement is whether the method
      finds it.

      '
    notes:
      legacy_evidence: 'An explicit known-positive control is run and named as one: ``We first verify,
        as a positive control, that the ablation removes the kind of content the preceding sections showed
        the J-space to carry,'''' with multihop accuracy falling to near zero under heavy ablation. Concept
        injection at $n=100$ with a strength sweep is a second planted-signal recovery test'
      verification: 'Verified, with a limit worth recording: the positive control is stated qualitatively.
        "Near-ceiling" and "near zero" carry no numbers anywhere in the running text — the multihop accuracy
        values exist only inside Figure 22. The same is true of the fourteen-task battery in Figure 24.

        '
  M6:
    name: Invariance
    status: PC
    short: Four models, base and organism checkpoints, two further lenses
    verified: true
    reasoning: 'Invariance is tested across four models, base and post-trained checkpoints, two misaligned
      model organisms, many task families, and two further lens constructions (template and oracle) that
      relax the single-token restriction. The authors report where invariance fails rather than only where
      it holds — on Haiku 4.5 the ablation breaks coherence before it changes content. All four models
      come from one family at one laboratory, which is the ceiling on this cell.

      '
    notes:
      legacy_evidence: Four models plus base and organism checkpoints; many task families; two additional
        lens constructions (template, oracle); results reported where they \emph{fail} to hold (``on Haiku
        4.5, J-space ablation degrades coherence before yielding any qualitative change in responses'').
        All within one model family from one laboratory
      verification: 'Verified. See E4: the four models are Claude Haiku 4.5, Sonnet 4.5, Opus 4.5 and
        Opus 4.6. No experiment in the paper is run on a non-Anthropic or open-weight model.

        '
  M7:
    name: Selection correction
    status: U
    short: Unattempted, and one token set is chosen self-referentially
    verified: true
    reasoning: 'No multiplicity control appears anywhere, and one selection is openly self-referential:
      the eval-awareness token set is chosen as the tokens that appear in the J-lens top-20 across the
      six blackmail prompts, then ablated and evaluated on those same six prompts. Broadcast heads are
      likewise the top 1% of workspace-layer heads by the same two metrics later used to characterise
      them; that selection at least carries a comparison-population control, the token selection carries
      none.

      '
    notes:
      legacy_evidence: 'Unattempted, and one instance is self-referential: the eval-awareness token set
        is chosen as the tokens ``that unambiguously encode recognition of the scenario''s artificiality,
        among those that appear in the J-lens top-20 at some (layer $\times$ token position) instances
        across the six blackmail evaluation prompts'''' --- then ablated and evaluated on those same six
        prompts. Broadcast heads are the top 1\%. No multiplicity control anywhere'
      verification: 'Verified. The two quotes are adjacent fragments of one sentence, split at a line-break
        hyphenation in "J-lens" that the extraction renders as "J-" / "lens".

        '
  I1:
    name: Necessity
    status: C
    short: Four necessity demonstrations, three with controls
    verified: true
    reasoning: 'Four independent necessity demonstrations, three of them controlled. J-space ablation
      (top-10 lens directions zeroed per position across a layer band, excluding tokens in the clean top-10)
      drives multihop accuracy from near-ceiling to near zero while MMLU, odd-one-out, SQuAD, sentiment
      and CoLA sit at or near the unablated Sonnet baseline. Broadcast-head ablation drops injected-concept
      reporting 0.54 to 0.09 while a layer-matched random-head control over five seeds leaves it intact.
      Ethics-token ablation returns the reflection-trained model''s fabrication score from 0.07 to 0.22
      while leaving the base model at 0.25. Eval-awareness ablation drops verbalised eval-awareness from
      71% to 3% with no control ablation reported.

      '
    notes:
      legacy_evidence: Four independent necessity demonstrations, three of them with controls. J-space
        ablation drives multihop accuracy to near zero while leaving MMLU, SQuAD, CoLA and sentiment near
        baseline. Broadcast-head ablation drops injected-concept reporting from 0.54 to 0.09 while a layer-matched
        random-head control leaves it intact. Eval-awareness ablation drops verbalised eval-awareness
        from 71\% to 3\%, with no control ablation reported. Ethics-token ablation returns the reflection-trained
        model's fabrication score from 0.07 to 0.22, ``back to base-model level,'' while leaving the base
        model unchanged
      verification: 'Two corrections to the legacy cell. (1) The battery''s unaffected set is five tasks,
        not four: the legacy text omits odd-one-out. (2) The multihop claim has no number in the source.
        "Near-ceiling performance" and "dropping it to near zero" are the paper''s own words and the accuracies
        exist only inside Figure 22, so "near zero" is quotable but no percentage is. The multihop set
        is the 50-prompt set of §3.3 (footnote 3). The eval-awareness arm''s lack of a control is confirmed:
        §5.1 compares ablated against unablated over six prompts x 30 rollouts and reports no matched
        random-direction or random-token condition.

        '
  I2:
    name: Sufficiency
    status: PC
    short: Swaps install counterfactual content at 54--70\% across three models
    verified: true
    reasoning: 'Sufficiency is shown by installation rather than by correlation: exchanging two lens coordinates
      while leaving the orthogonal complement of their span untouched installs the counterfactual intermediate
      and the output follows, at 54% on Haiku 4.5 and 70% on each of Sonnet 4.5 and Opus 4.5 over 50 two-hop
      prompts. The flagship broadcast test is weaker — 76 of 192 at unit strength, 101 of 192 at double
      — and the failure mode is diagnosed rather than hidden, which is what earns PC rather than C.

      '
    notes:
      legacy_evidence: 'Swaps install the counterfactual content and the output follows, at 54\% (Haiku
        4.5), 70\% (Sonnet 4.5) and 70\% (Opus 4.5) on 50 two-hop prompts. The flagship generalisation
        test is weaker: 76 of 192 trials at unit strength, 101 of 192 at double strength, with the failure
        mode diagnosed rather than hidden --- ``swap failures are concentrated in cases where the source
        concept was only weakly present in the lens before any intervention'''''
      verification: 'All three model rates and the n verify exactly, as do 76/192 and 101/192 and the
        weak-loading diagnosis. One number nearby is easy to conflate and is not the same experiment:
        §3.3 also reports 60% for raw J-lens swaps and 61% for probe J-space components over n=90 two-hop
        prompts (Figure 16). That is a different prompt set from the n=50 set behind the 54/70/70 figures,
        so the two Sonnet numbers (70% and 60%) are not in conflict.

        '
  I3:
    name: Minimality
    status: PC
    short: Occupancy estimated from where marginal improvement flattens
    verified: true
    reasoning: 'Occupancy is estimated rather than assumed: K is set where marginal reconstruction improvement
      falls below a same-size random control, giving a plateau of about 25 across the workspace band.
      That establishes how many directions are active, not that each ablated direction is load-bearing.
      No pruning experiment shows the top-10 ablated directions are individually necessary, and the sparsity
      level that defines the object is conceded to be arbitrary.

      '
    notes:
      legacy_evidence: 'Occupancy is estimated rather than assumed: the number of active directions is
        set at ``the value of $K$ at which the marginal improvement in reconstruction falls below that
        of a control set of random directions of the same size,'''' giving on the order of tens. No pruning
        experiment establishes that the top-10 ablated directions are each load-bearing, and $k$ is conceded
        to be arbitrary'
      verification: 'Verified.

        '
  I4:
    name: Specificity
    status: C
    short: Tested three ways; a fourteen-task battery maps where it is not needed
    verified: true
    reasoning: 'Specificity is tested three ways, and the prediction was stated before the tests: presence
      in the J-space should be required for report and flexible computation and not for automatic processing.
      The two within-stimulus designs are the strongest, because the stimulus, the manipulation and the
      representation are all held fixed and only the task varies. One Spanish-to-French lens swap flips
      explicit report and three flexible-inference questions while leaving continuation and anomaly detection
      unmoved, with the language name present in the lens at comparable rates in all four conditions —
      so the null arms are not null for want of the representation. One count swap moves a reported count
      from 46 to 65 while leaving the line-wrap point unchanged. The fourteen-task battery then maps the
      same boundary at scale, and a story-writing control rules out generic capability loss.

      '
