criteria:
  C1:
    name: Falsifiability
    status: C
    short: The prediction can fail and did, in work the anchor reports side by side
    verified: true
    reasoning: 'The claim form yields a prediction that can come out either way, and it came out both
      ways in work the anchor reports side by side. Modify a representation along a probe-identified direction
      and the original model''s behaviour should move: Giulianelli et al. find it does, on the examples
      the property is defined over, and Elazar et al. find that removing a well-decoded property need
      not cost the original task. The selectivity test is a second falsifiable prediction with a definite
      outcome — popular probes could have shown high selectivity and the nonlinear ones did not. A method
      whose central prediction has been tested to opposite results is falsifiable in the sense the criterion
      asks about.

      '
    notes:
      verification: 'The two opposite outcomes are both in the anchor''s own voice (§4.3), so this C does
        not depend on reading the cited papers. The cell''s gloss of amnesic probing as finding "probing
        performance and task importance uncorrelated" is stronger than the anchor, which reports only
        that high probing performance "does not necessarily entail a large drop" in original task performance
        — a hedged negative, not a null correlation. The correlational claim is Elazar et al.''s, not
        Belinkov''s.

        '
      legacy_evidence: The claim form makes a testable prediction and has been tested twice with opposite
        outcomes, which is what falsifiability looks like. Amnesic probing predicts that removing a property
        the probe found should degrade the original task; \citet{elazar2021amnesic} found probing performance
        and task importance uncorrelated, while Giulianelli et al.\ (2018) found the opposite on subject--verb
        agreement. Control tasks likewise could have shown popular probes to be selective, and did not
  C2:
    name: Structural plausibility
    status: PC
    short: Every symbol a probing result depends on is named and typed
    verified: true
    reasoning: 'The measured object is specified without residue. Every symbol a probing result depends
      on is named and typed — the original model, its dataset and its performance measure, the layer output,
      the probe, its dataset and its performance measure — and the information-theoretic reading fixes
      what the probe estimates. What the specification omits is a path from the probe back to the model.
      The anchor states the omission as the framework''s main limitation: g and f are separate objects
      trained in separate steps, so nothing in the formalism says how f would read the direction g found.
      A structure fully specified for the quantity it measures and silent on the mechanism it is used
      to claim is PC.

      '
    notes:
      verification: 'The formalism in the cell checks out symbol for symbol, with one correction: the
        anchor writes the model as f : x 7→ ŷ, mapping to a *prediction* ŷ, and the probe as g : fl (x)
        7→ ẑ. The cell drops the hats. That is not cosmetic where the criterion is about what the framework
        measures, since the hat is what distinguishes the model''s output from the gold label y in DO
        = {x(i), y(i)}. Figure 1(a) lists nine basic components and Figure 1(b) ten more.

        '
      legacy_evidence: 'The framework is formally specified --- $f: x \mapsto y$, $f_l(x)$, $g: f_l(x)
        \mapsto z$, $\mathrm{PERF}(g, f, D_O, D_P)$, with an information-theoretic reading as maximising
        $I(z; h)$ --- so what is being measured is unambiguous. What is missing is any account of how
        the model would \emph{read} the decoded direction; the framework contains no mechanism by which
        extractability becomes use, which is why the causal question arises at all'
  C3:
    name: Convergent validity
    status: PC
    short: Probe families agree under accuracy and reverse under other measures
    verified: true
    reasoning: 'Agreement between instruments holds under one metric and reverses under another, which
      is the definition of partial convergence. Probe families rank two representations the same way on
      accuracy — a real convergence, though the anchor marks it "somewhat anecdotally" — and the same
      ranking may flip under selectivity. Two proposed controls do converge, and the anchor reports Zhu
      & Rudzicz showing control tasks and control functions almost equivalent theoretically and empirically.
      The genuinely independent instrument, parameter-free probing, is positioned on the complexity axis
      rather than checked for agreement with parameterised probes. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, twice, both quotation errors. The cell reads "this pattern
        may be flipped when considering alternative measures"; the anchor reads "under alternative measures".
        The cell says Belinkov "places them [parameter-free probes] on the low end of the complexity axis";
        the anchor hedges — "such work should perhaps be placed on the low end of the complexity axis,
        although the complexity of the parsing algorithm could also be taken into account". The hedge
        matters here, because the cell''s reading is that Belinkov positions rather than tests, and the
        anchor is even less committal than that. The first quote is truncated at "Belinkov" because the
        citation year runs onto the next line and the page furniture intervenes.

        '
      legacy_evidence: 'Convergent under one metric and divergent under another, and the anchor states
        both: ``a few studies observed better performance with more complex probes, but reported similar
        relative trends \ldots However, this pattern may be flipped when considering alternative measures,
        such as selectivity (Hewitt and Liang 2019).'''' Parameter-free probing --- attention weights,
        representational similarity analysis, pairwise distance scores --- offers genuinely independent
        instruments, and Belinkov places them ``on the low end of the complexity axis'''' rather than
        reporting agreement'
      legacy_warning: The legacy_evidence for this cell contains quotations that do not appear verbatim
        in the anchor, or attributions to the anchor of text belonging to work it cites. Verified on 2026-08-07.
        Use the quotes block, not the legacy text.
  C4:
    name: Discriminant validity
    status: D
    short: 'Two neighbours the instrument must separate: probe memorisation, random features'
    verified: true
    reasoning: 'The construct is "the model represents z", and it has two neighbours that a good instrument
      must separate it from: "the probe learned z from its own training data" and "any representation
      of this dimensionality carries z". Both separation tests were run and both came back negative. Control
      tasks show nonlinear probes reaching high accuracy at low selectivity, which the anchor reads as
      memorisation by the probe rather than information in the representation. Random baselines show that
      untrained features already decode the property. Tests capable of exposing the failure were run and
      it failed, which is D.

      '
    notes:
      verification: 'THE D IS EARNED FROM THE ANCHOR, in its own voice, for both neighbouring constructs:
        the memorisation reading of low selectivity and the random-feature result are Belinkov''s sentences,
        not quotations from the papers he reviews. CONTRADICTION WITH THE CELL, on sourcing rather than
        on the verdict. The cell''s specifics are imported: the phrase "not selective", the numbers 97.3,
        92.8 and the selectivity of 4.5 appear nowhere in the anchor, which reports the finding only qualitatively
        ("linear probes tend to have high selectivity, while nonlinear probes tend to have low selectivity").
        Hewitt & Liang (2019) is cited by the anchor and predates it, so this is a cited-work import rather
        than a post-origin one — but it is still not a quotation from the source the cell attributes it
        to.

        '
      legacy_evidence: 'The construct is ``the model represents $z$''''; both neighbouring constructs
        have been tested and not separated. From the probe side: \citet{hewitt2019designing} show popular
        probes are ``not selective'''' --- MLP-1 reaches 97.3 on part-of-speech against 92.8 on a control
        task with randomised per-word-type outputs, a selectivity of 4.5, so most of the accuracy is memorisation.
        From the representation side: even random features ``capture significant information that can
        be decoded by the probing classifier.'''' Tests capable of exposing the failure were run and it
        failed'
  C5:
    name: Nomological validity
    status: PC
    short: Tied to mutual information, description length and information gain
    verified: true
    reasoning: 'Probing performance is tied to defined quantities in three different ways — mutual information,
      minimum description length, information gain relative to a control function — so the measure is
      embedded in a theory rather than standing alone. The three do not resolve to one prescription. Pimentel
      et al. argue the estimate is best served by the most complex probe available; the same authors elsewhere
      ask for the accuracy–complexity trade-off and probes that are simple and accurate; Hewitt & Liang''s
      selectivity favours the simple probe outright. One proposed distinction inside the network collapses,
      with control functions and control tasks shown almost equivalent. A network of relations that exists
      and does not close is PC.

      '
    notes:
      verification: 'All three formalisations and the Zhu & Rudzicz collapse are verbatim in the anchor.
        The cell''s characterisation of the disagreement is right and understated: Pimentel et al. (2020b)
        and Pimentel et al. (2020a) are on opposite sides of it in consecutive sentences of §4.2, the
        first arguing for the most complex probe and the second calling for probes "that are both simple
        and accurate".

        '
      legacy_evidence: 'Three formalisations exist and connect probing to defined quantities: mutual information
        $I(z;h)$, minimum description length $\mathrm{MDL}(g,f,D_O,D_P)$, and information gain under a
        control function $G(z,h,c) = I(z;h) - I(z;c(h))$. They do not agree on what should be maximised
        --- Pimentel et al.\ argue for the most complex probe, Hewitt \& Liang for the most selective
        --- and Zhu \& Rudzicz find control tasks and control functions ``almost equivalent, both theoretically
        and empirically,'''' collapsing one proposed distinction'
  M1:
    name: Reliability
    status: U
    short: A review reports no variance; the anchor states what it requires of studies
    verified: true
    reasoning: 'A review reports no variance of its own, so the evidence for this criterion is what the
      review requires of the studies it reviews. The anchor states its coverage as five concerns — controls,
      probe choice, causal claims, datasets versus tasks, pre-defined properties — and closes with a list
      of what a probing experiment should do. Neither mentions repeated runs, seeds, confidence intervals
      or significance testing. A criterion absent from both the survey''s enumeration of shortcomings
      and its prescription has not been attempted at the level of the framework. U.

      '
    notes:
      verification: 'Verified against a full read of the ten-page squib rather than a term count: §4.1
        through §4.5 are the complete shortcomings section and none of them is about estimator variance,
        and the §5 prescription runs from upper and lower bounds through controls, complexity and intervention
        without reaching repetition. CONTRADICTION WITH THE CELL, on sourcing. Everything concrete in
        it — the missing seeds, the two Hewitt & Liang tables disagreeing at 89.0/6.6 against 89.7/6.7
        and 92.3/−0.7 against 92.5/−1.0, the ten probes used only for hand inspection — is from Hewitt
        & Liang (2019) and appears nowhere in the anchor. The U survives without it, on the bounding quotes
        above.

        '
      legacy_evidence: Unattempted in the evidence base. \citet{hewitt2019designing} report no seeds,
        confidence intervals, or significance tests, and their two tables disagree on nominally identical
        configurations without comment (bilinear dependency 89.0 / selectivity 6.6 in Table 1 against
        89.7 / 6.7 in Table 2; MLP-1 92.3 / $-0.7$ against 92.5 / $-1.0$). Ten probes are trained in one
        study and used only for hand inspection of aggregate confusion matrices, with no variance reported
  M2:
    name: Baseline separation
    status: C
    short: The criterion the literature solved; three control families formalised
    verified: true
    reasoning: 'This is the criterion the literature solved, and the anchor''s contribution is to catalogue
      the solutions as first-class components rather than as advice. Lower bounds come in three kinds
      — majority, simpler-representation and randomised-model — and upper bounds in three more. On top
      of them sit three controls that hold a specific confound fixed: control tasks against probe memorisation,
      control functions against representation content, control datasets against task relevance. The decisive
      result is itself a baseline result, that random features already decode the property, which is what
      makes the bare number uninterpretable. C.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, on the locator. It says the control types are "catalogued
        in the anchor''s Figure 2". The anchor has exactly one figure. The catalogue is Figure 1(b), "Additional
        Components", which lists ten rows: skyline, baseline, control task, control function, control
        task dataset, control dataset, selectivity, information gain, MDL, and the post-intervention representation.
        Second, the cell says "four distinct control types" and then lists five (majority and simpler-representation
        baselines; random baselines; control tasks; control functions; control datasets). The five-item
        list is right and the count is wrong. The selectivity formula and the random-features sentence
        are verbatim.

        '
      legacy_evidence: 'The criterion the literature actually solved, with four distinct control types
        catalogued in the anchor''s Figure 2: majority and simpler-representation baselines; random-representation
        baselines; control tasks with a selectivity statistic $\mathrm{SEL} = \mathrm{PERF}(g,f,D_O,D_P)
        - \mathrm{PERF}(g,f,D_O,D_{P,\mathrm{Rand}})$; control functions with information gain; and control
        datasets in which $z$ is non-discriminative. The decisive result is a baseline result: ``even
        random features capture significant information that can be decoded by the probing classifier,
        so performance on learned features should be viewed in such a perspective'''''
      legacy_warning: The legacy_evidence for this cell contains quotations that do not appear verbatim
        in the anchor, or attributions to the anchor of text belonging to work it cites. Verified on 2026-08-07.
        Use the quotes block, not the legacy text.
  M3:
    name: Stability
    status: I
    short: Ordering survives under accuracy and inverts under an alternative measure
    verified: true
    reasoning: 'Stability was tested and the answer depends on which measure is asked. Under accuracy
      the ordering of two representations survives a change of probe, which is the stability the method
      needs; under selectivity the same ordering may reverse. Since the two measures are computed on the
      same probes and the same representations, that is the same object receiving two rankings, and the
      anchor does not say which to prefer. The stabilising instrument is itself scope-limited, applying
      to word-level properties and not clearly extending to sentence-level ones. Tested, informative,
      undecided: I.

      '
    notes:
      verification: 'The metric-dependence is the anchor''s, but the *demonstration* the cell leans on
        is not. The ELMo1/ELMo2 inversion (97.2 against 96.6 on accuracy, 26.0 against 31.4 on selectivity)
        and the sentence "raises the question of which layer better represents parts-of-speech" are Hewitt
        & Liang''s, and neither the numbers nor the string "ELMo" occurs anywhere in the anchor. The same
        holds for "all worked except dropout and early stopping, though never for a broad range of hyperparameters".
        The anchor supports the I at the level of the claim — orderings flip under selectivity — without
        any of the specifics the cell attributes to it. Note also the anchor''s hedge "Somewhat anecdotally",
        which the cell''s "broadly stable across probe families" does not carry.

        '
      legacy_evidence: 'Tested, with the answer depending on the metric. Accuracy orderings are broadly
        stable across probe families; selectivity orderings are not, and the two disagree about the same
        object: ELMo1 beats ELMo2 on part-of-speech accuracy (97.2 against 96.6) while ELMo2 beats ELMo1
        on selectivity (31.4 against 26.0), which the authors state ``raises the question of which layer
        better represents parts-of-speech.'''' Complexity control is itself unstable --- six methods ``all
        worked except dropout and early stopping, though never for a broad range of hyperparameters'''''
  M4:
    name: Calibration
    status: D
    short: The shortcomings section opens by denying the measurement has a scale
    verified: true
    reasoning: 'The anchor opens its shortcomings section by denying that the measurement has a scale.
      87.8 is offered as a probing result with the two questions that cannot be answered from it, and
      the section that follows exists to supply the missing reference points: baselines below, skylines
      above, selectivity and information gain as differences rather than levels. Every proposed repair
      is a subtraction, which concedes that the raw number carries no meaning on its own. The summary
      makes the concession general — absolute claims about representation quality are difficult, relative
      ones are what the improvements buy. A quantity whose author states it has no interpretable level
      is D.

      '
    notes:
      verification: 'THE D IS EARNED FROM THE ANCHOR. The 87.8 passage, the random-features result and
        the retreat to relative claims are all Belinkov''s own sentences, and the criterion is decided
        by them without reference to any cited work. CONTRADICTION WITH THE CELL, quotation error. It
        renders the passage as "Suppose we run a probing classifier experiment and obtain performance
        of PERF(g, f, D_O, D_P) = 87.8"; the anchor reads "Suppose we run such an experiment and obtain
        a performance of", the clause "probing classifier experiment" belonging to the preceding sentence.
        The content is unaffected.

        '
      legacy_evidence: 'The anchor opens its shortcomings section by denying calibration: ``Suppose we
        run a probing classifier experiment and obtain performance of $\mathrm{PERF}(g, f, D_O, D_P) =
        87.8$. Is that a high/low number? What should we compare it to?'''' Probe accuracy has no intrinsic
        scale, and the proposed repairs --- MDL, information gain, selectivity --- exist because it does
        not. The number is meaningful only relative to a control, and the control is optional in practice'
      legacy_warning: The legacy_evidence for this cell contains quotations that do not appear verbatim
        in the anchor, or attributions to the anchor of text belonging to work it cites. Verified on 2026-08-07.
        Use the quotes block, not the legacy text.
  M5:
    name: Sensitivity
    status: PC
    short: Skylines and floors exist; no planted property is ever recovered
    verified: true
    reasoning: 'Known-reference settings exist in the framework and none of them is a planted mechanism.
      Skylines say what performance is attainable when nothing is withheld, which bounds the instrument
      from above without telling us what it would miss. Feder et al.''s positively trained gC is a genuine
      positive control, but it controls a property that should survive removal rather than measuring detection
      of a property known to be present in a known place. The closest to a known-answer setting runs the
      other way: control datasets are built so the property should *not* be picked up, and the probe finds
      it anyway. Positive-control machinery present, no recovery test built on it: PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, on sourcing, and it is the load-bearing kind. The cell''s
        entire case — Kumar et al. (2022) proving that "even under the most favorable conditions ... when
        a concept''s relevant features in representation space alone can provide 100% accuracy" a probe
        is likely to use non-concept features — rests on a paper the anchor does not cite and could not
        have: the squib was accepted 8 September 2021. This is post-origin work, not a cited-work import.
        Nothing in the anchor states that the instrument misbehaves in a known-positive setting. What
        the anchor does supply is the machinery quoted above, which is why the PC is not obviously wrong;
        but the failure half of the cell''s argument is not checkable here.

        '
      legacy_evidence: Known-positive settings have been constructed and the instrument behaves badly
        in them. \citet{kumar2022probing} prove and confirm empirically that ``even under the most favorable
        conditions \ldots when a concept's relevant features in representation space alone can provide
        100\% accuracy,'' a probe is likely to use non-concept features. The instrument detects the planted
        property and misattributes what carries it. No positive control is standard practice
  M6:
    name: Invariance
    status: PC
    short: Invariance is what probing measures, so the instrument is the question
    verified: true
    reasoning: 'Invariance is what probing is used to measure — the whole point is to compare layers,
      models and tasks — so the criterion asks whether the instrument itself behaves the same way across
      those comparisons, and the anchor''s answer is that it does not. The measure is a function of four
      arguments, two of which vary with the comparison being made, which makes cross-model comparison
      confounded by construction: models differ in their training data as well as their architecture.
      Rankings that hold under accuracy may reverse under selectivity. The control that would rescue the
      comparison is itself not invariant, being suited to word-level and unclear at sentence level. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, quotation error. It reads "common models $f$ tend to
        be trained on different datasets $D_O$, making any statements about models confounded with issues
        of datasets". The anchor reads "Unfortunately, models f tend to be trained on different datasets
        DO , making statements about models confounded with issues of datasets" — no "common", no "any".
        The inserted "any" strengthens a general claim into a universal one. The within-model failure
        the cell rests on, the ELMo1/ELMo2 accuracy-versus-selectivity inversion, is Hewitt & Liang''s
        and is not in the anchor; the anchor supports the same point in general form ("this pattern may
        be flipped under alternative measures").

        '
      legacy_evidence: 'Consistency across layers, models and tasks is what probing is used to \emph{measure},
        and where it has been checked the metric does not behave consistently: the accuracy-versus-selectivity
        inversion across two ELMo layers is a within-model failure of measurement invariance. Cross-model
        comparison is explicitly confounded --- ``common models $f$ tend to be trained on different datasets
        $D_O$, making any statements about models confounded with issues of datasets'''''
      legacy_warning: The legacy_evidence for this cell contains quotations that do not appear verbatim
        in the anchor, or attributions to the anchor of text belonging to work it cites. Verified on 2026-08-07.
        Use the quotes block, not the legacy text.
  M7:
