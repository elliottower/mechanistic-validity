claim: othello
verdict: Causally Suggestive
readings:
- statement: Othello-GPT carries a decodable representation of board state that its move predictions causally
    use
  verdict: Causally Suggestive
  missing: Necessity by removal (I1), a second intervention operator (E1), a dissociation (I6), and a
    known-positive control, which the origin does not contain (M5)
  primary: true
- statement: The representation is a model of the process producing the sequences, which is the paper's
    own definition of a world model
  verdict: Underdetermined
  missing: An experiment separating that from a decodable, causally-used state summary, which every result
    in the paper also satisfies (V4, V3); the rule composition that would distinguish them is measured
    once and fails on the OR across lines (V2, I9)
  primary: false
- statement: The board state is encoded nonlinearly
  verdict: Underdetermined
  missing: A perturbation of the probe target, held at black/white/empty throughout and the one configuration
    the stability sweep never varied (M3, I5)
  primary: false
- statement: The account travels beyond Othello and beyond this architecture
  verdict: Insufficient
  missing: The origin runs one task on one architecture trained twice, and lists other games and natural
    language as future work; E3 and E4 are scored on post-origin evidence
  primary: false
