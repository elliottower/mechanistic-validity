criteria:
  C1:
    name: Falsifiability
    status: C
    short: A fixed token list and a committed threshold; some models have no head
    verified: true
    reasoning: 'The claim is stated as a test before any model is scored. The token list is fixed, the
      comparison set is fixed to the head''s own task class, and the threshold is a stated proportion,
      so a model either has a head that clears it or does not. Models do not: Figure 2 plots the cutoff
      with models below it, and one of them is analysed in an appendix as a model with no successor head.
      A pre-committed threshold on a fixed dataset, with negative cases in the paper''s own results, is
      C.

      '
    notes:
      verification: 'The definition, the threshold and the Appendix I phrase "a randomly selected model
        without a successor head" are all verbatim, so the cell''s account holds. One thing worth naming:
        the score''s discriminant power is untested — nothing shows that an induction or copying head
        fails this test, only that some models have no head that passes it. That gap is recorded at C4.

        '
      legacy_evidence: 'The successor score is a pre-committed threshold on a fixed token list: a head
        qualifies only if the effective OV circuit ranks the successor first within the same class for
        more than half of the succession dataset (their \S2). Models fail it --- Figure 2 shows the cutoff
        line with models below it, and Appendix I analyses GPT-2 Large as ``a randomly selected model
        without a successor head'''''
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Mechanistically
        Supported, blocked above that by I6=U. The 35-criterion table scores the primary reading, so the
        criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: C
    short: A product of four matrices tested directly, with no prompt entering it
    verified: true
    reasoning: 'The mechanism claim is a statement about weights and is tested as one. The object is a
      product of four matrices — embedding, MLP0, one head''s OV, unembedding — and the successor test
      evaluates that product directly, with no activation from any prompt entering the definition. The
      same product then produces a structural finding nobody asked for: an asymmetry in the logit matrix
      that the paper names, locates in behaviour, and reports as evidence its own feature-level account
      is incomplete rather than dropping. Structure derived and structure conceded is C.

      '
    notes:
      verification: 'The four-matrix product, the Figure 8a asymmetry and the §3.4 limitation are verbatim,
        and the conclusion''s own summary confirms the cell''s reading that the greater-than bias "was
        observable by a weights-level analysis". One attribution to watch: the name "Greater-Than" is
        imported from Hanna et al. (2023), which §5 states, so the label is borrowed even though the measurement
        is the paper''s own.

        '
      legacy_evidence: The claim is a product of four weight matrices, $W_U W_{OV} \mathrm{MLP}_0(W_E)$,
        and is tested as one; Figure 1 is the circuit and there are no activations in it. The same matrix
        then yields an unpredicted structural finding --- the greater-than bias, an asymmetry visible
        in the logit matrix (Figure 8a) --- which the feature-level account fails to reproduce (Figure
        8b) and which the paper reports as a limitation rather than dropping
  C3:
    name: Convergent validity
    status: C
    short: A probe at 0.708 cosine and single neurons, sharing nothing with the SAE
    verified: true
    reasoning: 'The paper poses the artifact question itself and answers it with two instruments that
      share nothing with the sparse autoencoder. A supervised linear probe recovers directions whose average
      cosine similarity to the unsupervised features is 0.70764, and single-neuron ablation independently
      surfaces units with period-10 firing. Three routes to the same residue structure, one of them unsupervised
      and one of them at a different granularity, is convergence rather than repetition. C.

      '
    notes:
      verification: 'The §3.3 framing question and the 0.70764 cosine similarity are verbatim; the cell
        rounds the latter to 0.708. CORRECTION to the cell: it says "the top sixteen neurons by importance
        show period-10 firing". The paper says "the most common period across the top 16 most important
        neurons being 10", which is a modal statement about the sixteen, not a property of all of them;
        Figure 6 shows six of them. A qualification on independence: the probe is trained to predict i
        mod 10, the quantity at issue, and the neuron search reuses the same successor-probability drop
        that defines feature importance, so the three methods are independent as extraction techniques
        rather than as tests of the hypothesis. Levy & Geva is post-origin.

        '
      legacy_evidence: '\S3.3 exists to answer ``Are the mod-10 features \ldots simply an artifact of
        the SAE technique?'''' and answers with two further methods: a linear probe whose rows have mean
        cosine similarity 0.708 to the SAE features and which transfers to 94/102 held-out non-numeric
        examples, and MLP0 neuron ablation, where the top sixteen neurons by importance show period-10
        firing. Independent later convergence: Levy \& Geva (2024) recover ``individual circular representations
        per-digit in base 10'''' from numerical error analysis and causal intervention, a different question
        answered with a different method'
  C4:
    name: Discriminant validity
    status: PC
    short: Top head eight times the runner-up; no neighbouring construct attempted
    verified: true
    reasoning: 'Separation from the null case is shown twice and quantified: one model has no head above
      the cutoff, and in the case-study model the top head''s score is eight times the runner-up. Separation
      from a neighbouring construct is never attempted. The successor score is not computed alongside
      an induction, copying or duplicate-token score on the same heads, so nothing rules out a head that
      would score highly on both. The paper then shows the construct is not clean at the component level,
      since the same head also produces acronym and greater-than behaviour. PC.

      '
    notes:
      verification: 'The eight-times figure and the natural-text behaviour breakdown are verbatim. Confirmed
        by full read: the strings "induction score", "copying score" and "duplicate" do not appear as
        head metrics anywhere — induction heads are mentioned only in Related Work — so the cell''s "never
        compared" is accurate as an absence rather than an inference.

        '
      legacy_evidence: 'Separation from the null case is shown twice: GPT-2 Large has no head passing
        the cutoff (Appendix I), and in Pythia-1.4B the top head''s successor score is eight times the
        next. Separation from neighbouring constructs is not attempted --- the successor score is never
        compared against induction, copying or duplicate-token scores on the same heads. \S4 then shows
        the construct is not clean at the component level, since the same head also performs acronym and
        greater-than behaviour'
  C5:
    name: Nomological validity
    status: PC
    short: Weak universality imported, tested, and partly returned
    verified: true
    reasoning: 'The result is placed inside a named hypothesis with prior formal content rather than described
      by analogy: Chughtai et al.''s weak universality, cited and used to structure the paper''s three
      claims. Two further connections are made to specific prior mechanisms, Hanna et al.''s greater-than
      circuit and Mikolov-style compositionality. The induction-head analogy is the informative case,
      because the paper draws it and then withdraws part of it on evidence: the training signature that
      characterises induction heads was looked for and not found. Theory imported, tested and partly returned
      is PC.

      '
    notes: &id001
      verification: 'The withdrawal sentence — "which we didn''t observe for successor heads" — is verbatim
        in §5 and the cell quotes it correctly. The connection to Hanna et al. is the source''s own ("similar
        to how we indirectly found the Greater-Than operation"), so the cell''s attribution is right.
        Note that Appendix G, the pointer attached to the withdrawal, contains no discussion of phase
        changes; the negative claim lives only in Related Work.

        '
      legacy_evidence: 'Placed inside a named hypothesis with prior formal content --- Chughtai et al.''s
        weak universality --- and connected to the greater-than circuit \citep{hanna2023greater} and to
        Mikolov-style compositionality. The analogy to induction heads is drawn and then partly withdrawn
        on evidence: induction heads show a consistent training phase change, ``which we didn''t observe
        for successor heads (Appendix G)'''''
  C6:
    name: Complementation validity
    status: U
    reasoning: 'The paper''s own polysemanticity result is what this criterion asks about, from the other
      side: succession, acronym and greater-than behaviour are carried by one head, so three labeled functions
      are not separable by component. That is a finding about the head rather than a complementation test
      of the successor construct, whose own subdivisions -- the eight ordinal task classes -- are scored
      individually and never ablated against one another.'
    short: Eight task classes scored individually and never ablated in pairs
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: PC
    short: Modes over a hundred autoencoders; the central score has no interval
    verified: true
    reasoning: 'The estimates most exposed to run-to-run noise are the ones the paper averages. The mod-10
      features are defined as a mode taken over a hundred separately trained sparse autoencoders, the
      figures behind them are averaged over the same hundred, and the probe has a train/validation split
      plus a held-out task set whose failures are listed individually. The successor scores get none of
      this. Every score in Figure 2 is one number per head per model, with no interval and no repetition,
      and the score is what the paper''s central claim is made of. PC.

      '
    notes:
      verification: 'The "averaged over 100 SAE training runs" definition and the probe''s data split
        are verbatim, so the cell''s account of what is averaged is accurate. Confirmed by full read:
        "standard deviation", "confidence", "error bar", "seed" and "variance" do not occur anywhere in
        the paper.

        '
      legacy_evidence: 'The load-bearing feature estimates are averaged over repeated runs, and the averaging
        is stated: the mod-10 features are the modal most-important features per residue class ``averaged
        over 100 SAE training runs,'''' and Figures 3--5 are averaged over the same 100. The probe has
        a train/validation split and a separate held-out task set. No confidence intervals or standard
        deviations are reported for the successor scores, which are single point estimates per head per
        model'
  M2:
    name: Baseline separation
    status: PC
    short: Cutting the head leaves under one percent and returns bigrams instead
    verified: true
    reasoning: 'Two negative baselines, one of them sharp. The Tuned Lens control cuts the head out of
      the path and asks what the embedding plus MLP0 can do alone; the answer is under one percent, and
      what comes back instead are bigram continuations, which localises the work to the head rather than
      to the representation it reads. Appendix I supplies the within-model contrast and a model with no
      successor head. A chance level is stated, but for the decoding experiments rather than for the successor
      score itself, whose null depends on the size of each task class. PC.

      '
    notes:
      verification: 'The Tuned Lens result, the bigram examples and footnote 9''s chance level are verbatim,
        and the cell quotes them correctly. The cell''s "1/7 for days, 1/200 for numbers" is the auditor''s
        arithmetic from the Table 1 task lists; the paper never states a class-conditional chance level,
        which is exactly the cell''s point.

        '
      legacy_evidence: 'Two negative baselines, one of them sharp. Appendix F runs the Tuned Lens on the
        path that bypasses the head, $W_U \mathrm{MLP}_0(W_E)$, and gets a successor score below 1\%,
        returning bigrams --- ``first'''' $\to$ ``time,'''' ``Sunday'''' $\to$ ``morning'''' --- so the
        head rather than the embedding does the work. Appendix I supplies the within-model contrast (8$\times$
        the next head) and a model with no successor head. A chance level is stated for the decoding experiments
        --- footnote 9: ``as our successor dataset contains 1041 tokens, a random classifier (even when
        restricted to tokens in the successor dataset) would achieve an accuracy of 0.001.'''' What is
        not separately computed is the class-conditional chance level for the successor score itself,
        which ranks within a task class (1/7 for days, 1/200 for numbers) rather than across the whole
        dataset'
  M3:
    name: Stability
    status: PC
    short: Three perturbations, one aimed at the paper's own premise
    verified: true
    reasoning: 'Three perturbations are run and one of them attacks the paper''s own premise. The behavioural
      decomposition is recomputed across effect types and ablation values, and successorship stays dominant
      wherever the direct effect is included. The vector-arithmetic scale is swept rather than tuned to
      a single value. Most informatively, Appendix P repeats the probing experiment for every modulus
      from 2 to 25 and reports that the extraction does not work for all of them, which is the central
      structural assumption perturbed and partly failing. What is never varied is the succession dataset,
      the threshold in the head definition, and the choice of MLP0 output as the effective embedding.
      PC.

      '
    notes:
      verification: 'All five Appendix K regimes, the λ sweep and the Appendix P conclusion are verbatim,
        and the cell reports the successorship percentages correctly (38.2%, 33%, 27%, 30%) and the copying
        swing from 1.7% to 11%. Two provenance notes. The 38.2% and 1.7% figures come from Figure 11 in
        §4, not from Appendix K, and are read off a pie chart rather than stated in text. And the cell''s
        "thirteen values" for λ is a count inferred from the paper''s elided set {0.0, ..., 0.75, 1.0,
        1.25, ..., 3.0}; the paper states the endpoints and four explicit steps, never the count.

        '
      legacy_evidence: 'Two dedicated sweeps. Appendix K recomputes the behavioural decomposition under
        five ablation regimes (direct/indirect/total $\times$ mean/resample) and successorship stays dominant
        in all direct- and total-effect variants (38.2\%, 33\%, 27\%, 30\%), while the minor categories
        move sharply --- copying 1.7\% $\to$ 11\%. Appendix D sweeps the vector-arithmetic scaling $\lambda$
        over thirteen values. Appendix P sweeps the modulus itself, repeating the probing experiment for
        every $m \in \{2, \ldots, 25\}$ and reporting that ``we cannot easily extract `mod-$m$ data''
        from token representations for all $m$'''' --- a perturbation of the paper''s central structural
        assumption, run and partly failing. SAE hyperparameters are themselves chosen by a stability criterion,
        ``mean max cosine similarity between two trained SAEs'''' (Appendix A.2). Not perturbed: the succession
        dataset definition, the successor-score threshold, and the choice of $\mathrm{MLP}_0(W_E)$ as
        the effective embedding'
  M4:
    name: Calibration
    status: PC
    short: A proportion against a stated threshold; importance gives rank, not magnitude
    verified: true
    reasoning: 'The primary measure is calibrated by construction. The successor score is a proportion
      of a stated token set with a stated threshold, so any value can be read against both endpoints,
      and ∆L is a loss change on real text. The importance measure carried into the natural-data study
      is not. A winning case records only which head''s ablation hurts most, so a head can win every prompt
      while accounting for an arbitrarily small share of the model''s performance. This is why the Appendix
      J result, 64 out of 64, establishes rank and not magnitude. PC.

      '
    notes:
      verification: 'The definitions of both per-prompt metrics and the Appendix J result are verbatim,
        and the cell''s reading of "winning" as a rank is exactly the paper''s definition. A source-side
        overstatement worth recording: §4.1 says Appendix J "reveals that successor heads are necessary
        for a specific incrementation task", while Appendix J reports a winning-head count and concludes
        only that such prompts are "mostly solved by successor heads". The cell catches this; the paper
        does not.

        '
      legacy_evidence: 'The successor score is a proportion with a stated denominator and a stated threshold,
        which makes it directly interpretable, and $\Delta L$ is a loss delta on real data. The ``winning
        case'''' measure is not calibrated: it ranks heads by which one''s ablation most reduces the correct-token
        logit, without reporting how much performance depends on the winner. This is why the Appendix
        J result --- the successor head wins on all 64 numbered-listing prompts --- establishes rank rather
        than magnitude'
  M5:
    name: Sensitivity
    status: U
    short: Every control a known-negative; no planted circuit recovered
    verified: true
    reasoning: 'Every control in the paper is a known-negative: a path with the head removed, a model
      with no qualifying head, a chance level. None of them measures what the procedure would fail to
      find. No head with a planted incrementation circuit is constructed and recovered, and no synthetic
      mod-10 feature of known location is inserted into the representation and detected, so the false-negative
      rate of both the successor score and the feature-importance search is unmeasured. U.

      '
    notes:
      verification: 'Verified by full read rather than by a statement of omission: the paper contains
        no planted, synthetic or otherwise known-magnitude target anywhere. The quotes here bound the
        control set rather than assert the absence.

        '
      legacy_evidence: 'Unattempted. No known-positive control: no head with a planted incrementation
        circuit is constructed and recovered, and no synthetic mod-10 feature of known location is inserted
        and detected. Every control in the paper is a known-negative'
  M6:
    name: Invariance
    status: C
    short: Three families over three orders of magnitude, failures kept in
    verified: true
    reasoning: 'The core result is reported along every axis that could plausibly break it: three model
      families across roughly three orders of magnitude, eight tasks with a per-task breakdown rather
      than a pooled average, spaced and capitalised variants of every token, five ablation regimes, and
      three feature-detection methods. Where invariance fails it is reported inside the same design rather
      than excluded — the mod-10 features do not steer Days or Letters, stated in the main text and analysed
      in an appendix. Breadth with the failures kept in is C.

      '
    notes:
      verification: 'The per-task breakdown, the tokenizer variants and both steering failures are verbatim,
        and the cell''s list of axes is accurate. One axis the cell does not mention that also varies
        and partly fails: Appendix B.2 recomputes the successor score on the held-out Roman-numeral task
        across models and reports that Llama-7B does not generalise to it.

        '
      legacy_evidence: 'The core result is reported across three model families, roughly three orders
        of magnitude of parameter count, eight succession tasks with per-task breakdown (Figure 2, right),
        spaced and capitalised token variants, five ablation regimes, and three independent feature-detection
        methods. Two failures are reported inside the same design rather than excluded: the mod-10 features
        do not steer Days or Letters (Appendix E)'
  M7:
    name: Selection correction
    status: U
    short: Selection at three levels, disclosed at each and corrected at none
    verified: true
    reasoning: 'Selection runs at three levels and is disclosed at each. The case-study head is the maximum-scoring
      head in its model; the mod-10 features are modes of a per-token argmax over an importance measure
      defined by the same successor-probability drop those features are then shown to cause; the vector-arithmetic
      scale is chosen by a criterion evaluated on the outcome it is meant to produce. Each of the three
      is a maximum reported at its selected value, and none is compared against the distribution of maxima
      that the search itself generates. Disclosed selection with no correction is U.

      '
    notes:
      verification: 'The three selection steps are verbatim and the cell describes each correctly, including
        the circularity in the importance definition. Confirmed by full read: no multiplicity correction,
        permutation null or held-out re-selection appears.

        '
      legacy_evidence: Unattempted. L12H0 is selected as the maximum-successor-score head in Pythia-1.4B;
        the mod-10 features are selected as the modal ``most important feature'' per residue class, where
        importance is defined by the same successor-probability drop the features are then shown to cause;
        $\lambda$ is selected by a criterion checked on the outcome. $N$ is stated at each step; no multiplicity
        control is applied
  I1:
    name: Necessity
    status: PC
    short: Winning head on all 64 prompts, which ranks the head without measuring it
    verified: true
    reasoning: 'The authors name the gap themselves and then close part of it. On 64 numbered-listing
      prompts collected from real text, the successor head is the winning head every time, which is a
      strong result about ranking. It is not a necessity measurement: winning means the head whose ablation
      most reduces the correct-token logit, so the experiment never reports how far performance falls
      when the head is removed, and 64 out of 64 could hold with a small absolute effect. One task, ranked
      rather than measured, is PC.

