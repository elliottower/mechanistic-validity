- statement: The head is specific to succession
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: on natural text acronym and greater-than behaviour take 23.8\%
    and 18.9\% of winning cases, and the paper reframes the head as interpretably polysemantic (I4)'
  primary: false
- statement: The mod-10 mechanism recurs across architectures and sizes, as the abstract states
  verdict: Underdetermined
  missing: Mechanistic recurrence is one case study plus two appendix replications against broad behavioural
    recurrence (E4); Llama-7B fails the held-out Roman-numeral task where the Pythia models do not (E4,
