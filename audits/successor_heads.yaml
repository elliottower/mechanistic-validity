  primary: false
- statement: The emergence of successor heads during training explains when the incrementation behaviour
    appears
  verdict: Underdetermined
  missing: Successor scores are tracked across checkpoints in two model families and the heads are seen
    to emerge, but nothing is plotted against a behaviour or a loss curve, and the phase change the induction-head
    comparison predicts is absent (I11); no checkpoint interval shows the mechanism lapsing (I12)
  primary: false
