criteria:
  C1:
    name: Falsifiability
    status: C
    short: Signed predictions run both ways on 34 relations, against a matched control
    verified: true
    reasoning: 'The hypothesis is stated as a signed prediction on a measured quantity and is run in both
      directions on 34 relations. Zeroing the identified activations should lower the correct-answer probability,
      doubling them should raise it, and a count-matched control attributor should do neither. The control
      could have reproduced either effect and reproduced neither: 1.47% against 29.03% under suppression,
      and a 1.27% decrease against a 31.17% increase under amplification, where the control moves in the
      wrong direction entirely. Predictions that could have come out the other way and did not are C.

      '
    notes:
      verification: 'The 29.03% and 1.47% figures in the cell are verbatim in Figure 4''s caption, and
        31.17% and 1.27% in Figure 5''s. The cell attributes them to §4.5, where the same numbers appear
        in the body text; the captions are quoted here because they state the comparison in one span.
        One refinement the cell does not make: the amplification control does not merely fail to help,
        it lowers the correct probability, which is a sharper failure of the control than a null result.

        '
      legacy_evidence: 'Predictions are directional and quantitative: suppression should lower correct-answer
        probability, amplification should raise it, and a count-matched activation baseline should do
        neither. The baseline could have matched and did not ($-1.47\%$ against $-29.03\%$; their \S4.5)'
  C2:
    name: Structural plausibility
    status: C
    short: 'Eq. (3) beside Eq. (2): the same key-value operation under another nonlinearity'
    verified: true
    reasoning: 'The account names a concrete component and shows the algebra that makes it a memory. Equation
      (3) is put beside Equation (2) and the two are read as the same query-key-value operation under
      a different nonlinearity, which licenses treating the first FFN layer as keys and the second as
      values. The intervention then lands on the object the account says holds the memory: editing modifies
      the value slots of FFN(val), the row indexed by the neuron whose activation was attributed. Mechanism
      and manipulation refer to the same structure, which is C.

      '
    notes:
      verification: 'The Equation 2 / Equation 3 parallel the cell describes is stated by the authors
        themselves in §2 and is verbatim. One qualification the cell omits: the source marks the identification
        as an analogy and a hypothesis -- "it is reasonable to regard", "We hypothesize" -- and attributes
        the key-value reading to Geva et al. (2020), whose own analysis §6 calls qualitative. The structural
        account is borrowed and argued by analogy rather than derived here.

        '
      legacy_evidence: Grounded in the FFN key-value memory account (\S2, \S3; Geva et al.\ 2020), with
        the algebraic parallel between Eq.~2 and Eq.~3 spelled out. Editing acts on $\mathrm{FFN}^{(\mathrm{val})}$
        value slots --- the object the account says holds the memory
  C3:
    name: Convergent validity
    status: PC
    short: One attributor against one contrast, agreeing on one coarse property
    verified: true
    reasoning: 'The origin runs one attribution family against one contrast attributor. Integrated gradients
      identifies the neurons; raw activation magnitude supplies the comparison; every downstream result
      is computed on the sets those two produce. The only agreement with an independent instrument is
      about layer depth, and it is agreement about where in the network the units sit rather than about
      which units they are. Convergence that is real and confined to one coarse property is PC.

      '
    notes:
      verification: 'The topmost-layer claim the cell attributes to Figure 3 is stated in §4.4 and is
        verbatim. That claim is the origin side of the tension the cell records, since causal tracing
        places the effect in middle FFN layers; Meng et al. (2022) is post-origin and cannot be checked
        against this source. Note that the agreement the paper itself claims -- with Tenney et al. and
        Geva et al. -- is agreement with the layer profile, not with an independently located neuron set.

        '
      legacy_evidence: 'One attribution family at origin (integrated gradients) against one contrast baseline
        (raw activation). Independent convergence arrived with causal tracing \citep{meng2022locating},
        but the agreement is partial in a way the origin does not reconcile: Dai et al.\ find knowledge
        neurons in the \emph{topmost} layers (their Figure 3), causal tracing finds middle-layer FFNs'
  C4:
    name: Discriminant validity
    status: D
    short: The competitor is named, removed by a filter, and the same machinery moves it
    verified: true
    reasoning: 'The neighbouring construct is named in the source. §3.3 says the coarse set may hold neurons
      that express syntactic or lexical information, which is the competitor a knowledge construct has
      to separate from. The paper then removes them by a sharing rule that rests on two stated hypotheses:
      that true positives recur across paraphrases of a fact and false positives do not. No measurement
      anywhere in the paper reports whether the retained neurons carry syntactic or lexical signal, so
      the competing construct is excluded by assumption. Later work that ran the measurement found the
      same machinery moves linguistic patterns as well, which is what carries the D.

      '
    notes:
      verification: 'The cell''s quoted phrase "express other information (e.g., syntactic or lexical
        information)" is verbatim (§3.3), and the cell''s reading of the refining strategy as a prompt-sharing
        heuristic rather than a test is correct: both halves of the rule are introduced by "we hypothesize".
        CONTRADICTION WITH THE CELL''S SOURCING, not with its status. The D is carried entirely by Niu
        et al. (2024), which is post-origin and not checkable here. Against this source alone the criterion
        is untested: the origin names the competing construct and never measures it.

        '
      legacy_evidence: 'The construct is ``knowledge'''' and the measure does not separate it from neighbouring
        constructs. \S3.3 shows the authors saw the risk --- the refining strategy exists to filter neurons
        that ``express other information (e.g., syntactic or lexical information)'''' --- but addresses
        it by a prompt-sharing heuristic rather than a test. Niu et al.\ (2024) run the test: ``we can
        edit the expression of certain linguistic phenomena using the same model editing methods,''''
        concluding these patterns ``do not constitute `knowledge''.'''' A test capable of exposing the
        failure was run and the criterion failed'
  C5:
    name: Nomological validity
    status: PC
    short: Two theories say where to look; neither is tested as a network
    verified: true
    reasoning: 'The construct sits inside two existing theories and the paper says which. Language models
      as knowledge bases supplies the reason a cloze probe counts as a knowledge test; FFN layers as key-value
      memories supplies the reason an FFN neuron is the place to look. What the paper does not do is derive
      a prediction that distinguishes this network of relations from a rival one, so the theoretical embedding
      constrains where to look and never gets tested as a network. PC.

      '
    notes: &id001
      verification: 'Both theoretical anchors the cell names are stated in the source and are verbatim.
        The contest the cell records -- Balogh (2026) placing the MLP in a routing role, Chen et al. (2024)
        giving attention a larger part -- is post-origin. The origin''s own hedge is worth recording:
        it describes Geva et al.''s key-value analysis as qualitative while inheriting its conclusion
        whole.

        '
      legacy_evidence: 'Fits FFN-as-key-value-memory (Geva et al.\ 2020) and LM-as-knowledge-base (Petroni
        et al.\ 2019). The theoretical link is now contested: Balogh (2026) place the MLP in a routing
        role with the fact originating in attention; Chen et al.\ (2024) find attention plays a larger
        role than the neuron account allows'
  C6:
    name: Complementation validity
    status: U
    reasoning: 'Relation-level neuron sets are the subdivisions and their separation is measured at identification,
      where sets for different relations share 0.09 neurons against the control''s 1.92. Identification
      overlap is not complementation: no experiment suppresses two relations'' neurons together and reads
      the result against each alone, which is the comparison that would show the sets are functionally
      as well as numerically distinct.'
    short: Relation sets separate at identification; no joint suppression is run
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: U
    short: Every quantity a mean reported once, with no interval or repeated run
    verified: true
    reasoning: 'Every quantity in the paper is a mean reported once. Suppression is 29.03%, amplification
      31.17%, neuron count 4.13, and none carries an interval, a resampling distribution or a repeated
      run. The one knob whose variation would show how stable the identified set is -- the refining threshold
      -- is moved only in one direction, toward a target neuron count, so its sweep measures nothing about
      reliability. U.

      '
    notes:
      verification: 'Read in full. No standard deviation, confidence interval, bootstrap or seed appears
        anywhere in the paper, and Figures 4 and 5 render as bar charts with one bar per relation per
        method and no error bars. The cell''s claim that the thresholds are tuned per relation to force
        the count into [2, 5] is verbatim (§4.1). The per-relation spread that Figures 4 and 5 do show
        is variation across relations, not across repetitions, and belongs to M6.

        '
      legacy_evidence: Unattempted. No seed variance, bootstrap, or repeated attribution runs; every number
        is a single point estimate. Thresholds $t$ and $p\%$ are tuned per relation to force neuron count
        into $[2,5]$ (\S4.1), and the sensitivity of the identified set to that tuning is not reported
  M2:
    name: Baseline separation
    status: C
    short: Activation magnitude through the identical pipeline, succeeding 0.0% of the time
    verified: true
    reasoning: 'One negative control runs through the whole paper and is matched on the quantity that
      would otherwise explain any gap. Raw activation magnitude is put through the identical refining
      pipeline with its own thresholds tuned to the same [2, 5] target, yielding 3.96 neurons against
      4.13, so the two sets are the same size. It then separates at every stage the paper measures: suppression,
      amplification, prompt discrimination and edit success, where the control succeeds 0.0% of the time.
      C.

      '
    notes:
      verification: 'All four separations in the cell check out against the source: 29.03% against 1.47%
        (Figure 4), 31.17% against 1.27% (Figure 5), 34.4% against 0.0% (Table 6), and T1 activation 0.485
        against 2.472 (Table 4). The count-matching phrase the cell quotes is verbatim (§4.3). One reading
        correction. The cell records the Table 4 comparison as "0.485 vs. 2.472, where the baseline cannot
        distinguish prompt types at all". The baseline''s activations are higher than the method''s on
        all three prompt types, which follows from selecting neurons by activation magnitude; the separation
        being claimed is between prompt types within a method, not between methods within a prompt type.

        '
      legacy_evidence: 'An activation-magnitude attribution baseline is carried through every experiment
        and count-matched ``to ensure the average number of knowledge neurons for each relation lies in
        $[2,5]$'''' (\S4.3). It separates cleanly at every stage: $-29.03\%$ vs.\ $-1.47\%$ suppression;
        $+31.17\%$ vs.\ $-1.27\%$ amplification; 34.4\% vs.\ 0.0\% update success; $T_1$ activation 0.485
        vs.\ 2.472, where the baseline cannot distinguish prompt types at all'
  M3:
    name: Stability
    status: U
    short: Three free settings stated and none of them perturbed
    verified: true
    reasoning: 'Three free settings determine the identified set: the attribution threshold at 0.2 of
      a per-prompt maximum, the Riemann step count at 20, and the refining threshold. The paper states
      all three and perturbs none. The only movement of any of them is a search over p% that stops when
      the neuron count enters a target range, which reports where the search halted and nothing about
      how far the identified set travels on the way. U.

      '
    notes:
      verification: 'Read in full. The three values the cell names -- t = 0.2, m = 20, and the refining
        threshold -- are verbatim and are the complete set of free parameters in the identification procedure.
        No alternative value of any of them is reported, and no result is shown as a function of any of
        them.

        '
      legacy_evidence: Unattempted. No perturbation of the attribution threshold ($t = 0.2$), the Riemann
        step count ($m = 20$), or the refining threshold; no report of how the identified set moves under
        any of them
  M4:
    name: Calibration
    status: PC
    short: Outcomes calibrated; the selection quantity is driven to a target range
    verified: true
    reasoning: 'The outcome quantities are calibrated and the selection quantity is not. A correct-probability
      change ratio carries a sign, a zero meaning no effect, and a control value measured on the same
      relations, so a reader can tell direction and magnitude apart; perplexity change has the same properties.
      The attribution score is thresholded at 0.2 of its own maximum for that prompt, which rescales it
      per prompt and leaves its absolute value uninterpretable, and the number of neurons that survive
      is then set by driving a second threshold to a target range. PC.

      '
    notes:
      verification: 'The cell''s account of the attribution score as "thresholded at a fraction of its
        own maximum" is verbatim in §4.1, and the target-range procedure for the neuron count is verbatim
        in the same paragraph. The perplexity column of Table 5 is included as an instance of a calibrated
        outcome scale, with the caveat recorded at I4 that the paper never states what the perplexity
        is computed over.

        '
      legacy_evidence: Probability change ratios and perplexity changes are meaningful and directional.
        The attribution score itself is uncalibrated --- it is thresholded at a fraction of its own maximum,
        so its absolute scale carries no interpretation, and the neuron count is set by a target range
        rather than by the data
  M5:
    name: Sensitivity
    status: U
    short: One known-negative control and no case where the answer is known in advance
    verified: true
    reasoning: 'The paper carries one control and it is a known negative: an attributor that should not
      find the right neurons, and does not. A sensitivity test needs the opposite, a case where the answer
      is known in advance so that a miss can be told apart from an absence. Nothing in the paper plants
      a fact, writes a memory into a known FFN slot, or otherwise creates ground truth for the identification
      procedure to recover, so no number bounds what the method fails to find. U.

      '
    notes:
      verification: 'Read in full. Every identification in the paper runs on facts BERT already knows,
        selected because it already knows them (§5.1 samples "ten facts learned by the pretrained model"),
        so there is no case with a known location. The cell''s characterisation of the activation baseline
        as a known-negative control is correct and is quoted here.

        '
      legacy_evidence: 'Unattempted. The activation baseline is a known-negative control. No known-positive:
        no fact is planted and recovered, no synthetic FFN memory of known location is inserted and detected'
  M6:
    name: Invariance
    status: PC
    short: Per-relation spread across 34 relations; the generalisation claim has no experiment
    verified: true
    reasoning: 'Invariance is checked on two axes and left open on the rest. Every intervention result
      is broken out per relation across 34 relations, so the spread is visible rather than averaged away,
      and §4.6 repeats the activation contrast on web-crawled text the neurons were not identified from.
      Model, language, architecture and prompt length are held fixed throughout, and the one statement
      the paper makes about generalising past BERT is an assertion with no experiment behind it. PC.

      '
    notes:
      verification: 'The P178 anomaly the cell names is verbatim, and the cell reads it correctly: the
        abnormal increase is in the baseline, not in the method. That leaves the method with no named
        anomaly across 34 relations, so the cell''s "spread visible" rests on Figures 4 and 5 rather than
        on any statement. The corpus check in §4.6 is verbatim. The BERT-only scope is recorded again
        at E4 and V5, where the same sentence is the evidence.

        '
      legacy_evidence: Reported per relation across 34 relations (Figures 4, 5) with the spread visible
        and one anomaly named (P178, where the baseline's correct probability ``abnormally increases'').
        \S4.6 checks corpus invariance by moving from PARAREL templates to web-crawled BINGREL text. Not
        checked across models, languages, or prompt lengths
  M7:
    name: Selection correction
    status: U
    short: Selection at four places, disclosed at all four and corrected at none
    verified: true
    reasoning: 'Selection happens at four places and is disclosed at all four: a swept refining threshold,
      a 10% sharing filter before updating, four relations chosen from 34 for erasure, and 20 most-frequent
      neurons chosen per relation. Nothing corrects for it. The paper reports no null distribution and
      runs no test, and where it writes "more significantly activated" the word carries its descriptive
      sense over a difference in means. Disclosed selection with no correction is U.

      '
    notes:
      verification: 'The three selection steps the cell names are verbatim: the 0.05 sweep to target (§4.1),
        the four relations "as examples" (§5.2), and the "shared by less than 10% of intra-relation facts"
        filter (§5.1). The cell says "N is stated at each step", which holds for the dataset (253,448
        prompts, 27,738 facts, 34 relations) and for the update study (ten facts per relation), and does
        not hold for the erasure study, where the number of prompts the perplexities are computed over
        is never given.

        '
      legacy_evidence: Unattempted. $p\%$ is swept per relation ``by 0.05 at a time'' until the neuron
        count hits target (\S4.1); the erasure study selects 4 relations from 34 ``as examples''; the
        update study keeps only neurons ``shared by less than 10\% of intra-relation facts.'' $N$ is stated
        at each step; no multiplicity control is applied to any of it
  I1:
    name: Necessity
    status: PC
    short: 29.03% against the control's 1.47%, consistent across relations but a decrement
    verified: true
    reasoning: 'Zeroing the identified activations produces a large deficit that the matched control does
      not reproduce, 29.03% against 1.47%, and the deficit is consistent across all 34 relations rather
      than driven by a few. It is a decrement and not a collapse. The quantity reported is an average
      change ratio, so a 29.03% drop leaves most of the correct-answer probability intact and the fact
      still expressed after the neurons are switched off. One intervention method, one model, partial
      deficit: PC.

      '
    notes:
      verification: 'The 29.03% against 1.47% comparison the cell rests on is verbatim in both §4.5 and
        Figure 4''s caption. The cell''s reading that "the fact is still expressed after the neurons are
        removed" follows from the measure being a relative change in the correct-answer probability rather
        than an accuracy; the paper never reports post-suppression accuracy, so the residual is inferred
        from the ratio and not stated.

        '
      legacy_evidence: 'Zeroing the identified neurons lowers correct-answer probability by 29.03\% on
        average against a matched baseline''s 1.47\% (\S4.5) --- a real deficit. One intervention method,
        one model, and a decrement rather than a collapse: the fact is still expressed after the neurons
        are removed'
  I2:
    name: Sufficiency
    status: PC
    short: Doubling gives +31.17% and rewriting succeeds 34.4%; neither reaches sufficiency
    verified: true
    reasoning: 'Two results push toward sufficiency and neither reaches it. Doubling the activations raises
      the correct probability by 31.17%, and rewriting the value slots makes the substituted entity the
      top prediction 34.4% of the time against 0.0% for random neurons. Both are changes to a fact the
      model already expresses through the rest of its machinery, so neither shows the fact can be produced
      from these neurons alone, and the authors'' own remedy for the 34.4% is to include more neurons.
      PC.

      '
    notes:
      verification: 'The 31.17% and 34.4% figures the cell cites are verbatim (Figure 5, Table 6). The
        cell''s "34.4% means the manipulation fails on two thirds of attempts" is supported by the neighbouring
        change rate of 48.5%: the edit alters the prediction about half the time and installs the intended
        target about a third of the time, so a further 14 points change the answer to something else.

        '
      legacy_evidence: Amplification raises correct-answer probability by 31.17\%, and value-slot surgery
        makes $t'$ the top prediction 34.4\% of the time (\S5.1). Sufficiency in the sense of reconstructing
        the fact from these neurons alone is untested, and 34.4\% means the manipulation fails on two
        thirds of attempts
  I3:
    name: Minimality
    status: U
    short: Set size is an input, held near four neurons before any effect is measured
    verified: true
    reasoning: 'Set size in this paper is an input. The refining threshold is moved by 0.05 at a time
      until the average count enters [2, 5], so the identified set is held at about four neurons before
      any effect is measured and never exceeds what the manipulation uses. Minimality asks whether a discovered
      set can be cut back without losing the effect, and a set whose size was fixed in advance offers
      nothing to cut.

      '
    notes:
      verification: 'The [2, 5] target and the "about four top knowledge neurons" the cell rests on are
        both verbatim. CONTRADICTION WITH THE CELL, on the kind of N/A rather than on the status. This
        is the weakest of the audit''s three N/A cells and does not stand on the same footing as I11 and
        I12. Set size here is a tuned hyper-parameter, not a structural limit: the paper twice contemplates
