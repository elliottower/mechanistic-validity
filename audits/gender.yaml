criteria:
  C1:
    name: Falsifiability
    status: C
    short: The answer could have been 100 heads and was 10; one negative case fires
    verified: true
    reasoning: 'The sparsity claim is put as a quantity that could have come out any way. The search runs
      over all 144 heads and reports how many are needed to reach the all-head effect; the answer could
      have been 100, and it was 10. Two negative cases are named in advance and one of them fires. The
      untrained model shows neither the effect nor the structure, and the gender-neutral arm — the same
      instrument on the same templates with a different treatment target — fails to show the concentrated
      structure, which the paper reports as a negative result rather than dropping. A directional prediction
      with a stated failure mode and a reported miss is C.

      '
    notes:
      verification: 'The legacy evidence''s "It could have taken all 144; it took 10" is the paper''s
        own arithmetic, and both halves are verbatim in §5.2. The randomly-initialised sentence it quotes
        is verbatim. One addition the cell does not make: the sharper falsification at origin is the gender-neutral
        arm, where the predicted sparse structure did not appear and the authors say so in §5.2 and again
        in §6.

        '
      legacy_evidence: 'The sparsity claim makes a directional prediction that could have failed: a small
        head subset should match the all-head concurrent indirect effect. It could have taken all 144;
        it took 10 (\S5.2). The randomly initialised GPT2-small is the stated failure mode --- ``We did
        not find similar behavior in a randomly initialized model'''''
  C2:
    name: Structural plausibility
    status: PC
    short: Mediators taken from the architecture; no weight-level mechanism anywhere
    verified: true
    reasoning: 'The mediator inventory is taken from the architecture rather than from the phenomenon.
      Neurons, layers, heads and single attention weights are enumerated before any measurement, and each
      is a term the forward pass actually computes, so every effect the paper reports is attached to something
      that exists in the model. The structural account stops there. The only claim about how an effect
      travels is the residual-stripe analysis, which argues from the geometry of a heatmap and a stripe
      count, not from the weights that would carry the information. No projection, no attention-circuit
      computation and no parameter-level derivation of how a head produces its indirect effect appears
      anywhere. Architecture-matched mediators with no weight-level mechanism is PC.

      '
    notes:
      verification: 'The §3.2.2 mediator list straddles pages 8 and 9 with a running header between the
        halves, so it is recorded as two adjacent fragments that reassemble the sentence. The "vertical
        stripes" reading in the cell is the paper''s own, and the cell is right that it is offered as
        one of two candidate explanations, decided by the stripe-count comparison in Figure 10 (bottom).
        Confirmed by full read: the paper contains no analysis of any weight matrix.

        '
      legacy_evidence: The mediator set is chosen to match the architecture (neurons, layers, heads, individual
        attention weights, \S3.2.2), and \S5.3 reads residual-stream ``vertical stripes'' in the neuron
        heatmap as evidence of information carried across layers at a fixed index. No weight-level account
        of how a head produces the effect; the mechanism is located, not derived
  C3:
    name: Convergent validity
    status: C
    short: Two mediator families, three datasets, four scales -- all one instrument
    verified: true
    reasoning: 'Convergence at origin is broad and shallow. Two mediator families run on three datasets
      give the same sparsity picture, and four outcome scales give it again, so the result is robust to
      the unit of analysis and to the metric. What all of those share is the instrument: every number
      is an NIE produced by the same interchange intervention, so their agreement tests the estimand''s
      robustness rather than the method''s. The one check of a different kind is the TE ≈ NDE + NIE decomposition,
      which holds the mediation numbers against a quantity they were not fitted to — and which, for neurons,
      is true by definition and therefore carries no information.

      '
    notes:
      verification: 'Every origin-side convergence the cell names is verbatim. Two qualifications the
        cell does not carry. The two mediator families are not two methods; they are one estimand applied
        to two kinds of unit. And the neuron arm cannot corroborate the decomposition, because footnote
        8 states that TE = NIE-all and NDE-all = 0 hold by definition there. The genuinely method-independent
        convergence the cell cites (Chintam et al., three discovery methods) is post-origin and cannot
        be checked against this source.

        '
      legacy_evidence: 'Two mediator families at origin (neurons and attention heads) give a consistent
        sparsity picture on three datasets, and \S5.4 adds the TE $=$ NDE $+$ NIE decomposition as a third
        internal consistency check. Later independent convergence is explicit: \citet{chintam2023identifying}
        run mediation analysis, automated circuit discovery and DiffMask+ on the same phenomenon and report
        ``significant overlap in the identified components despite huge differences in computational requirements'''''
  C4:
    name: Discriminant validity
    status: U
    short: No second construct is ever localised, so nothing can separate from it
    verified: true
    reasoning: 'Nothing in the source separates the bias mechanism from a mechanism for gender competence,
      because no second construct is ever localised. The outcome is a ratio over two pronouns and nothing
      else is measured, so there is no quantity on which a competence mechanism could show up and no overlap
      statistic could be computed. Where the two constructs collide the paper handles it by deletion:
      definitionally gendered professions are dropped from the total-effect calculation rather than analysed
      as the contrasting case. U.

      '
    notes:
      verification: 'The Appendix A.1 exclusion is verbatim and is the cell''s strongest point. CORRECTION
        to the cell: the §5.3 coreference passage it calls "the nearest passage" reports other people''s
        identifications — Vig (2019) on head 5-10 and Clark et al. on a BERT head — rather than a measurement
        made in this paper. The cell''s description of it as "a qualitative aside" is right, but a reader
        could take the attribution as the source''s own. Veloso & Schütze is post-origin.

        '
      legacy_evidence: \textbf{Unattempted, and it is the criterion the claim's name presupposes.} ``Gender
        bias circuit'' presupposes separation from lexical gender competence. The paper never localises
        a gender-competence mechanism, so no overlap statistic exists; it removes the relevant items instead,
        excluding definitionally gendered professions from the total-effect calculation (Appendix A.1).
        The nearest passage, \S5.3's remark that head 5-10 was ``previously identified \ldots as relating
        to coreference resolution based on visual inspection,'' is a qualitative aside about a different
        construct. Veloso \& Sch\"utze (2026) later run the test on Llama-3.1-8B and Olmo-7b and find
        severe entanglement, but on lexical rather than grammatical gender and on no model this paper
        used
  C5:
    name: Nomological validity
    status: C
    short: Pearl's estimands used under his definitions, with the conditions stated
    verified: true
    reasoning: 'The theory is imported rather than borrowed by analogy. TE, NDE and NIE are Pearl''s estimands,
      used under his definitions and cited to him, and the paper does the work an import requires. It
      identifies the condition under which the linear-model decomposition survives in a non-linear network,
      matches that condition to the literature''s no-interaction assumption, proves the implication in
      an appendix and then measures the residual instead of asserting it. The identification assumptions
      mediation analysis needs are stated against the causal-inference literature rather than waved at.
      C.

      '
    notes:
      verification: 'Footnote 7, the Appendix E no-interaction passage and the §6 identification-assumption
        sentence are verbatim, so the cell''s account of the import is accurate throughout. One addition
        the cell omits: Appendix E does not only prove the implication, it fits the two sides of Eq. 11
        against each other and reports a coefficient of 1.04, an intercept of 0.00 and R2 = 0.78, which
        is what turns the approximate decomposition into a measured claim.

        '
      legacy_evidence: 'Imported wholesale from an existing formal theory rather than analogised: Pearl''s
        mediation formalism, with TE, NDE and NIE defined as in \citet{pearl2001direct} and identification
        assumptions discussed against Imai et al.\ and VanderWeele. Footnote 7 states which decomposition
        results transfer to a non-linear model and which need an added no-interaction condition, proved
        in Appendix E'
  M1:
    name: Reliability
    status: PC
    short: Dispersion reported where it is incidental and absent where it is load-bearing
    verified: true
    reasoning: 'Estimates are averages over a stated population and dispersion is reported wherever the
      paper has a story about dispersion: standard deviations for the gender-neutral effects, spread across
      templates in the validation check, higher variance in the non-GPT-2 models. None of it reaches the
      numbers the claim rests on. The per-head and per-neuron indirect effects that establish sparsity
      are single point estimates, and the ten-head set is reported once, from one selection run, with
      no resampling and no interval on the saturation point. Dispersion where it is incidental and none
      where it is load-bearing is PC.

      '
    notes:
      verification: 'The 2,873-example count, the four gender-neutral total effects with their standard
        deviations and the cross-model variance remark are verbatim, so the cell reports them correctly.
        Confirmed by full read: the strings "confidence interval", "bootstrap" and "seed" do not appear
        anywhere in the paper, and no repeated-run protocol is described for any reported effect.

        '
      legacy_evidence: Effects are means over 2,873 Professions examples with standard deviations reported
        for the gender-neutral arm (``total effects of 8.3, 7.5, 9.6, and 12.5, all with standard deviations
        $<$ 10,'' \S5.1) and variance across models noted in \S5.5. No repeated runs, no seeds, no confidence
        intervals on the head-level or neuron-level effects that carry the sparsity claim, and no bootstrap
        on the top-10 head set
  M2:
    name: Baseline separation
    status: C
    short: An untrained model matched on everything but training, run at both levels
    verified: true
    reasoning: 'The negative control is matched on everything that could otherwise explain the result
      — same architecture, same parameter count, same datasets, same estimator — and differs only in having
      been trained. It is carried through both mediator families rather than reported once: it appears
      in the total-effect table, in the head-level heatmap and in the neuron curves. Separation is large
      where the claim is made, 0.12 against 112.28 on Professions, and the head-level structure is absent
      rather than merely weaker. A matched control that separates at both levels is C.

      '
    notes:
      verification: 'The Table 1 random-init row and both "did not find" statements are verbatim, and
        the cell''s locators are right. One qualification the cell does not carry: separation is not uniform
        across datasets. On Winobias the untrained model''s total effect is 0.07 against GPT2-small''s
        0.25, a factor of about 3.5, while on Professions it is 0.12 against 112.28. The paper''s "much
        smaller" is fair as an average and does not license reading the control as showing no effect.

        '
      legacy_evidence: 'A randomly initialised GPT2-small is carried through the main analyses as a matched
        negative control. It separates at both levels: total effects ``much smaller, indicating that it
        is the training that causes gender bias'''' (Table 1, \S5.1), and no head-sparsity structure ---
        ``We did not find similar behavior in a randomly initialized model, indicating that these patterns
        do not occur by chance'''' (\S5.2), with the neuron version in Figure 17'
  M3:
    name: Stability
    status: PC
    short: Selection rule and outcome scale both varied; the target word is not
    verified: true
    reasoning: 'Two perturbations are run and both hold. The mediator-selection rule is varied between
      a greedy marginal-gain search and a top-k rank, and the saturating fraction of heads is stable across
      four model sizes and both Winograd datasets. The outcome scale is varied four ways and the sparsity
      and size patterns survive. The treatment is varied across datasets but not within one: each dataset
      has a single substitution scheme, so nothing tests whether a different anti-stereotypical target
      word would move the same mediators. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, two parts. First, the phrase it attributes to §5.5 —
        "consistent results under multiple metrics" — is in §6, the Discussion; §5.5 reports the masked-LM
        disagreement instead, which points the other way. Second, the cell says the treatment is "one
        profession-substitution scheme, never varied". The paper runs three treatments: set-gender toward
        man/woman on Professions (§3.2), the gender-neutral variant toward person with they as the measured
        continuation (§3.3), and swap-gender on the Winograd sets (§3.4). The E1 cell states the last
        two correctly, so the two cells disagree. What is genuinely unvaried is the substitution scheme
        inside each treatment. A third, smaller point: the cell says Greedy and Top-k "agree that 10 heads
        suffice"; the paper states the number 10 once without attributing it to either algorithm, and
        the agreement is read off Figure 5b.

        '
      legacy_evidence: 'Mediator-selection perturbation is run: G\textsc{reedy} and T\textsc{op-k} head
        selection are compared and agree that 10 heads suffice (\S5.2, Appendix D). Metric perturbation
        is run: \S3.5 defines total-variation and normalised-difference alternatives and Appendices report
        them, with \S5.5 reporting ``consistent results under multiple metrics.'''' The perturbation not
        run is of the treatment itself --- one profession-substitution scheme, never varied'
  M4:
    name: Calibration
    status: PC
    short: A fixed point at 1 and a sign convention; the effect scale has no referent
    verified: true
    reasoning: 'The bias measure has what a calibrated scale needs: a fixed point at 1 that means indifference,
      a sign convention on either side of it, and a worked example that carries real probabilities through
      to a total effect of 92.6. The effect scale inherits the fixed point, so zero means the gender edit
      changed nothing. Two things are uncalibrated. Comparison across datasets, which the paper rules
      out itself, and behavioural meaning: nothing says what a total effect of 0.25 rather than 1.05 does
      to any observable other than the ratio it is computed from. PC.

      '
    notes:
      verification: 'FLAG — the legacy evidence puts a paraphrase inside quotation marks. It renders the
        §5.1 sentence as TE magnitudes "are difficult to compare" across the three datasets "because of
        their different nature". The second fragment is verbatim; the first is not. The paper reads "It
        is difficult to compare effect magnitudes in the three datasets because of their different nature."
        The substance of the cell is unaffected. The Figure 4 arithmetic and the y(u) = 1 fixed point
        are verbatim.

        '
      legacy_evidence: 'The effect scale is meaningful and anchored: $y(u)=1$ is defined as unbiased,
        and TE is a ratio-of-ratios minus one with a worked arithmetic example (Figure 4, $13.1/0.14-1
        \approx 92.6$). Uncalibrated in one respect the authors name: TE magnitudes ``are difficult to
        compare'''' across the three datasets ``because of their different nature'''' (\S5.1), and no
        external scale fixes what a TE of 0.25 versus 1.05 means behaviourally'
  M5:
    name: Sensitivity
    status: PC
    short: Effects track published occupational statistics, but at the wrong level
    verified: true
    reasoning: 'The instrument is checked against a quantity known to be present outside the model. Profession-level
      total effects track published occupational gender statistics at 0.35 to 0.45, and the weaker Winograd
      correlation is reported alongside, so the check has a direction and a case where it comes out worse.
      It is not a sensitivity test in the strict sense: the ground truth is a correlate of the treatment,
      not a mediator of known size planted inside the model, so the experiment cannot say what indirect
      effect the method would fail to detect. Real known-positive at the wrong level is PC.

      '
    notes:
      verification: 'Both correlation ranges are verbatim and the cell reports them correctly. The first
        sentence carries a footnote marker between "external gender bias" and "and the log-total effect",
        so it is recorded as two adjacent fragments. Confirmed by full read: no planted, synthetic or
        otherwise known-magnitude mediator is inserted and recovered anywhere in the paper.

        '
      legacy_evidence: 'The known-positive is external rather than planted: profession-level effects correlate
        with published occupational gender statistics, ``moderate positive correlations between the external
        gender bias and the log-total effect, ranging from 0.35 to 0.45 over the different models''''
        (\S5.1). That shows the instrument tracks a quantity known to be present. No mediator with a known
        ground-truth effect is inserted and recovered'
  M6:
    name: Invariance
    status: C
    short: Six axes tested, and where the invariance stops is reported too
    verified: true
    reasoning: 'Invariance is tested along more axes than the criterion usually sees — five GPT-2 sizes,
      three datasets, two mediator families, four metrics, six model families — and the answer differs
      by axis. Inside the autoregressive family the sparsity and decomposability patterns hold and the
      paper says which conclusion that licenses. Outside it the neuron-level pattern does not transfer,
      and the paper reports the failure in its own words and declines to explain it. Reporting where the
      invariance stops, rather than only where it holds, is what earns C.

      '
    notes:
      verification: 'The §5.5 failure sentence is verbatim; the legacy evidence truncates it before "in
        results", which the full sentence carries. Two locator corrections. The "four metrics" enumeration
        is in Appendix F, not §3.5 — §3.5 defines the three alternates without counting them against the
        primary. The six model families are named in §4.1; §5.5 reports their results.

        '
      legacy_evidence: 'Reported across five GPT-2 sizes, three datasets, two mediator types, four effect
        metrics (\S3.5), and six model families (\S5.5). The paper reports where invariance \emph{fails}
        rather than only where it holds: ``None of the non-GPT2 models seem to share the exact same pattern
        that we have observed with GPT2 variants \ldots We do not have a compelling theory to explain
        these differences'''' (\S5.5)'
  M7:
    name: Selection correction
    status: U
    short: Pool, rule and shortcut all disclosed; nothing corrected for multiplicity
    verified: true
    reasoning: 'Selection is disclosed completely. The candidate pool, the search rule, the retained set
      size and the computational shortcut are all stated, and Appendix D goes further and names the optimisation
      problem being approximated together with the approximation guarantee. What never happens is any
      accounting for the search. The headline effect is the value of a greedy maximum over 144 candidates,
      quoted at its selected size, with no null distribution for that maximum and no correction for the
      number of comparisons the selection involved. Full disclosure with zero correction is U.

      '
    notes:
      verification: 'The Greedy and Top-k definitions, the 144-head pool, the top-5% neuron rule and footnote
        6''s 96-neuron sets are verbatim, so the cell''s "N is fully stated at every stage" holds. CORRECTION
        to the cell: it gives the layer range as "12--48"; Table 1 lists GPT2-distil at 6 layers, so the
        range across the audited models is 6 to 48. Confirmed by full read: no multiplicity correction,
        permutation null or false-discovery control appears anywhere.

        '
      legacy_evidence: Unattempted. $N$ is fully stated at every stage --- 144 heads, 12--48 layers, top-5\%
        of neurons, sets of 96 neurons ``for computational reasons'' --- and $k$ is chosen by an explicit
        search (G\textsc{reedy} ``iteratively selects the head with the maximal marginal contribution'').
        Headline numbers are reported at the selected $k$ with no multiplicity control and no null distribution
        for best-of-144 selection
  I1:
    name: Necessity
    status: N/A
    short: Neither estimand can be put in the form necessity requires
    verified: true
    reasoning: 'Necessity asks what the behaviour does when a component is gone. Neither estimand in this
      design can be put in that form. The NDE applies the treatment while pinning the mediator at the
      value it already had; the NIE writes the treated value of the mediator into an otherwise untreated
      run. Both are substitutions of one value for another, and under both the component remains in the
      forward pass computing something. Nothing is removed, zeroed, mean-ablated or detached anywhere
      in the paper, and the subset searches choose which mediators to set rather than which to drop. The
      criterion is inapplicable to the design rather than skipped inside it, which is what N/A records.

      '
    notes:
      verification: 'Both estimand definitions are verbatim, including the paper''s own typo "It its computed".
        This confirms the cell''s reading that the N/A is structural: the design''s two operations are
        substitutions by construction, so no removal experiment is available without changing the estimand.
