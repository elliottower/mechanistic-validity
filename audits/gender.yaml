claim: gender
verdict: Causally Suggestive
readings:
- statement: Ten of 144 attention heads carry the indirect effect of a gender edit on the pronoun probability
    ratio, and neurons combine synergistically to produce it
  verdict: Causally Suggestive
  missing: Specificity, which has no second outcome to register on (I4); necessity, which the design's
    substitution estimands cannot express (I1); correction for a greedy maximum over 144 candidates (M7);
    and dispersion on the head-level and neuron-level effects that carry the sparsity claim (M1)
  primary: true
- statement: These components mediate gender bias rather than gender processing
  verdict: Underdetermined
  missing: A localised gender-competence mechanism to compute an overlap against; none is measured, and
    the definitionally gendered professions that would carry the test are excluded from the total-effect
    calculation (C4, V3, I5)
  primary: false
- statement: Training is what installs the sparse mediation structure
  verdict: Underdetermined
  missing: A trajectory. The coupling is a single endpoint contrast against one untrained model whose
    total effects are small rather than absent --- 0.07 on WinoBias against GPT2-small's 0.25 (I12) ---
    with no intermediate checkpoint anywhere (I11)
  primary: false
- statement: The effect grows with model size and the pattern holds across model families
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: the neuron-level pattern does not transfer to the masked language
    models and the authors state they have no theory for the difference (E4, M6), and the size trend holds
    on the Winograd sets but not on Professions, where model size is not well correlated with total effect
    (E4)'
  primary: false
