    in the design'
- name: Mechanistically Supported
  requires: Sufficiency (I2); reach (E1); specificity (I4)
  missing: '\textbf{I4} unattempted and structurally so: the outcome is a two-element set, so nothing
    off-target can register; \textbf{E1} one intervention family throughout'
- name: Triangulated
  requires: Convergence (C3); replication (E2/E4); dissociation (I6)
  missing: '\textbf{I6} unattempted; \textbf{E4} the neuron-level pattern fails outside the autoregressive
