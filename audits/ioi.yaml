criteria:
  C1:
    name: Falsifiability
    status: C
    short: 26 heads named with roles; criteria stated as failable quantities
    verified: true
    reasoning: 'Each of the 26 heads carries a role assignment tied to a path-patching prediction that
      the experiment could have contradicted, and the three validation criteria are stated as quantities
      with the direction of failure fixed before they are computed. The strongest evidence that the criteria
      are live is that the paper reports failing one of them and says so in the introduction. Falsifiable
      and falsified in part is C.

      '
    notes:
      verification: 'Head count checks out against Figure 2: 2 Previous Token, 3 Duplicate Token, 4 Induction,
        4 S-Inhibition, 2 Negative Name Mover, 3 Name Mover, 8 Backup Name Mover = 26. §1 gives the density
        as "1.1% of the total number of (head, token position) pairs." The legacy evidence''s "greedy
        incompleteness up to 3.09" is verbatim.

        '
      legacy_evidence: Twenty-six heads are named with role assignments, each making a path-patching prediction
        that could have failed. The three validation criteria are stated as quantities with failure conditions
        before they are computed, and the circuit fails one of them (their \S4.1, greedy incompleteness
        up to 3.09)
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Causally
        Suggestive, blocked above that by E1=I, I4=I. The 35-criterion table scores the primary reading,
        so the criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: PC
    short: Weight-level for two of seven classes; three omissions the authors name
    verified: true
    reasoning: 'Weight-level validation exists and is quantitative for the two Name Mover classes: the
      copy score pushes the residual stream through the head''s OV matrix and the unembedding, and it
      separates from an average head by a wide margin in both directions. For the remaining classes the
      paper names the parameter-level checks it would need and states it did not run them, and §5 records
      that one class''s attention pattern is not understood at all. Structural evidence present for some
      classes and explicitly absent for others is PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, arithmetical. The legacy evidence says weight-level
        analysis is "explicitly not done" for "four of the seven classes". The paper names two classes
        in §3.3 (Duplicate Token, Induction) and one more in §5 (S-Inhibition). Previous Token Heads and
        Backup Name Mover Heads get no weight-level analysis either, so five of seven lack it and three
        are named as omissions by the authors. Four is neither count. The legacy evidence quotes "checks
        that we omitted due to time constraints"; the paper reads "additional checks that we omitted due
        to time constraints". The 95%/20% and 98%/12% figures are verbatim.

        '
      legacy_evidence: 'Weight-level analysis exists for one head class: the OV copy score reaches $>$95\%
        for all three Name Movers against $<$20\% for an average head, and 98\% negative copy score for
        the Negative Name Movers (their \S3.1). For four of the seven classes it is explicitly not done
        --- \S3.3 lists QK collision detection, OV positional copying, and Elhage-style parameter analysis
        as ``checks that we omitted due to time constraints,'''' and \S5 states the S-Inhibition Heads''
        attention patterns are not understood'
  C3:
    name: Convergent validity
    status: PC
    short: Five evidence types, but only three share the mean-ablation primitive
    verified: true
    reasoning: 'Five method families appear at origin and they agree on the head assignments. They are
      not five independent instruments. Path patching, knockout and activation patching are three granularities
      of one primitive, mean ablation against p_ABC, so agreement among them is close to arithmetic. The
      two that are genuinely independent of ablation — the OV copy score, computed from weights alone,
      and attention-pattern inspection — are applied to some head classes and not others. Convergence
      is real and partial, which is PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL''S `short`, which reads "Five families at origin, all
        descended from ablation". Two of the five are not: the OV copy score (§3.1) is a weight computation
        with no intervention, and attention-pattern inspection is observational. Three of the five share
        the mean-ablation primitive. The steelman of the `short` is that head *identification* always
        starts from path patching and the other families only characterize heads already selected — true,
        and a sharper statement than the one recorded. The post-origin agreement (ACDC, EAP, EAP-IG, SAE
        circuits, edge pruning) is not verifiable against this source.

        '
      legacy_evidence: 'Five families at origin: path patching, attention-pattern inspection, weight-level
        copy scores, out-of-distribution validation on repeated random tokens (Appendices H, I), and a
        behavioral adversarial test (\S4.4). Later agreement is broad --- ACDC \citep{conmy2023towards},
        EAP \citep{syed2023attribution}, EAP-IG \citep{hanna2024faith}, SAE circuits (O''Neill \& Bui
        2024), edge pruning (Bhaskar et al.\ 2024) all recover overlapping head sets. The cap is that
        agreement is method-conditional: seven independent groups report that varying the ablation or
        the metric changes the recovered set'
  C4:
    name: Discriminant validity
    status: I
    short: 78\% head overlap with Colored Objects; opposite result elsewhere
    verified: false
    reasoning: 'NOT SETTLED BY THE SOURCE. The paper never compares the IOI circuit against a circuit
      for a different task, in this or any model, so nothing in it bears on whether the construct separates
      from a neighboring one.

      '
    notes:
      verification: 'Read in full. The only cross-setting material is the GPT-2 medium note in §5, which
        is cross-model (E4), and the repeated-random-token validations in Appendices H and I, which test
        the same components on a different distribution rather than against a competing construct. Merullo
        et al. and Hanna et al. are post-origin and cannot be checked here.

        '
      legacy_evidence: Tested twice with opposite results in different models. \citet{merullo2024circuit}
        find 25/32 = 78\% head overlap between the IOI and Colored Objects circuits in GPT-2 \emph{Medium}
        at a top-2\% threshold, against 3/18 for Greater-Than as a control; \citet{hanna2024faith} find
        cross-task faithfulness near zero for most task pairs in GPT-2 \emph{small}, with the smallest
        EAP circuit containing $\geq$90\% of the manual IOI nodes reaching 0\% faithfulness. Different
        models, different quantities, unreconciled
    refs:
    - citation: merullo2024circuit
      text: thresholding at the 2% most important heads for each circuit, we find that 25/32, or 78% of
        the circuit is shared
      section: body
      page: null
      direction: lowers
      local: reference/merullo_2024_circuit_reuse.pdf
      sha256: e4b5a79c6280723859cbfd7405cb57bf5c11c983995a6b98a9c83bb381e65266
      extract_cmd: pdftotext -layout
    - citation: hanna2024faith
      text: we cannot assess whether overlap predicts faithfulness, without any task pairs whose circuits
        exhibit cross-task faithfulness
      section: body
      page: null
      direction: raises
      local: reference/hanna_2024_faithfulness.pdf
      sha256: 387cd4f2125ccfbf34ce9ab2a3105a93945ad8c67908786e0be08d28c17e4719
      extract_cmd: pdftotext -layout
  C5:
    name: Nomological validity
    status: PC
    short: Induction-head theory applied operationally; no formal derivation
    verified: true
    reasoning: 'The circuit is connected to induction-head theory operationally rather than by analogy:
      the paper imports Olsson et al.''s own two-part definition, runs both tests on repeated random sequences,
      and reports that heads 5.5 and 6.9 pass. The connection then breaks in an informative way. The heads
      satisfy the induction definition and do something else inside this circuit, supplying a positional
      signal, and the paper states it did not investigate how. Theory applied and found not to transfer,
      with no derivation replacing it, is PC.

      '
    notes: &id001
      verification: 'The legacy evidence''s quoted phrase "in the context we study, Induction Heads perform
        a different function compared to what was described in their original discovery" is verbatim (§3.3),
        and the top-five ranking is verbatim (Appendix H). One correction: the cell says the heads serve
        "as positional signals (§3.3)"; the paper says their *outputs* are used as positional signals
        for S-Inhibition values, which is a claim about where the output is read, not about what the head
        computes.

        '
      legacy_evidence: 'Connected to induction-head theory through its operational definition, not by
        analogy: Appendix H applies Olsson et al.''s prefix-matching and copying scores on repeated random
        sequences and 5.5, 6.9 rank among the top five induction heads. The theory does not survive contact
        --- ``in the context we study, Induction Heads perform a different function compared to what was
        described in their original discovery,'''' serving as positional signals (\S3.3), a mechanism
        the paper does not explain'
  C6:
    name: Complementation validity
    status: U
    reasoning: Unattempted. The circuit is carved into seven named classes, and no test establishes that
      the carving is functional. The class-level knockouts remove one class at a time, which leaves a
      set of distinct complementation groups indistinguishable from a single group whose members share
      one role. The trans comparison needs two ablation runs and a composition rule, and the cis control
      is available in the same design.
    short: Seven named classes, knocked out one at a time; no trans comparison
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: I
    short: SDs plotted for attention probabilities; none on faithfulness
    verified: true
    reasoning: 'Sample sizes are disclosed for every estimate the paper computes, and dispersion is shown
      where the quantity is an attention probability. The quantity the argument rests on gets neither:
      faithfulness is reported once, as 0.46, with no interval, no resampling and no per-example spread,
      and the same holds for the incompleteness and minimality scores. Dispersion reported for the peripheral
      measurements and withheld from the central one is I.

      '
    notes:
      verification: 'All five N values in the legacy evidence check out: N > 200 (Appendix B), N = 500
        (§3.1 attention-vs-projection correlation), N = 1000 (§3.1 copy score), 100,000 (§2 model baseline).
        Standard deviations appear in Figures 4c and 10 as the cell states. No confidence interval or
        bootstrap appears anywhere in §4 or Appendix K. The Méloux et al. Jaccard figures are post-origin.

        '
      legacy_evidence: 'Partial at origin: standard deviations are plotted for Name Mover attention probabilities
        (Figures 4c, 10), $N$ is stated for every estimate ($N > 200$ path-patching pairs, $N = 500$ and
        $N = 1000$ for copy scores, 100{,}000 for the model baseline). No bootstrap or confidence interval
        on faithfulness. Measured later and the answer is middling: M\''eloux et al.\ (2025) report mean
        pairwise Jaccard 0.67 under bootstrap resampling on gpt2-small IOI, against the 0.8 bar those
        authors propose, rising to 0.88--0.89 under paraphrase resampling'
  M2:
    name: Baseline separation
    status: PC
    short: Na\"ive circuit scores 0.1 against the full circuit's 0.46
    verified: true
    reasoning: 'Three baselines are present in the source and the quotes fix what each one is. The copy-score
      baselines are average-head comparisons and separate cleanly (>95% vs <20%; 98% vs 12%). The completeness
      test carries a random-subset baseline, ten uniformly sampled K. The circuit-level baseline is the
      naïve circuit of §4.3, and it does not separate on faithfulness: the paper''s own word is "comparable,"
      and because faithfulness is defined as the gap |F(M) - F(C)| the naïve circuit''s 0.1 is a *smaller*
      gap than the published circuit''s 0.46. Separation between the two circuits comes only from the
      completeness tests, and even that is partial, since the greedy sampler gives both circuits similarly
      large incompleteness scores. That pattern — baselines present, one of them failing to separate on
      the headline quantity — supports PC.

      '
    notes:
      verification: 'RESOLVES THE RECORDED CONTRADICTION. audit_tables_full/ACH_IOI.tex line 45 ("A naïve
        circuit reaches faithfulness 0.1 against the full circuit''s 0.46, §4.3") and mechanistic_validity_v17.tex
        line 786 ("the paper''s own naïve baseline circuit reaches comparable faithfulness, §4.3") are
        both factually correct against the source and are not in conflict. The paper defines faithfulness
        as the absolute gap |F(M) - F(C)| in logit-difference units, so lower is better; 0.1 and 0.46
        are gaps, not scores where higher is better. The naïve circuit''s gap is 0.1 against a model baseline
        of F(M) = 3.56, i.e. it reproduces roughly 97% of the model''s logit difference against the published
        circuit''s 87%. On the paper''s own headline quantity the naïve circuit is the better of the two.
        The residual problem is presentational: the ACH_IOI.tex phrasing "0.1 against the full circuit''s
        0.46" reads, under the ordinary convention that higher faithfulness is better, as the naïve circuit
        being four times worse. That cell should state the direction (lower is better, it is a gap) or
        the reader will invert it. UNITS: logit difference between the IO and S tokens, averaged over
        p_IOI, not a probability and not normalized. F(M) = 3.56 over 100,000 examples (§2). SOURCE ERROR:
        §4.3 cites "(Figure 6a)" for the naïve circuit''s completeness results, but the Figure 6 caption
        assigns (a) to "our circuit" and (b) to "a naive circuit," and the panel headers read "Full circuit
        completeness tests" and "Naive circuit completeness tests." The §4.3 reference should be Figure
        6b. Math notation in the quotes is normalized from the PDF''s typeset form (the pdftotext layout
        extraction renders it as "|F (M ) − F (C)|").

        '
      legacy_evidence: Three baselines exist and one of them fails to separate. The na\"ive baseline circuit
        scores 0.1 against the published circuit's 0.46 on a measure where lower is better, so the origin
        calls it ``comparable to the full circuit $C$'' (\S4.3); separation comes only from the completeness
        tests, and under greedy search ``both circuits have similarly large incompleteness scores.'' Ten
        uniformly-random subsets $K$ are sampled in the completeness test (Figure 6). Copy scores carry
        an average-head baseline ($>$95\% vs $<$20\%; 98\% vs 12\%). What is missing is a capacity-matched
        random \emph{circuit} null for the 87\% figure; Shi et al.\ (2024) supply it later, finding IOI
        significantly more faithful than random circuits up to 90\% of model size
  M3:
    name: Stability
    status: D
    short: Six method choices move the same quantity below 0\% to over 100\%
    verified: true
    reasoning: 'The source runs no stability analysis: every reported number comes from one ablation value,
      one metric and one dataset, and no quantity is recomputed under a varied methodological choice.
      Two origin-side remarks bear on stability and point in opposite directions. Zero ablation is reported
      as noisy relative to mean ablation, which is an observation that the choice of ablation value moves
      results, though no numbers are given. Against that, the paper asserts the circuit is robust to which
      Backup Name Movers are included, without supporting data. The recorded D therefore rests entirely
      on post-origin work, which this source cannot settle.

      '
    notes:
      verification: 'The status D is NOT verifiable against this source. Miller et al., Zhang & Nanda
        and Méloux et al. are all post-origin and none of their quantities appear here. What the source
        does show is that the origin ran no stability check, which is consistent with D but does not establish
        it. Closest origin analogue: the completeness result in §4.1 is itself an instability across sampling
        strategies for the same quantity — random and by-class sampling give small incompleteness scores,
        greedy sampling gives up to 3.09. That is a search strategy varying, not a metric or ablation
        varying, so it belongs to I5 rather than M3, but it is the only place the origin recomputes one
        number under a changed procedure and gets a different answer.

        '
      legacy_evidence: 'Tested by five independent groups and failed. \citet{miller2024transformer} vary
        six methodological choices and the same quantity ranges ``from below 0\% to well over 100\%,''''
        with the variant that ``best represents the hypothesis of Wang et al.'''' scoring a median well
        over 100\%. Zhang \& Nanda (2023): symmetric token replacement and Gaussian noising ``detect different
        sets of heads as important'''' for any fixed metric. M\''eloux et al.\ (2025): across estimator
        and aggregation choices on gpt2-small IOI the circuit size ranges from 5 to 21 edges while circuit
        error stays flat at 0.10--0.14'
  M4:
    name: Calibration
    status: PC
    short: Logit difference has sign, null and baseline; faithfulness does not
    verified: true
    reasoning: 'The outcome metric is well calibrated. Logit difference carries a sign, a zero point that
      means indifference between IO and S, and a measured model value of 3.56 over 100,000 examples, so
      a change in it can be read for direction and against a reference. The validation metric inherits
      the units and none of the calibration: faithfulness is an unsigned distance with no upper bound,
      no null value and no stated threshold separating faithful from unfaithful, reported as a single
      average. Calibrated outcome, uncalibrated validation quantity, is PC.

      '
    notes:
      verification: 'The 3.56 baseline and the sign convention are verbatim. The unboundedness of |F(M)
        - F(C)| follows from the definition rather than from any statement; the paper never sets a threshold
        for what counts as faithful, which is the substance of the cell''s complaint. The Miller et al.
        inter-quartile figure and the Mueller et al. CPR/CMD replacement are post-origin. Math notation
        is normalized from the PDF''s typeset form.

        '
      legacy_evidence: 'Logit difference is well chosen --- it has a sign, a null value, and a stated
        model baseline of 3.56. Faithfulness as $|F(M) - F(C)|$ is not calibrated: it has no upper bound,
        is reported as a single average, and \citet{miller2024transformer} show its inter-quartile range
        across examples reaches 50\% with outliers ``tens of thousands of percent.'''' \citet{mueller2025mib}
        replace it with CPR and CMD for this reason'
  M5:
    name: Sensitivity
    status: U
    short: Unattempted; no planted circuit of known extent
    verified: true
    reasoning: 'The source''s validation set is exactly three criteria, all computed on the discovered
      circuit inside the real model. A sensitivity test needs a circuit of known extent to recover — a
      planted or synthetic mechanism — so that a miss can be distinguished from an absence. Nothing of
      that kind appears, so there is no measurement of what the discovery procedure would fail to find.
      U.

      '
    notes:
      verification: 'Verified against a full read rather than a statement of omission: §4 and its subsections
        contain all validation performed, Appendices K and M give its parameters, and no known-positive
        control appears anywhere. The quote bounds the validation set; it does not assert the absence
        directly. Conmy et al.''s reset networks and Mueller et al.''s purpose-trained model are post-origin.

        '
      legacy_evidence: 'Unattempted. No known-positive control: no synthetic IOI circuit of known extent
        is planted in GPT-2 small and recovered. The nearest instruments arrived later and target the
        discovery \emph{method} rather than this circuit --- \citet{conmy2023towards} Appendix L introduces
        reset networks as a hallucination control, and \citet{mueller2025mib} substitutes a purpose-trained
        model whose IOI-like circuit is known by construction'
  M6:
    name: Invariance
    status: D
    short: Faithfulness differs across the origin's own templates
    verified: true
    reasoning: 'The origin''s own distribution contains both name orders and fifteen syntactic frames,
      so any later split between ABBA and BABA is a split inside the set the circuit was validated on.
      The origin never breaks a result down by template or by order; every reported number is an average
      over the whole generator, which is what makes the invariance question answerable only from outside.
      One invariance check does exist and passes: the positional signal survives lengthening the sentence
      prefix, moving logit difference from 3.56 to 3.57.

      '
    notes:
      verification: 'The recorded D is NOT verifiable against this source. Miller et al. and Franco et
        al. are post-origin. What the source supplies is the precondition for their result — both orders
        are in scope — and one passing invariance test the cell does not mention (Appendix A, prefix length).
        A cell recording M6 as tested and failed should note that the origin''s single invariance test
        passed.

        '
      legacy_evidence: 'Tested and failed on the origin''s own template set. \citet{miller2024transformer}:
        faithfulness is ``systematically greater for the prompts of form BABA than prompts of form ABBA.''''
        Franco et al.\ (2026) show the same split in the traced mechanism --- per-prompt IOI circuits
        in GPT-2 Small cluster into an ABBA cluster and a BABA cluster with no substructure from surface
        wording. Zhang \& Nanda (2023): under S2 corruption every metric misses at least two of the three
        Name Movers; under S1+IO corruption all three are found and no S-Inhibition Heads are'
  M7:
    name: Selection correction
    status: U
    short: N is unstated for the post-knockout sweep, the selection step itself
    verified: true
    reasoning: 'Every head class is selected by thresholding a swept quantity over the model''s full head
      set, and the source discloses the sweep, the threshold and the arbitrariness of the cutoff in its
      own words. What it never applies is any correction for the number of comparisons that selection
      involves. The word "significant" is used descriptively throughout, with no test and no null distribution
      behind it. Disclosed selection with no correction is U.

      '
    notes:
      verification: '"We arbitrarily chose" and the 2% threshold are verbatim (Appendix F). The cell''s
        "candidate pool (144 heads)" is arithmetic from §2 (12 layers × 12 heads); the paper never writes
        144. CONTRADICTION WITH THE CELL: it says "The candidate pool (144 heads) and N are stated at
        every step". N is stated for path patching, the copy scores and the model baseline, but not for
        the post-knockout sweep in §3.4 from which the Backup Name Movers are drawn, which is the step
        the criterion is about.

