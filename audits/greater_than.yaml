claim: greater_than
verdict: Mechanistically Supported
readings:
- statement: A subgraph of attention heads and MLPs 8--11 performs greater-than on year-span prompts in
    GPT-2 small
  verdict: Mechanistically Supported
  missing: A second instrument for circuit discovery (C3), a dissociation from the components serving
    the tasks the circuit fails (I6), and a second model (E4)
  primary: true
- statement: The circuit computes the comparison rather than retrieving memorized year associations
  verdict: Underdetermined
  missing: The paper's own structured-number-representation account fails two causal tests and memorization
    is never tested (I5); no experiment separates a lookup table from a computation (V3)
  primary: false
- statement: The circuit implements greater-than as such, firing where the relation applies and not elsewhere
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: two prompts requiring less-than recruit the same circuit and
    the model answers greater, and a non-monotone sequence case does the same (I4, E3)'
  primary: false
- statement: The same circuit is the mechanism for greater-than beyond GPT-2 small
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: the disconfirming evidence is post-origin and in three other
    model families (E4), and the origin itself runs GPT-2 small only and names the gap'
  primary: false
