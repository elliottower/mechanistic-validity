criteria:
  C1:
    name: Falsifiability
    status: C
    short: Probability difference moves +81.7% to -36.6%, past indifference
    verified: true
    reasoning: 'The claim is stated so that it could have come out flat and did not. Probability difference
      carries a sign and a two-sided range, the prediction attached to each component is directional and
      named before the test, and the necessity experiment moves the quantity from +81.7% to -36.6%, past
      the indifference point rather than merely toward it. The second metric is designed against a specific
      way of passing for the wrong reason: a model that always emitted p(99) = 1 would score well on probability
      difference and would show no cutoff at all. Risk taken and survived is C.

      '
    notes:
      verification: 'The legacy evidence''s paraphrase of the cutoff-sharpness rationale is verbatim from
        §2 apart from the opening "In doing so,", which the cell drops. The +81.7% and -36.6% figures
        are verbatim in §2 and §3.2 and are the same quantity, so the sign reversal the cell describes
        is arithmetic rather than inferred.

        '
      legacy_evidence: 'Named components with directional path-patching predictions, and a necessity test
        with an explicit failure mode that could have come out flat: giving circuit nodes the 01-dataset
        and everything else the real dataset takes probability difference from $+81.7\%$ to $-36.6\%$
        (their \S3.2), a sign reversal. The second metric exists to block a degenerate pass --- cutoff
        sharpness ``checks that the model depends on YY, and does not produce constant (but valid) output,
        e.g.\ by always outputting $p(99) = 1$'''' (\S2)'
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Mechanistically
        Supported, blocked above that by E4=D, I6=U. The 35-criterion table scores the primary reading,
        so the criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: PC
    short: Flow located at three granularities; the derivation fails two causal tests
    verified: true
    reasoning: 'Information flow through the circuit is established at three granularities: heads attend
      to the YY position and put YY at the top of the whole vocabulary in unembedding space, MLPs 9 and
      10 show the upper-triangular logit-lens signature of greater-than, and successively larger neuron
      subsets of MLP 10 sharpen into the same pattern. The comparison itself is left open by the authors,
      and their one structural hypothesis about how it might work — number representations with linear
      structure — is put to two causal tests and survives neither. Mechanism located and not derived is
      PC.

      '
    notes:
      verification: 'The 64.7% and 81.7% pair is verbatim in §4.1 and §2 and is a like-for-like comparison:
        both are probability difference on the same behavior, so the LEACE erasure costs 17 points. The
        cell''s "No QK/OV analysis of any head" is verified against a full read rather than against a
        statement: the logit lens is applied to head *outputs* (§3.3), never to a weight product, and
        no attention head''s QK or OV matrix is examined anywhere in the paper or its nine appendices.

        '
      legacy_evidence: 'The information flow is established at three granularities: attention heads attend
        to the YY position and make YY ``the most highly upweighted token across all tokens'''' in unembedding
        space (\S3.3); MLPs 9--11 show an upper-triangular logit-lens pattern; and MLP 10''s top-10, top-100
        and top-200 neurons progressively sharpen into greater-than (\S4.2, Fig.~21). The comparison mechanism
        itself is unresolved by the authors --- ``We cannot provide a conclusive answer'''' (\S4) ---
        and their one structural hypothesis is causally rejected: PCA-dimension ablation gives ``little
        change in model performance,'''' and LEACE erasure of linear YY information leaves 64.7\% against
        an 81.7\% baseline (\S4.1). No QK/OV analysis of any head'
  C3:
    name: Convergent validity
    status: PC
    short: Logit lens and path patching agree; single-method where they do not overlap
    verified: true
    reasoning: 'One cross-validation at origin is genuine and is run for a stated reason: the logit lens
      ignores the final LayerNorm, so Appendix E recomputes every logit-lens result as a direct effect
      measured by path patching, a quantity that carries interpretable units, and the two agree up to
      scale. Circuit discovery has no such second instrument. Every component enters the circuit through
      iterative path patching against one corruption dataset, and the two methods that are independent
      of patching — PCA-dimension ablation and LEACE erasure — converge on a negative result about the
      representation rather than corroborating the mechanism. Agreement where the instruments overlap,
      single-method where they do not, is PC.

      '
    notes:
      verification: 'The legacy evidence renders the Appendix E result as "essentially identical … though
        they differ in magnitude"; the elided words are "to the logit lens results," and the full sentence
        is quoted here. The cell''s characterization of Appendix E as avoiding the LayerNorm nonlinearity
        is the paper''s own stated motivation.

        '
      legacy_evidence: 'Several instruments and one genuine cross-validation: Appendix E reproduces every
        logit-lens result with direct-effect path patching, which avoids the LayerNorm nonlinearity, and
        reports them ``essentially identical … though they differ in magnitude.'''' Against that, circuit
        \emph{discovery} is single-method throughout --- iterative path patching with one corruption dataset
        --- and the PCA and LEACE analyses converge on a negative rather than corroborating the mechanism'
  C4:
    name: Discriminant validity
    status: PC
    short: Three tasks recruit different components; every contrast is one kind
    verified: true
    reasoning: 'Separation from a neighboring construct is tested at origin and found. Three tasks that
      a greater-than mechanism should cover recruit a different set of components entirely, which is the
      result a construct with no boundaries could not produce. The contrasts available are all of one
      kind. Every task the paper compares against changes the operation, the frame, or both, and the design
      is declared qualitative in advance, so nothing isolates the frame while holding the operation fixed.
      Separation shown along one axis is PC.

      '
    notes:
      verification: '"GPT-2 relied on another set of heads and MLPs entirely" is verbatim (§5) and the
        cell attributes it correctly to §5 and Appendix F. The path-patching plots the cell cites are
        Figures 24 and 26 in Appendix F. Merullo et al.''s 3/18 overlap statistic is post-origin and cannot
        be checked here.

        '
      legacy_evidence: 'Tested at origin and confirmed later. \S5 and Appendix F show that on three tasks
        where the circuit should apply and fails, ``GPT-2 relied on another set of heads and MLPs entirely,''''
        with path-patching plots supplied. \citet{merullo2024circuit} then use greater-than as a deliberate
        low-overlap control against IOI: 3/18 = 16.7\% shared components, against 78\% for Colored Objects.
        What is missing is a matched-surface-form non-comparison task --- every contrast either changes
        the operation or changes the frame, never the frame alone'
  C5:
    name: Nomological validity
    status: PC
    short: Placed between memorization and generalization, not derived from either
    verified: true
    reasoning: 'The result is placed inside a named theoretical dichotomy and the placement is the stated
      contribution: the circuit sits between memorization and generalization, and the paper claims to
      add nuance to that pair rather than to pick a side. Two further connections are operational rather
      than rhetorical, since the neuron-level analysis runs on Geva et al.''s key-value reading of feed-forward
      layers and the PCA analysis checks Wallace et al.''s structured number representations in the same
      embeddings. No theory predicts what a comparison circuit should look like, so nothing here is a
      derivation the circuit could have contradicted. PC.

      '
    notes: &id001
      verification: 'The dichotomy sentence is verbatim in §1 and the cell quotes it accurately. The Liu
        et al. sentence is the paper''s only discussion of when a mechanism forms during training, and
        it is about someone else''s toy model, which is why it does not reach I11.

        '
      legacy_evidence: 'Positioned against a named theoretical dichotomy --- memorization versus generalization
        --- and the paper''s contribution is to place the result between them: ``it lies between memorization
        and generalization. We thus add nuance to the memorization-generalization dichotomy'''' (\S1).
        Connected to FFN key-value memories (Geva et al.\ 2021) for the neuron-level analysis and to structured
        number representations (Wallace et al.\ 2019). No formal theory of what a comparison circuit should
        look like'
  C6:
    name: Complementation validity
    status: U
    reasoning: The circuit is divided by role -- attention heads carry the start year, MLPs 8--11 raise
      the logits above it -- and the division is never tested. Direct and indirect contributions are separated
      per MLP, which quantifies each part's share without establishing that the two groups are functionally
      different. No experiment ablates a head and an MLP together and compares that against each alone.
    short: Heads and MLPs divided by role, with no joint ablation to test it
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: U
    short: Dispersion reported twice, both pre-circuit; no interval on any result
    verified: true
    reasoning: 'Dispersion is reported exactly twice and both times for the model''s behavior before
      any circuit exists: 19.3% on probability difference and 7.2% on cutoff sharpness. Every quantity
      that carries the argument — 72.7%, 89.5%, -36.6%, the loss recoveries in §5 — is a single number
      with no interval, no resampling and no per-example spread, and the sweep that selects the circuit
      runs on 490 datapoints for stated computational reasons while the 10,000-example dataset sits available.
      One released checkpoint rules out cross-run variance and rules out nothing else. U.

      '
    notes:
      verification: 'Both standard deviations are verbatim and both are on the behavioral baseline, as
        the cell states. The 490-datapoint sweep and its stated reason are verbatim. Verified against
        a full read for the absence: no bootstrap, confidence interval, repeated run or variance estimate
        appears in the body or in Appendices A through I.

        '
      legacy_evidence: Unattempted. The strings \texttt{seed} and \texttt{standard deviation} occur zero
        and zero times respectively in the body; two SDs are reported and both are on the \emph{behavioral}
        baseline (19.3\% and 7.2\%), never on a circuit result. The main circuit-discovery sweep uses
        490 datapoints ``for computational reasons.'' GPT-2 small is one released checkpoint, so cross-run
        variance is unavailable in principle, but bootstrap over the 10,000-example dataset is not
  M2:
    name: Baseline separation
    status: PC
    short: A size-matched comparison run and reported only in prose
    verified: true
    reasoning: 'A size- and location-matched comparison exists and it is the right comparison to make:
      circuits of comparable extent are scored, and performance is reported to track how much of the original
      path structure they retain. The comparison is delivered entirely in prose. No count of alternative
      circuits, no figure, no distribution and no number appear, so 89.5% has no reference class to sit
      in, and the -36.6% inverted-patch condition supplies a floor rather than a null. A baseline run
      and not reported is PC.

      '
    notes:
      verification: 'The cell''s quotation is verbatim with two elisions it marks: "(especially MLPs 9
        and 10), to the logits" and "(i.e. no attention head or no MLP overlap with the original circuit)".
        Both are restored here. The cell is right that no N, figure or distribution accompanies the passage;
        verified against a full read, the alternative-circuit sweep appears nowhere else in the paper.

        '
      legacy_evidence: 'A size- and location-matched alternative-circuit comparison exists and is reported
        in prose without numbers: ``If we target other circuits of a size and location similar to our
        circuit''s, performance is related to the preservation of the paths from the input, to our attention
        heads, our MLPs …. If the paths are interrupted …, performance is very low. If at least one path
        is preserved, performance improves with each additional component in common with the original
        circuit'''' (\S3.2). No $N$, no figure, no distribution. The $-36.6\%$ inverted-patch condition
        is a floor, and the 89.5\% faithfulness figure has no random-circuit reference'
  M3:
    name: Stability
    status: U
    short: Membership read off heatmaps; no threshold stated, none swept
    verified: true
    reasoning: 'Circuit membership is decided by reading path-patching heatmaps. The paper says a component
      joins when patching it changes performance "significantly", names the components that qualify, and
      states no threshold, sweeps none, and reports no sensitivity of the resulting circuit to where the
      line falls. No member is swapped for a neighbor and no boundary is perturbed, so the circuit''s
      dependence on its own selection rule is unmeasured. U.

      '
    notes:
      verification: 'Verified against a full read: the word "significantly" in §3.2 is the only stated
        criterion for membership anywhere in the paper, and Appendix C, which walks the selection through
        step by step with five further heatmaps, adds no numerical cutoff. Anani et al. (2026) is post-origin.

        '
      legacy_evidence: Unattempted. The circuit boundary is set by visual inspection of path-patching
        heatmaps with no threshold stated or swept, and no head or MLP is swapped for a neighbor to test
        sensitivity. Anani et al.\ (2026) later certify circuit discovery under bounded dataset perturbation
        with greater-than as one of three benchmarks, reporting up to 56\% higher accuracy with 80\% fewer
        components --- the manual circuit carries components certification discards
  M4:
    name: Calibration
    status: PC
    short: Outcome metrics calibrated; the faithfulness quantity is not
    verified: true
    reasoning: 'Both outcome metrics are well calibrated. Each is bounded on [-1, 1], each carries a sign,
      zero means indifference between valid and invalid years, and each has a measured model value over
      10,000 examples to read a change against. The validation quantity inherits none of that. Faithfulness
      is expressed as a percentage of the unpatched model, 89.5%, which is interpretable only against
      a distribution of comparable circuits the paper does not supply. Cutoff sharpness then rises under
      patching, from 6.0% to 8% for the core circuit and 10.5% for the full one, and both increases are
      reported without an account of how a circuit can be sharper than the model it is a subgraph of.
      Calibrated outcome, uncalibrated validation quantity, is PC.

      '
    notes:
      verification: 'All four numbers in the cell check out: 6.0% baseline (§2), 8% core circuit (§3.2),
        10.5% full circuit (Appendix B), and the authors flag both increases as "sharper than pre-patching"
        without interpreting them, as the cell states.

        '
      legacy_evidence: Both metrics are well designed and interpretable, and the second is purpose-built
        as an anti-degeneracy check (\S2). Faithfulness is reported as a percentage of the unpatched model
        (72.7\% is ``89.5\% of the original''), which is meaningful only against a distribution of comparable
        circuits that is not supplied. Cutoff sharpness \emph{rises} under patching (6.0\% $\to$ 8\% core,
        10.5\% full), which the authors note without interpreting
  M5:
    name: Sensitivity
    status: U
    short: Two experiments, both on the real model; no planted mechanism
    verified: true
    reasoning: 'The validation set is exactly two experiments, the complement and its inverse, and both
      run on the real model where the true circuit is the object under dispute. A sensitivity test needs
      a mechanism of known extent — planted, compiled or synthetic — so that a component the pipeline
      fails to recover can be distinguished from a component that was never there. Nothing of that kind
      is constructed, so the detection floor of iterative path patching is unmeasured. U.

      '
    notes:
      verification: 'Verified against a full read. The quotes bound the validation set rather than asserting
        the absence: §3.2 contains both directions of the circuit evaluation, Appendix B repeats them
        for the full circuit, and Appendix F repeats them for the generalization tasks. No known-positive
        control appears in any of them.

        '
      legacy_evidence: 'Unattempted. No known-positive control: no synthetic or compiled circuit of known
        structure is planted in a comparable model and recovered by this pipeline, so the method''s detection
        floor is unquantified'
  M6:
    name: Invariance
    status: PC
    short: Per-condition variation visible; one tokenizer, one model, one frame
    verified: true
    reasoning: 'The design makes per-condition variation visible instead of averaging it away. Every behavioral
      result is a heatmap over start year crossed with predicted year on 10,000 examples spanning 120
      nouns and 768 years, so a reader can see where the account holds. One non-invariance is documented
      and costed: attention to the YY position varies non-monotonically with YY, bottoms out at YY=01,
      and patching queries and keys costs 15% of partial-circuit performance. The conditions that would
      test the claim hardest stay fixed. One tokenizer, one model, one century range, one sentence frame.
      PC.

      '
    notes:
      verification: 'The 120 nouns, 768 years and 10,000 examples are verbatim, as is the 15% figure and
        the YY=01 dip. Note that YY=01 is the corruption value used throughout the paper, so the condition
        the circuit is validated against is the condition where the attention the circuit depends on is
        weakest; Appendix B reports this without drawing that consequence.

        '
      legacy_evidence: Behavior is measured across 120 nouns and 768 years on 10,000 examples, and every
        result is presented as a heatmap over start year YY $\times$ predicted year, so per-condition
        variation is visible rather than averaged away. Appendix B, Figure 11 documents one such variation
        and its consequence --- attention to the YY position varies non-monotonically with YY, is low
        at YY=01, and patching the queries and keys costs 15\%. Not checked across models, tokenizers,
        or centuries outside $\{11,\ldots,17\}$
  M7:
    name: Selection correction
    status: U
    short: Every candidate screened and disclosed; no multiplicity control
    verified: true
    reasoning: 'The selection is disclosed completely and corrected nowhere. Every candidate is screened
      — 144 heads and 12 MLPs against the logits, then the sweep repeats through MLPs 11, 10, 9 and 8,
      then all 3072 neurons of MLP 10 individually — and the paper states the pool at each stage. The
      same probability-difference metric picks the components and then scores the circuit they compose,
      so the reported recovery is measured on the quantity that selected its parts. "Significantly" is
      used with no test and no null distribution behind it. Disclosed selection with no multiplicity control
      is U.

      '
    notes:
      verification: 'The 144-head pool and the 3072-neuron sweep are verbatim, so the cell''s "N is stated
        at each stage" is right; note that the paper writes 144 itself, unlike Wang et al. Verified against
        a full read for the absence of any correction, null distribution or significance test.

        '
      legacy_evidence: Unattempted. 144 heads plus 12 MLPs are screened for direct effects on the logits,
        then the procedure repeats through MLPs 11, 10, 9, 8, then 3,072 neurons of MLP 10 are screened
        individually --- and the same probability-difference metric selects the components and then scores
        the assembled circuit. $N$ is stated at each stage; no multiplicity control is applied at any
  I1:
    name: Necessity
    status: C
    short: 'A sign reversal rather than degradation: +81.7% to -36.6%'
    verified: true
    reasoning: 'The necessity test is the strong form. Routing the 01-dataset through the circuit while
      the rest of the model receives real input drives probability difference to -36.6% against a +81.7%
      baseline, so the model stops preferring valid years and starts preferring invalid ones. Degradation
      alone would be consistent with the circuit carrying part of a distributed signal; a sign reversal
      says the circuit''s output is what determines which side of YY the mass falls on. C.

      '
    notes:
      verification: 'Both figures are verbatim and are the same metric, so the reversal is direct rather
        than inferred. The cell reports them correctly.

        '
      legacy_evidence: 'The inverted-patch test is a strong necessity result: routing the 01-dataset through
        the circuit while the rest of the model receives real input drives probability difference to $-36.6\%$
        from a baseline of $+81.7\%$, so the model does not merely degrade --- it reverses (\S3.2)'
  I2:
    name: Sufficiency
    status: C
    short: Complement recovers 72.7% under conditions chosen to favor failure
    verified: true
    reasoning: 'The complement test is run under conditions that favor failure and it passes. Every path
      outside the circuit carries 01-input, which the authors state should push the model to poor performance,
      and the circuit alone recovers 72.7% of a 81.7% baseline. The anti-degeneracy metric moves the same
      way: cutoff sharpness rises to 8%, so the recovered behavior still depends on YY rather than collapsing
      onto a constant prediction. Appendix B repeats the test for the full input-to-logits circuit and
      reaches 71.5% and 10.5%. C.

      '
    notes:
      verification: 'All five numbers in the cell are verbatim: 72.7%, 89.5%, 8% for the core circuit
        and 71.5%, 10.5% for the full circuit. The authors'' own framing of the design as difficult is
        quoted accurately.

        '
      legacy_evidence: 'The complement test is run under a deliberately hostile design the authors flag
        --- ``the large majority of the model receives input that should push it to poor performance''''
        --- and passed: probability difference 72.7\%, i.e.\ 89.5\% of the original, with cutoff sharpness
        8\%, \emph{sharper} than the unpatched model. The full circuit of Appendix B reaches 71.5\% and
        10.5\%'
  I3:
    name: Minimality
    status: PC
    short: Most of MLP 10 ablates freely; one result runs the other way
