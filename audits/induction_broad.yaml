criteria:
  C1:
    name: Falsifiability
    status: C
    short: ''
    verified: true
    reasoning: 'The broad claim is stated in a form that could fail and the authors write down the condition
      under which it would. Argument 6 names the falsifier precisely — non-induction composition heads
      accounting for more of the phase change and the in-context learning improvement than induction heads
      do — and Argument 1 supplies a second, the shared latent variable. A claim whose authors specify
      its own refutation condition in the paper that advances it is maximally falsifiable, whatever the
      eventual outcome. C.

      '
    notes:
      verification: 'The falsifier is verbatim as the cell quotes it. Two things the cell''s phrasing
        obscures. The falsifier is conditional on an antecedent the paper does not test — "If all “composition
        heads” form simultaneously during the phase change" — and it is bounded by "above some size",
        with no size given. And the sentence appears in Argument 6, whose strength-table entries for large
        models read "Analogy" in both rows, so the falsifier is offered against the weakest of the six
        arguments. The cell''s claim that three groups later ran the test is post-origin and not checkable
        here.

        '
      legacy_evidence: The claim was stated in a form that could fail, and it failed. Argument 6 names
        the falsifier --- ``non-induction composition heads could together account for more of the phase
        change and in-context learning improvement than induction heads do'' --- and three independent
        groups later ran the test. A claim whose author specifies its own refutation condition is maximally
        falsifiable, whatever the outcome
  C2:
    name: Structural plausibility
    status: PC
    short: ''
    verified: true
    reasoning: 'The weight-level mechanism exists for small attention-only models and stops there, which
      the paper states three times in three places. For the abstract behaviours the extension is labelled
      a hypothesis, with the two proposed differences given as conjecture rather than derivation. The
      bridge from literal copying to general in-context learning is the in-context nearest neighbour analogy,
      which is an argument that the same mechanism could produce the more general behaviour, not a demonstration
      that it does. Structural plausibility for the broad claim is asserted at the level of analogy. PC.

      '
    notes:
      verification: '"right now we''re unable to reverse engineer induction heads in models with MLP layers"
        and "we hypothesize they''re different in two ways" are both verbatim, as the cell states. The
        nearest-neighbour phrase itself straddles a hyphenated line break in the extraction, so the sentence
        is quoted in two pieces rather than across the break.

        '
      legacy_evidence: 'Argument 5 supplies a weight-level mechanism only for the small attention-only
        case and concedes the extension is hypothesis: ``right now we''re unable to reverse engineer induction
        heads in models with MLP layers,'''' and for the abstract behaviours, ``we hypothesize they''re
        different in two ways.'''' The bridge from literal copying to general in-context learning is the
        ``in-context nearest neighbor'''' analogy, argued rather than derived'
  C3:
    name: Convergent validity
    status: PC
    short: ''
    verified: true
    reasoning: 'Six lines of evidence, and the paper labels which of them carry weight where. Only ablation
      and the smeared-key manipulation are interventional, and both stop at the small models; for large
      models the summary table reads correlational in the row that matters. The other four lines are co-occurrence,
      anecdote, mechanistic plausibility and continuity, which the authors classify that way themselves.
      Independence is also weaker than the count suggests: all six are read off one outcome metric computed
      on one held-out set that is held identical across every model and snapshot. Convergence of six views
      on one measurement is not six measurements. PC.

      '
    notes:
      verification: 'The summary table row is quoted as the extraction renders it, whitespace collapsed
        by the gate''s normalisation: Contributes Majority reads Strong Causal for small attention-only,
        Medium Causal for small with MLPs, Medium Correlational for large models. That is the cell''s
        "only two are causal and both are confined to small models", confirmed from the paper''s own labelling
        rather than inferred.

        '
      legacy_evidence: Six lines of evidence, and the paper is explicit that only two are causal and both
        are confined to small models. The other four --- macroscopic co-occurrence, anecdotal generality,
        mechanistic plausibility, continuity --- are correlational, illustrative or extrapolative by the
        authors' own labelling. All six also share one outcome metric and one model suite, so their agreement
        is less independent than the count suggests
  C4:
    name: Discriminant validity
    status: D
    short: ''
    verified: true
    reasoning: 'The construct named in the title is general in-context learning; the construct measured
      is loss at token 500 against token 50. The paper knows these are different, sets out both conceptions,
      chooses the second for generality, and concedes the cost in one clause: it fails to isolate specific
      behaviours of interest. The bridge asserted between them is a correlation on average, stated and
      never measured. Nothing in the paper separates the adopted measure from the few-shot construct the
      field reads it as, which is the discriminant test the broad claim needs.

      '
    notes:
      verification: 'The D in this cell is carried by post-origin work (Yin et al., Webb et al.) that
        cannot be checked against this source. What the source does establish, and the cell does not quote,
        is that the authors identified the exact fault line in advance: two conceptions named, one chosen,
        the other set aside with "which on average correlates with these tasks" as the only stated warrant.
        The later dissociation falsified an assumption the paper made explicitly.

        '
      legacy_evidence: 'The construct is ``general in-context learning'''' and the measure does not separate
        it from the neighbouring construct the field reads it as. \citet{yin2025which} run the separation:
        ``few-shot ICL accuracy and token-loss difference measure two very different things,'''' and the
        two dissociate with scale. The head-selection measure carries a subtler version of the problem.
        Prefix matching does separate the two populations --- \citet{webb2025emergent} find it correlates
        $r = 0.11$ with the causal mediation score for symbolic induction, ``implemented by disjoint sets
        of attention heads'''' --- while \citet{yin2025which} report that ``although there is little overlap
        between the sets'''' the two \emph{scores} remain correlated. A measure whose ranking tracks a
        mechanism it does not select for is the reason the field read one population as the other. What
        the construct needs, and lacks, is a criterion that separates induction from function-vector heads,
        which \citet{webb2025emergent} find correlate at $r = 0.86$ with the heads that actually carry
        abstract in-context reasoning. A test capable of exposing the failure was run and the criterion
        failed'
  C5:
    name: Nomological validity
    status: PC
    short: ''
    verified: true
    reasoning: 'The claim is connected outward in three directions and the connections are of different
      quality. The scaling-law link is the strongest, because it makes a retrodiction: one-layer transformers
      are a known exception to Kaplan et al.''s scaling laws, and the absence of induction heads would
      explain why. The grokking link is a resemblance between two phase changes with no shared quantity.
      The thermodynamics comparison is explicitly an analogy. Mesa-optimisation is engaged as a named
      alternative and reported absent. Connected but mostly by analogy rather than by derivation. PC.

      '
    notes:
      verification: 'The thermodynamics sentence is verbatim as the cell quotes it. "We did not observe
        any evidence of mesa-optimizers" is verbatim. The Kaplan one-layer retrodiction is stronger than
        the cell''s "analogical" characterisation allows: it is a specific prior anomaly with a specific
        proposed cause, hedged as "quite plausible".

        '
      legacy_evidence: Connected to scaling laws (the one-layer exception to Kaplan et al.), to phase-change
        and grokking literature, and to mesa-optimisation as a named alternative the authors report finding
        no evidence for. The connections are analogical --- ``the relationship between scaling laws and
        mechanistic interpretability might be seen as analogous to the relationship between thermodynamics
        and the physics of individual particles'' --- rather than derivational
  M1:
    name: Reliability
    status: U
    short: ''
    verified: true
    reasoning: 'One training run per model, no interval on any quantity. For the broad claim this bites
      harder than for the narrow one, because the evidence at scale is a co-occurrence in training time
      and the resolution there is fourteen or fifteen snapshots. The authors say so themselves in both
      places: co-occurrence on fifteen points is weaker evidence, and footnote 26 concedes the curve shapes
      cannot be judged as confidently as for the small models. A timing coincidence read off fifteen points,
      with no replicate to say how much the timing moves between runs, is unquantified. U.

      '
    notes:
      verification: 'Both quotes the cell relies on are verbatim. Term counts corroborate: seed 0, "standard
        deviation" 0, confidence 0, "error bar" 0. The asymmetry the cell identifies is real and checkable
        — the small models get 200 snapshots and the full-scale models 14 or 15, so the resolution is
        worst exactly where the broad claim needs it most.

        '
      legacy_evidence: 'Unattempted. One training run per model; no seeds, standard deviations or confidence
        intervals anywhere. For the broad claim this bites harder than for the narrow one, because the
        load-bearing evidence at scale is a co-occurrence in time observed with only 14--15 snapshots
        per full-scale model --- which the authors flag: ``Co-occurrence when one only has 15 points in
        time is less surprising and weaker evidence'''''
  M2:
    name: Baseline separation
    status: PC
    short: ''
    verified: true
    reasoning: 'The one-layer model is a clean negative control for the entire package: no induction heads,
      no phase change, no loss bump, no PCA pivot, and the paper checks all four. Within the ablated models
      every head is ablated, which gives the induction heads'' effect an empirical comparison distribution.
      Neither applies where the broad claim lives. For the six full-scale models there is no ablation
      at all, so there is no comparison distribution and no control condition; the evidence there is the
      shape of two curves against each other. PC.

      '
    notes:
      verification: '"ablation experiments were not conducted for the full-scale models" is verbatim and
        settles the cell. The one-layer control is a control on architecture, not a matched control on
        heads, so it constrains the mechanism''s necessity and not the size of any head''s effect.

        '
      legacy_evidence: The one-layer model is a clean negative control for the whole package --- no induction
        heads, no phase change, no loss bump, no PCA pivot. Within the ablated models, every head is ablated,
        giving an empirical comparison distribution. For the large models, where the broad claim lives,
        there is no ablation and therefore no separation of any kind; the comparison is between the shape
        of two curves
  M3:
    name: Stability
    status: PC
    short: ''
    verified: true
    reasoning: 'The metric''s free constants are perturbed and the conclusion survives: redefining in-context
      learning score against the final context token instead of the 500th leaves the between-model picture
      unchanged. That is a genuine robustness check on the parameter. It is not a check on the choice
      of operationalisation, which is the perturbation the broad claim actually needs — token-loss difference
      against few-shot accuracy — and the paper explicitly declines it, naming the cost as a failure to
      isolate specific behaviours. Stable within the family, untested across families. PC.

      '
    notes:
      verification: '"all definitions appear to show that the amount of in-context learning varies only
        slightly between models" is verbatim. The perturbation covers only the token index; the paper''s
        own text confirms the operationalisation was chosen rather than compared.

        '
      legacy_evidence: 'The metric definition is perturbed and survives: the paper re-derives the result
        using the final context token (8192) against a range of other indices and finds ``all definitions
        appear to show that the amount of in-context learning varies only slightly between models.''''
        What is not perturbed is the \emph{choice} of operationalisation --- token-loss difference versus
        few-shot accuracy --- and that is the perturbation that later moved the conclusion'
  M4:
    name: Calibration
    status: I
    short: ''
    verified: true
    reasoning: 'The evidence points both ways inside the origin. In favour: the outcome is in nats, the
      head evaluators are validated against weight-level quantities, and the arbitrary constants are shown
      not to matter. Against: footnote 17 documents an artifact that inverts the metric''s meaning, since
      damaging a head that helps normal prediction raises the score, and the authors explain the mechanism
      rather than fixing it. The score is also about 0.4 nats for every model from a two-layer toy to
      13B, which the paper cannot explain and downgrades from shocking to strange. A metric with an unexplained
      scale invariance and a known sign-inverting artifact is not calibrated to the construct it names.
      I.

      '
    notes:
      verification: 'CONTRADICTION INTERNAL TO THE SOURCE. The in-context learning score is written down
        five times and four of them subtract in the order that makes it negative. Key Concepts: "the loss
        of the 500th token in the context minus the average loss of the 50th token", repeated in Unexplained
        Curiosities and again in Analyses. The ablation-attribution section states it both ways inside
        one sentence: "how much better the model is at predicting the 500th token than the 50th token:
        this difference measured as Loss(ntrain, icontext= 500) - Loss(ntrain, icontext= 50)". Only Argument
        1 has the order that makes the reported +0.4 nats positive, "the 50th token loss minus the 500th
        token loss as described in Key Concepts", and it is not what Key Concepts describes. This is the
        metric on which the entire broad claim is scored.

        '
      legacy_evidence: Points both ways within the origin. The metric is in nats, is validated against
        weight-level quantities in the Appendix, and its arbitrary constants are shown not to matter.
        Against that, footnote 17 documents an artifact that inverts its meaning --- ``ablating most other
        attention heads appears to \emph{increase} in-context learning'' --- and the paper cannot explain
        why the score is $\approx$0.4 nats for every model from 13M to 13B, calling it ``strange'' and
        offering a partial account. A metric with an unexplained scale invariance and a known sign-inverting
        artifact is not calibrated to the construct it names
  M5:
    name: Sensitivity
    status: U
    short: ''
    verified: true
    reasoning: 'The only known-positive available at origin is the two-layer attention-only induction
      circuit derived from weights in the previous paper, and it is a known-positive for literal copying.
      Nothing plants a general in-context learning mechanism of known strength and asks whether the paper''s
      instruments recover it, so there is no floor on what the method would miss for the broad construct.
      The validation that does exist is scoped to small attention-only models by its own sentence. U.

      '
    notes:
      verification: 'The Appendix validation reads "in small attention-only models", which is the scope
        limit the cell relies on, verbatim. The reverse-engineered anchor is one head in one model.

        '
      legacy_evidence: Unattempted for the broad claim. The known-positive available at origin --- the
        two-layer attention-only circuit derived in \citet{elhage2021framework} --- validates the evaluators
        for literal copying, not for general in-context learning. No planted general-ICL mechanism is
        recovered
  M6:
    name: Invariance
    status: PC
    short: ''
    verified: true
    reasoning: 'Two different things are invariant to two different degrees. The signature — phase change,
      in-context learning jump, PCA pivot, induction-head formation — recurs across four series, two datasets
      and three orders of magnitude, and Argument 6 states that the measurements look fully analogous
      across all three model classes. That is the paper''s strongest empirical fact. The causal evidence
      has no such spread: it exists for twelve models at a single d_model of 768 and nowhere else. Invariance
      of a correlate is not invariance of the claim. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE SUPPLEMENT, not with this cell, which gets it right. The cell
        says the causal evidence "exists for 12 models at one d_model" — correct: ablations were "run
        only on the small models", there are twelve of them, and all have "an activation dimension dmodel
        = 768". The supplement''s system line (supplement_audits_v1z.tex:753) calls those twelve "the
        twelve small attention-only models". They are not. Six are attention-only and six have MLPs, which
        the Model Analysis Table preamble states and which Argument 3 relies on when it scores the MLP
        case separately.

        '
      legacy_evidence: 'The \emph{signature} is invariant across 34 models, four series, two datasets
        and three orders of magnitude of scale, which is the paper''s strongest empirical fact. The \emph{causal}
        evidence is not: it exists for 12 models at one $d_{\mathrm{model}}$ and is absent everywhere
        else. Invariance of a correlate is not invariance of the claim'
  M7:
    name: Selection correction
    status: U
    short: ''
    verified: true
    reasoning: 'Heads are ranked by prefix-matching score and the top scorers are the ones examined, on
      the same data used to rank them, with no correction. At full scale the plotted sample is stated
      to be biased towards high scorers, which makes the selection visible and uncorrected rather than
      hidden. Argument 4''s three exhibited heads come from a 40-layer model by inspection with no statement
      of how many were looked at. The outcome measure''s own constants are conceded arbitrary. U.

      '
    notes:
      verification: '"only a randomized sample of 100 heads (with selection biased towards those scoring
        highly on prefix matching)" is verbatim, and the cell quotes the 500/50 concession correctly in
        substance; the paper''s wording is "We chose the 500th and 50th token indices somewhat arbitrarily."

        '
      legacy_evidence: Unattempted. Heads are ranked by prefix-matching score and the top scorers are
        then examined; the 500/50 token indices are ``chosen somewhat arbitrarily''; Argument 4's three
        exhibited heads are selected from 40 layers of a 13B model by inspection, with no statement of
        how many were examined
  I1:
    name: Necessity
    status: I
    short: ''
    verified: true
    reasoning: 'Necessity is demonstrated for the operationalised outcome in the models where ablation
      was run, and the paper is careful about how far that reaches. It calls the same evidence "only suggestive"
      once MLPs are present, because ablating a head in an MLP model can perturb the metric without removing
      a contribution. Above the small models there is no ablation at all. The authors add a second limit
      that bites specifically on the broad reading: the case is more solid at the transition point of
      the phase change than at the end of training, so even where necessity holds it holds for a moment
      in training rather than for the trained model. Necessity holds for the metric in twelve models and
      is untested for the construct anywhere else.

      '
    notes:
      verification: 'The I in this cell turns on a post-origin disagreement between two operationalisations
        (Yin et al.), which cannot be checked here. The origin half is confirmed: "almost all the in-context
        learning in small attention-only models" is verbatim, and so is the MLP hedge in the same argument.

        '
      legacy_evidence: Metric-dependent, and the two metrics disagree. On the origin's token-loss-difference
        measure, induction heads remain the dominant causal contributor above 345M parameters even under
        a decorrelating control \citep{yin2025which}, though ``this disparity decreases with model scale.''
        On few-shot task accuracy under the same control, ``ablating induction heads while preserving
        the top 2\% FV heads … [shows] minimal impact … comparable to random ablations in models exceeding
        1B parameters.'' Necessity survives for the claim as operationalised and fails for the claim as
        read
  I2:
    name: Sufficiency
    status: U
    short: ''
    verified: true
    reasoning: 'Nothing reconstructs general in-context learning from induction heads. The paper''s substitute
      is a semi-empirical argument — nearest-neighbour retrieval must improve with more context, so heads
      that do it must contribute — and the authors state its limit in one sentence: it says nothing about
      what fraction of in-context learning induction heads perform. An argument that establishes a positive
      contribution of unspecified size is not a sufficiency test. U.

      '
    notes:
      verification: '"This argument doesn''t say anything about what fraction of in-context learning is
        performed by induction heads" is verbatim, and it is the authors'' own assessment of the argument
        the broad claim leans on hardest at scale.

        '
      legacy_evidence: 'Unattempted, at origin and since. No experiment reconstructs general in-context
        learning from induction heads alone, and no later work attempts it. Argument 5''s semi-empirical
        argument --- nearest-neighbour retrieval must improve with more context, therefore induction heads
        must contribute --- establishes that \emph{some} contribution exists, which the authors state
        plainly: ``This argument doesn''t say anything about what fraction of in-context learning is performed
        by induction heads'''''
  I3:
    name: Minimality
    status: U
    short: ''
    verified: true
    reasoning: 'No minimal set is identified whose removal abolishes in-context learning, and the design
      cannot easily produce one. Every ablation is marginal and single-head, and the authors name the
      consequence: where two heads do something similar the importance of each is masked. Argument 6''s
      own alternative posits many composition mechanisms forming together, which is precisely the redundancy
      regime in which marginal ablation is least informative. U.

      '
    notes:
