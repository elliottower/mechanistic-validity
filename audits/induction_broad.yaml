  verdict: Insufficient
  missing: 'No admissible measurement of the share: the paper''s summary table asserts it while the semi-empirical
    argument offered for it states no fraction (I2), the ablation is single-head and all-or-nothing (E5),
    and the headline metric is written down five times with four of them reversing its sign (M4)'
  primary: false
- statement: The copying the ablations cover is the literal case of a general retrieval mechanism
  verdict: Underdetermined
  missing: The bridge is the in-context nearest-neighbour analogy, argued rather than derived (C2), and
    the paper's own strength table labels its large-model rows correlational and Argument 6 analogy (V2)
  primary: false
