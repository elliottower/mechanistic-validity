    of any size
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: no ablation runs above the twelve small models, so nothing
    at scale separates induction heads from whatever else forms alongside them (E4, I5), and the adopted
    measure does not separate general in-context learning from the few-shot accuracy the field reads it
    as (C4)'
