criteria:
  C1:
    name: Falsifiability
    status: C
    short: Two numerical evaluators with a stated failure mode; three predictions
    verified: true
    reasoning: 'The construct is fixed before any evidence is collected, in two numerical evaluators applied
      to a stimulus with no natural statistics, and the paper states in advance what a negative result
      would look like. Footnote 5 concedes the measurement is a continuum rather than a threshold, which
      is the failure mode being declared rather than hidden. Two of the paper''s predictions were made
      before their tests and could have come out the other way: the smeared-key architecture was built
      to make induction expressible at one layer and predicted in advance that in-context learning would
      appear there, and single-head ablation predicted that removing the scored heads would remove the
      behaviour. Both held. C.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, on the count of predictions. The legacy evidence lists
        three predictions "that could have failed and did not", the first being that one-layer models
        should have no induction heads and no in-context learning. The paper does not treat that as a
        prediction of this work: footnote 2 states it as inherited fact from Elhage et al., and Argument
        2 opens by calling it "the observation (noted in the previous section)" and "pretty weak evidence
        by itself". Two predictions were tested here, not three. Second, the smeared-key result is quoted
        in the cell as covering "two-layer and larger models", and the paper does say that, but Model
        Details states "We present these only at one-layer and two-layer sizes". No smeared-key model
        larger than two layers exists in the paper, so the clause has nothing behind it.

        '
      legacy_evidence: 'The definition is two numerical evaluators with a stated failure mode, and three
        separate predictions could have failed and did not: one-layer models should have no induction
        heads and no in-context learning (they do not); the smeared-key architecture should produce both
        in a one-layer model (it does); ablating induction heads should remove in-context learning in
        attention-only models (it does). Footnote 5 concedes the measurement is a continuum rather than
        a threshold'
  C2:
    name: Structural plausibility
    status: C
    short: 'Weight-level: copying is the OV circuit''s positive-eigenvalue property'
    verified: true
    reasoning: 'The structural account is at the weight level and it is the reason the two behavioural
      evaluators were chosen. Copying is a property of the OV circuit, identified by its positive eigenvalues;
      prefix matching is a QK-circuit term produced by K-composition with a previous-token head. The Appendix
      then closes the loop in the direction that matters, validating each empirical evaluator against
      the corresponding weight quantity rather than against another activation measure. GPT-2''s pointer-arithmetic
      route is named as a second implementation of the same behaviour, which is what a structural account
      should be able to say. The limit is stated plainly: no MLP model is reverse engineered. C for the
      narrow copying claim.

      '
    notes:
      verification: 'The cell''s quoted phrase "most easily characterized by its positive eigenvalues"
        is verbatim, as is the QK term Id ⊗ hprev ⊗ W. Two mechanical notes. The QK-circuit formula straddles
        a figure in the extraction, so the sentence containing it is quoted up to the break rather than
        across it. The Appendix validation is scoped: "correlate well with mathematically-based measures
        in small attention-only models" — the calibration the cell credits exists only for the twelve
        small models'' attention-only half, not across the 34.

        '
      legacy_evidence: Weight-level and unusually direct. Copying is the OV circuit ``most easily characterized
        by its positive eigenvalues''; prefix matching is a QK-circuit term $\mathrm{Id} \otimes h_{\mathrm{prev}}
        \otimes W$ arising from K-composition with a previous-token head. The Appendix then validates
        the empirical evaluators \emph{against} these weight quantities --- the copying evaluator against
        the signed-eigenvalue fraction of OV, the prefix-matching evaluator against the trace of QK eigenvalues
        for the previous-token term. GPT-2's alternative pointer-arithmetic mechanism is named as a second
        implementation
  C3:
    name: Convergent validity
    status: C
    short: 'Five families: eigenvalues, evaluators, ablation, scaling, training'
    verified: true
    reasoning: 'Five instrument families appear at origin and they are not variants of one primitive:
      a weight computation (the QK eigenvalue trace), two activation evaluators, single-head ablation,
      per-token loss dynamics over training, and PCA of the per-token loss vectors. The weight measure
      and the activation measures are genuinely independent, which is why validating one against the other
      is informative rather than circular. Two external replications are published with the paper and
      agree: Scherlis recovers most of the head''s loss contribution by substituting an idealised attention
      pattern, and Lieberum finds heads meeting the same criterion in models neither group trained. C.

      '
    notes:
      verification: 'The cell''s replication numbers are verbatim: 99% for the previous-token head and
        "about 65% of the loss difference" for the induction head. The cell''s characterisation of Scherlis
        as "Redwood" is supported ("Adam Scherlis is a researcher at Redwood Research"). The later convergence
        the cell lists — mean ablation, zero ablation, attention knockout, training-time suppression —
        is post-origin and cannot be checked against this source. One scope note the cell omits: all five
        origin families are computed on the same 10,000 held-out examples, "held the same between all
        snapshots and between all models", so they are independent as instruments and not as samples.

        '
      legacy_evidence: 'Five families at origin: weight-level eigenvalue analysis, empirical activation
        evaluators, single-head ablation, per-token loss dynamics, and PCA of per-token loss vectors.
        Two independent external replications are published \emph{with} the paper --- Scherlis (Redwood)
        recovers 99\% of the previous-token head''s loss difference with idealised attention and $\sim$65\%
        for the induction head, and Lieberum locates induction heads in GPT-2 and GPT-Neo. Later convergence
        spans mean ablation, zero ablation, attention knockout and training-time suppression'
  C4:
    name: Discriminant validity
    status: PC
    short: Built to separate induction from repeated-token memorization
    verified: true
    reasoning: 'The defining stimulus is chosen to rule out the nearest neighbouring construct. Repeated
      sequences of uniformly random tokens carry no natural statistics, so a head that attends to plausible
      next tokens rather than to the induction target cannot score, and footnote 6 says this is why the
      stimulus was chosen. Previous-token heads are scored on a separate evaluator rather than folded
      into the same number, and the paper states that induction heads are a subset of copying heads rather
      than coextensive with them. The separation is built into the measure and checked in one place —
      the anti-copying prefix-search heads above 16 layers, which the definition correctly excludes. It
      is not tested against any construct the field later confused it with, which is what keeps this at
      PC.

      '
    notes:
      verification: 'Footnote 6''s wording is "a simple copying head that heuristically attends to previous
        tokens which could plausibly slot in well after the next token"; the cell quotes it truncated
        at "previous tokens", which drops the clause doing the discriminating work. The cell''s claims
        about function-vector heads and about Feucht et al.''s token/concept split are post-origin and
        not checkable here.

        '
      legacy_evidence: 'The definition is explicitly built to separate induction from the neighbouring
        construct: repeated \emph{random} sequences rule out ``a simple copying head that heuristically
        attends to previous tokens'''' (footnote 6), and previous-token heads are scored separately. Not
        separated from function-vector heads, which overlap substantially \citep{yin2025which}. Feucht
        et al.\ (2025) later split the construct itself into causally dissociable token and concept routes
        whose scores are uncorrelated'
  C5:
    name: Nomological validity
    status: C
    short: Derived from the mathematical framework rather than fitted to it
    verified: true
    reasoning: 'The layer-count prediction is derived, not fitted. Footnote 15 gives the derivation from
      the framework''s own terms — an attention score is a function of the source and destination token
      only, so where an induction head attends cannot depend on the token before the attended token without
      a second head writing that information first. Two layers is therefore a consequence of the decomposition
      rather than an observation generalised. Argument 2 then treats it as generating "predictions about
      the minimum architectural requirements" and builds an architecture to test it. C.

      '
    notes:
      verification: 'The cell says "Footnote 15 states the derivation explicitly" — correct. Note that
        the framework being drawn on is the authors'' own prior paper, so this is nomological coherence
        within one research programme rather than agreement with an independently developed theory.

        '
      legacy_evidence: Derived from a formal framework rather than fitted to one. \citet{elhage2021framework}
        supplies the OV/QK decomposition and the composition algebra, from which the paper derives a falsifiable
        architectural prediction --- induction requires attention-head composition, hence at least two
        layers --- and then tests it. Footnote 15 states the derivation explicitly
  M1:
    name: Reliability
    status: U
    short: Unattempted; one training run per model, no interval on any score
    verified: true
    reasoning: 'One training run per model, stated in the Model Analysis Table preamble, and every head
      evaluator score is an average over ten examples reported without any measure of spread. Nothing
      in the paper estimates how much of the between-model or between-head variation is training noise.
      The authors show they know the quantity matters — they discount an inconsistent result of O''Connor
      and Andreas on the grounds that retraining introduces run-to-run loss variation — and then do not
      estimate it for their own single runs. U.

      '
    notes:
      verification: '"one run of training per model" is verbatim in the Model Analysis Table preamble,
        exactly as the cell states. "averaged over 10 examples" is verbatim. Term counts corroborate rather
        than establish: seed 0, "standard deviation" 0, confidence 0, "error bar" 0 occurrences under
        this extraction. Reading the Appendix sections that would carry an interval if one existed — Data
        Collection (3), where each evaluator is specified end to end, and Analyses, where each plotted
        quantity is defined — confirms the cell: every head-evaluator score is a point estimate with no
        dispersion reported anywhere. The one thing the cell does not record is that the authors name
        run-to-run variation as a confound in someone else''s work in Related Work.

        '
      legacy_evidence: Unattempted. The Model Analysis Table preamble states ``one run of training per
        model''; the strings \texttt{seed}, \texttt{standard deviation} and \texttt{confidence} occur
        zero times in the paper. Each head evaluator score is ``averaged over 10 examples.'' Every number
        is a single point estimate
  M2:
    name: Baseline separation
    status: PC
    short: Every head ablated at every snapshot, so the effect has a reference
    verified: true
    reasoning: 'Every head in every ablated model is ablated at every snapshot, so an induction head''s
      effect is read against the empirical distribution of all head effects in the same model rather than
      against nothing. That is an implicit matched comparison at more than fifty thousand ablations. The
      one-layer model supplies a clean architectural negative control: no induction heads form and no
      in-context learning develops. What is missing is an explicit random-head or random-init control,
      and footnote 17 shows why one is needed — the non-induction distribution is not centred at zero
      but displaced in the opposite direction. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL AND WITH THE SUPPLEMENT''S SYSTEM LINE. The cell says
        "every head in every small model is ablated"; the paper says ablations "were run only on the small
        models", of which there are twelve. The supplement (supplement_audits_v1z.tex:753) describes causal
        ablation as "confined to the twelve small attention-only models". The twelve are not attention-only.
        The Model Analysis Table preamble defines two small series of six each, 1-layer to 6-layer, one
        without MLPs and one with; Argument 3''s strength table scores Small with MLPs as causal evidence;
        and Unexplained Curiosities discusses "The 4-layer MLP model ablations" and a 6-layer MLP induction
        head "whose ablation has the opposite effect". Six small attention-only models were ablated, not
        twelve. "more than 50,000 attention head ablations" is verbatim.

        '
      legacy_evidence: 'Every head in every small model is ablated at every snapshot, so the induction
        heads'' effect is read against the full empirical distribution of head effects --- an implicit
        matched comparison, and a strong one at $>$50,000 ablations. The one-layer model is a clean architectural
        negative control. What is absent is an explicit random-head or randomly-initialised control, and
        footnote 17 shows why one is needed: ``ablating most other attention heads appears to \emph{increase}
        in-context learning.'''' Matched random controls arrive later --- layer-matched at 8B Crosbie
        \& Shutova (2024), 10\%-matched at 70B \citep{yang2025unifying}'
  M3:
    name: Stability
    status: PC
    short: Token indices perturbed and the score shown robust to the choice
    verified: true
    reasoning: 'The one arbitrary constant in the outcome measure is perturbed and the conclusion survives:
      the paper re-derives in-context learning score against the final context token instead of the 500th
      and reports that the between-model picture is unchanged. The training dataset is perturbed too,
      with the small models retrained on books only. Both are real robustness checks rather than restatements.
      What is not perturbed is the intervention: the Model Analysis Table shows one ablation type, and
      no threshold on the prefix-matching score is varied. PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL. The cell says the ablation type is "not perturbed" and
        supports it with "the model analysis table shows only pattern-preserving ablations". That quote
        is accurate but the Appendix continues: "full ablation results can be found in the appendix".
        The full ablation was run; it is reported elsewhere in the article. The cell''s claim that the
        type is unperturbed is contradicted by the source, though the figures are not in this PDF. Minor
        wording: the cell writes the indices "were chosen somewhat arbitrarily"; the paper reads "We chose
        the 500th and 50th token indices somewhat arbitrarily."

        '
      legacy_evidence: 'The in-context-learning score is perturbed and shown robust: the 500/50 token
        indices ``were chosen somewhat arbitrarily'''' and the paper re-derives the result using the final
        token (8192) against other indices, finding ``all definitions appear to show that the amount of
        in-context learning varies only slightly between models.'''' Dataset is perturbed for the small
        models (books-only). Not perturbed: the ablation type (full ablation is defined but ``the model
        analysis table shows only pattern-preserving ablations'''') or any threshold on the prefix-matching
        score'
  M4:
    name: Calibration
    status: PC
    short: Evaluators calibrated against weight-level quantities in the appendix
    verified: true
    reasoning: 'Two calibrations, pointing opposite ways. The head evaluators are validated against weight-level
      quantities in the Appendix, which is more than most activation-level measures get, and the outcome
      is in nats rather than an arbitrary unit. Against that, the outcome measure is not calibrated in
      the direction it is used: footnote 17 reports that ablating unrelated heads raises in-context learning
      score, so the metric moves the wrong way under a large class of interventions, and the authors give
      the mechanism. The 0.4-nat constancy from a two-layer model to a 13B model is flagged as unexplained
      rather than resolved. PC.

      '
    notes:
      verification: 'CONTRADICTION INTERNAL TO THE SOURCE, in the definition of the paper''s central metric.
        The in-context learning score is written down five times and four of them subtract in the order
        that makes it negative for a model that predicts later tokens better: Key Concepts, Unexplained
        Curiosities, the Analyses section, and the ablation-attribution section, whose prose ("how much
        better the model is at predicting the 500th token than the 50th token") disagrees with its own
        formula in the same sentence. The fifth, in Argument 1, reads "the 50th token loss minus the 500th
        token loss as described in Key Concepts" — the only order consistent with the reported +0.4 nats,
        and not what Key Concepts describes. Nothing downstream appears to depend on the sign, but a metric
        written down inconsistently four times out of five is not calibrated. ARITHMETIC ERROR IN THE
        CELL: it says the constancy holds "across two orders of magnitude of scale". The paper''s own
        range is 13M to 13B non-embedding parameters, three orders, and the constancy sentence spans "a
        tiny two layer model" to "a fairly large 13 billion parameter model".

        '
      legacy_evidence: 'The evaluators are calibrated against weight-level quantities in the Appendix,
        which is more than most claims in this set have, and the outcome is in nats. But the metric is
        not calibrated in the direction it is used, and the paper says so: footnote 17 records that damaging
        unrelated heads raises the score, because ``if ablating a head makes the model bad at `normal
        prediction'', in-context learning can predict more tokens that otherwise wouldn''t be predicted.''''
        The 0.4-nat constancy across two orders of magnitude of scale is flagged as unexplained'
  M5:
    name: Sensitivity
    status: PC
    short: 'A known-positive exists: the two-layer model with a derived circuit'
    verified: true
    reasoning: 'A known-positive exists and is used. The two-layer attention-only induction circuit was
      derived from weights in the previous paper, so the Appendix can ask whether the activation evaluators
      recover a mechanism whose presence is already established independently, and they do. The smeared-key
      architecture is a designed positive of a different kind: it makes induction cheap to express and
      induction heads duly appear where they never had. Neither is a planted circuit of known strength,
      so nothing here says how weak a real induction head could be and still be detected. PC.

      '
    notes:
      verification: 'The known-positive is narrower than the cell implies. The paper says "we only reverse
        engineered a single induction head in a small attention-only model", so the sensitivity anchor
        is one head, not a circuit class. (The sentence contains a grammatical error in the source, "although
        we can reverse engineered others", quoted here as printed.) The Appendix validation is a correlation
        across heads, not a detection rate at a known effect size, so it bounds nothing.

        '
      legacy_evidence: 'A known-positive exists and is used: the two-layer attention-only model whose
        induction circuit was independently derived from weights in \citet{elhage2021framework}, against
        which the Appendix validates both evaluators. The smeared-key architecture is a designed positive
        --- it makes induction cheap to express and induction heads duly appear. Neither is a planted
        circuit of known strength, so the sensitivity floor is unquantified'
  M6:
    name: Invariance
    status: C
    short: 34 models, four series, 1--40 layers, 13M--13B, 200 snapshots each
    verified: true
    reasoning: 'The signature is checked across the widest sweep in this audit set: four model series,
      two datasets, one to forty layers, and snapshots dense enough in the small models to see the transition
      rather than infer it. What raises this above a list of models is that the exceptions are named rather
      than smoothed — a non-induction head whose ablation mimics reversing the phase change, one model
      whose ablations are not peaky, and a lone induction head whose ablation goes the wrong way. A sweep
      that reports its own anomalies is evidence about invariance; one that does not is evidence about
      presentation. C.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL''S `short`, which reads "34 models, four series, 1--40
        layers, 13M--13B, 200 snapshots each". Two of the five numbers do not survive. (a) 200 snapshots
        each is true of the twelve small models only. The six full-scale models have "a total of 15 saved
        snapshots (except the 40L which has 14)", which footnote 26 flags as making the curve shapes harder
        to judge. (b) 13M--13B is the full-scale series'' range, not the range of the 34. The small models
        are 1- to 6-layer at d_model = 768 and the paper never states their parameter counts, so the low
        end of the sweep is below 13M and unquantified. 34, four series and 1--40 layers all check out:
        34 decoder-only models is verbatim, four series are enumerated, small models run 1 to 6 layers
        and full-scale 4 to 40. The paper never itemises how the 34 decompose. Twelve small plus six full-scale
        is stated; the remaining sixteen (books-only retrains, smeared key at one and two layers) are
        never counted.

        '
      legacy_evidence: '34 models across four series, two datasets, 1--40 layers and 13M--13B parameters,
        with 200 snapshots for each small model and 14--15 for each full-scale model, all reported in
        the Model Analysis Table. Exceptions are named rather than smoothed: a non-induction head in the
        6L attention-only model whose ablation mimics reversing the phase change, the 4L MLP model''s
        ``nowhere near as peaky'''' ablations, and one induction head in the 6L MLP model ``whose ablation
        has the opposite effect'''''
  M7:
    name: Selection correction
    status: U
    short: Unattempted; heads are scored, then the high scorers are ablated
    verified: true
    reasoning: 'Heads are scored on the two evaluators and the high scorers are then ablated on the same
      models and the same data, with no correction for having chosen them. The candidate pool is large
      and is stated — twelve heads per layer in the small models, and at full scale a deliberately biased
      sample of a hundred heads — which makes the exposure visible without controlling it. The outcome
      measure''s two constants are conceded to be arbitrary in the same breath. Nothing here is hidden;
      nothing is corrected either. U.

      '
    notes:
      verification: 'The cell''s quoted candidate pool is verbatim, including "only a randomized sample
        of 100 heads (with selection biased towards those scoring highly on prefix matching)". The full-scale
        head counts the cell gives as "40--48 heads/layer" come from the table of model properties, which
        lists 8, 12, 20, 32, 48 and 40 heads per layer across the six full-scale models; 40--48 is the
        top of that range rather than a general figure. In the small models the vocabulary size renders
        as "216" in this extraction, which is 2^16 with the exponent dropped, not a paper error.

        '
