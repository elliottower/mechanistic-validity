    76.9\% of its direct effect
  verdict: Mechanistically Supported
  missing: A dissociation from the backup-head mechanism the same ablation moves (I6), a known-strength
    positive control fixing the method's floor (M5), and correction for the top-5\% slices the headline
    figures are computed on (M7)
