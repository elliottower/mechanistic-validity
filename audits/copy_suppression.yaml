criteria:
  C1:
    name: Falsifiability
    status: C
    short: ''
    verified: true
    reasoning: 'The claim is committed to before it is measured, at two levels, and each commitment had
      a way of coming out wrong. Behaviorally, the three qualitative steps are turned into three conjunctive
      conditions checked per completion, and 80% of a sample satisfies all three; a conjunction of three
      top-k conditions is a threshold that a vague hypothesis would fail. At the weight level the predictions
      are sharper still, because the paper states what the matrices must look like and then measures them:
      the OV diagonal had to be among the most negative entries in its column and the QK diagonal had
      to be the largest in its row, and either could have come out flat. C.

      '
    notes:
      verification: 'The 80% figure, the three conditions and both weight predictions are verbatim, and
        the predictions are stated in the sentences preceding their measurements in both §3.1 and §3.2,
        which is what the cell''s "stated before being measured" asserts. One qualification the cell omits:
        the 80% is computed on a sample drawn from the top 5% of completions by L10H7''s own effect, so
        the behavioral test is run where the hypothesis is most likely to hold. That is disclosed in the
        same sentence and is recorded at M7.

        '
      legacy_evidence: 'The three qualitative steps are operationalised as three conjunctive conditions
        checked per completion (their \S2.1), and 80\% of a sample from the top 5\% of completions meet
        all three --- a number that could have come out near zero. The weights predictions are sharper:
        the OV diagonal could have failed to be negative and the QK diagonal could have failed to be maximal,
        and both are stated before being measured'
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Mechanistically
        Supported, blocked above that by I6=U. The 35-criterion table scores the primary reading, so the
        criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: C
    short: ''
    verified: true
    reasoning: 'The mechanism is read off the weights before any ablation is run, and both halves of it
      are quantified over the entire vocabulary: 84.70% of tokens have their OV diagonal among the ten
      most negative entries in their column, 98.86% in the bottom 5%, and 95.72% of QK rows have the diagonal
      as the largest entry. Structural evidence of this kind is usually the missing piece; here it is
      the core of the paper. It is also checked against behaviour rather than left as an idealisation,
      holding at 78.24% on real source-destination pairs from OpenWebText. C.

      '
    notes:
      verification: 'All four percentages are verbatim and the cell reports them correctly, including
        the distinction between the static 84.70% and the dynamic 78.24%. One caveat the cell notes only
        at M3: the paper states the QK idealisation "does not completely faithfully represent L10H7''s
        real functioning", and Appendix M.2 measures the gap at a median attention change of -0.09 against
        an average attention of 0.21. The structural account of the OV circuit survives that caveat; the
        QK half is idealised and known by the authors to be so.

        '
      legacy_evidence: 'The mechanism is read off the weights before any ablation. OV circuit $W_U W_{OV}
        \mathrm{MLP}_0(W_E)$: 84.70\% of vocabulary tokens have their diagonal among the ten most negative
        entries in their column, 98.86\% in the bottom 5\% (\S3.1). QK circuit $W_U W_{QK} \mathrm{MLP}_0(W_E)$:
        95.72\% of rows have the diagonal as the largest entry (\S3.2). Both are checked against on-distribution
        behaviour --- the OV result holds at 78.24\% on real (source, destination) pairs from OpenWebText
        (Appendix F)'
  C3:
    name: Convergent validity
    status: C
    short: ''
    verified: true
    reasoning: 'Four instruments bear on the same claim and agree. Weight products give 84.70% and 95.72%
      with no intervention at all; hand-coding of dataset examples gives 80%; a structured ablation that
      deletes everything except the two weight mechanisms preserves 76.9% of the head''s effect; and out-of-distribution
      behaviour on repeated random tokens ranks the same head first. These differ in kind rather than
      in granularity — one is a property of the parameters, one is observational, one is causal, one is
      a different distribution — so their agreement is not arithmetic. C.

      '
    notes:
      verification: 'The four families in the cell are all present and the numbers are verbatim. Two dependencies
        the cell does not mention. The behavioral coding and the CSPA QK filter both use the logit lens
        to define what the model "predicts", so those two families share an instrument; and both are evaluated
        on completions selected by L10H7''s own effect. The weights analysis and the anti-induction correlation
        are free of both dependencies, which is what carries the C. Campregher et al. and Urdshals & Urdshals
        are post-origin.

        '
      legacy_evidence: 'Four families at origin, agreeing: weights (\S3.1--3.2), behavioural coding of
        dataset examples (\S2.1, 80\%), structured ablation (\S3.3, CSPA), and out-of-distribution behaviour
        on repeated random tokens (Appendix A). Independent later convergence: Campregher et al.\ (2025),
        a reproducibility study reconciling three papers, finds attention heads promote factual output
        ``via general copy suppression rather than selective counterfactual suppression''''; Urdshals
        \& Urdshals (2025) find copy suppression arising de novo in a one-layer attention-only transformer
        trained from scratch on list sorting'
  C4:
    name: Discriminant validity
    status: PC
    short: ''
    verified: true
    reasoning: 'Three separations are run and all three are against the rivals that matter. The same-matching
      baseline addresses the confound tied embeddings create, Duplicate Token Heads are shown to behave
      differently under the same lookup tables, and Name Mover Heads reach a best median rank of 561 across
      every configuration against L10H7''s rank-1 majority. Discrimination fails one level down. The components
      of the instrument — the OV and QK ablations taken separately — recover more than half the KL divergence
      for many other heads, so what separates L10H7 is the conjunction rather than either mechanism. PC.

      '
    notes:
      verification: 'TWO CONTRADICTIONS WITH THE CELL, both about Figure 19b. First, the cell reads "L10H7''s
        diagonal median rank is 21,904 of 50,257" — the figure is captioned "Studying the number of Top-1
        tokens for L3H0, a Duplicate Token Head", with a "Count" colour scale, so 21904/50257 is a count
        of vocabulary tokens whose diagonal ranks first, not a median rank. Under the caption the number
        says L3H0 matches strongly in effective-embedding space, the opposite of what the cell uses it
        for; the discriminant point is the 289/50257 it reaches in the copy-suppression configuration
        with W_U queryside. The prose of Appendix M.1 calls the same quantity a median rank, so the paper
        is internally inconsistent about what Figure 19b plots. Second, the cell describes the same-matching
        baseline as giving "much worse diagonal ranks"; the paper''s words are "much smaller", which read
        literally means better ranks. The argument requires the cell''s reading, and the extraction does
        not carry the bar values that would settle it. The 561 figure and the >50% recovery are verbatim
        and correctly attributed.

        '
      legacy_evidence: 'Three separations are shown, all in appendices. Against a ``same matching''''
        QK circuit, the rival that tied embeddings make live (Figure 3, blue bars). Against Duplicate
        Token Heads --- L3H0''s diagonal median rank is 21{,}904 of 50{,}257 with an effective-embedding
        queryside (Figure 19b). Against Name Mover Heads --- ``across all key and queryside lookup tables
        the best median rank is 561'''' (Appendix M.1). What is not separated is the ablation instrument:
        the OV and QK ablations alone recover $>$50\% of KL for many other heads (Appendix J.3)'
  C5:
    name: Nomological validity
    status: PC
    short: ''
    verified: true
    reasoning: 'The strongest nomological work available here is unification, and the paper does it: two
      independently named phenomena, negative name mover heads from the IOI literature and anti-induction
      heads from the induction literature, are brought under one mechanism, and the unification is quantified
      as a correlation of per-head scores across three model families. Placement in the wider theory is
      thinner. The paper locates itself in the iterative-inference line by noting no connection has been
      made there before, and it declines to explain why such heads form, listing three candidate theories
      with tests it does not run. Unified and unexplained is PC.

      '
    notes:
      verification: 'The unification sentence and the iterative-inference sentence are verbatim, and Appendix
        E is explicitly framed as speculation with proposed tests, as the cell says. Figure 9 carries
        the cross-model correlation the cell cites, and the paper reports no correlation coefficient,
        no head count and no significance test for it — "a strong correlation" is the whole of the statistical
        claim.

        '
      legacy_evidence: The claim unifies two previously named and separately described phenomena --- ``negative
        name mover heads'' \citep{wang2023interpretability} and ``anti-induction heads'' \citep{olsson2022context}
        --- which is the strongest form of nomological work available here, and the unification is quantified
        (Figure 9, correlated scores across GPT, Pythia and SoLU models). It sits inside the iterative-inference
        / logit-lens line, where the paper notes ``no connections have yet been made to Negative Heads''
        (\S5). Why such heads form is unexplained; Appendix E lists three ``speculative theories'' with
        tests proposed and not run
  M1:
    name: Reliability
    status: PC
    short: ''
    verified: true
    reasoning: 'Every headline quantity is an average over OpenWebText reported as one number. The paper
      shows spread across data, binning completions into 100 percentiles of effect size, which is a real
      and unusual disclosure; it shows no spread across estimates, since GPT-2 Small is one released checkpoint
      and no bootstrap, resampling or interval accompanies 76.9%, 84.70%, 95.72% or 78.24%. The one glance
      at a second pretraining run of the same architecture is informal and partly negative: the analogous
      head in Stanford GPT-2 Small E attends to IO and S2 equally, which GPT-2 Small''s does not. Reliability
      across data, silence across estimates, is PC.

      '
    notes:
      verification: 'The Appendix Q sentence is verbatim and the cell quotes it accurately. Verified against
        a full read for the absence: no confidence interval, bootstrap or repeated run appears in the
        body or in Appendices A through R. Figure 5''s 100 percentiles are the only dispersion reported,
        and they are dispersion of the estimand across the corpus rather than of the estimate.

        '
      legacy_evidence: 'GPT-2 Small is a single released checkpoint and every number is a single point
        estimate --- no seed variance, bootstrap, or confidence interval. The one seed-level check is
        informal and partly negative: Appendix Q reports that in Stanford GPT-2 Small E, a different pretraining
        run of the same architecture, a head writes against the correct token after Name Mover ablation
        but ``is distinct from the copy suppression heads in GPT-2 Small in that it attended to both the
        IO and S2 tokens equally on a clean run.'''' Spread across data is reported (Figure 5, 100 percentiles);
        spread across estimates is not'
  M2:
    name: Baseline separation
    status: PC
    short: ''
    verified: true
    reasoning: 'Two baselines carry the argument and both are the right shape. Mean ablation of the direct
      effect is the denominator of the effect-explained ratio, so every percentage in the paper is already
      expressed against a null; and the same-matching QK circuit is a baseline chosen because tied embeddings
      make that rival live. A third check puts every layer 9-11 head through CSPA and finds L10H7 recovers
      most. What is missing is a null for 76.9% itself. The paper''s own Appendix J.3 shows the component
      ablations clear 50% for many heads, so the reference distribution matters and is not constructed.
      PC.

      '
    notes:
      verification: 'The effect-explained definition and the Appendix J.3 test are verbatim, and Figure
        17 is the right locator for the layer 9-11 comparison. See C4 for the wording discrepancy in the
        same-matching sentence: the paper says the baseline''s diagonal ranks are "much smaller", the
        cell says "much worse", and only the cell''s reading supports the conclusion the paper draws from
        it.

        '
      legacy_evidence: 'Two baselines carry every number and both separate. Mean ablation of L10H7''s
        direct effect is the denominator of the effect-explained ratio by construction. The ``same matching''''
        QK baseline, with the effective embedding on both sides, gives much worse diagonal ranks (Figure
        3). Figure 17 puts all layer 9--11 heads through CSPA and L10H7 recovers the most. Missing: a
        matched-random null for 76.9\% itself, which matters because the component ablations recover $>$50\%
        for many heads (Appendix J.3)'
  M3:
    name: Stability
    status: PC
    short: ''
    verified: true
    reasoning: 'Perturbations are run against the paper''s own result and reported when they hurt. Including
      the query and key biases leaves the QK distribution unchanged; the static 84.70% is rechecked dynamically
      at 78.24%; the headline is recomputed under two loss metrics giving 82% and 45%. The two perturbations
      that matter most come out against the idealisation: projecting the key input onto the effective
      embedding moves attention by a median of -0.09, and the better context-free approximation still
      moves it by -0.06. Stability tested, partly failed, and disclosed is PC.

      '
    notes:
      verification: 'All five numbers in the cell are verbatim. One wording correction: the cell renders
        the bias check as results that are "identical … except a tiny difference in the Rank 1-2 bar heights";
        the paper writes "seem identical", a hedge the cell drops. The 45% absolute-loss figure is the
        largest instability in the paper and the cell records it at I2 rather than here.

        '
      legacy_evidence: Perturbations are run and reported against the paper. QK results with and without
        bias terms are ``identical \ldots except a tiny difference in the Rank 1-2 bar heights'' (Figure
        19a). The static OV result (84.70\%) is checked dynamically (78.24\%, Appendix F). Three metrics
        are reported (Appendix J.2). Appendices M.2 and M.3 perturb the idealised key and query approximations
        and find both unfaithful --- median attention change $-0.09$ under the effective-embedding keyside,
        improving to $-0.06$ with a context-free residual state
  M4:
    name: Calibration
    status: PC
    short: ''
    verified: true
    reasoning: 'The validation metric is well chosen and its failure mode is stated by the authors. KL
      divergence has a meaningful zero, is linear in the log-probabilities the ablation produces, and
      Appendix J.1 names the case it will miss — a logit change too small to move a small probability,
      which costs loss and not KL. Calibration of the underlying effect is where it thins out. The head''s
      whole direct contribution is about a thousandth of the model''s OpenWebText loss, the same explanation
      scores 82% or 45% depending on which loss metric is chosen, and the head is harmful on almost as
      many completions as it helps. A percentage of a small and sign-unstable effect is PC.

      '
    notes:
      verification: 'The KL rationale and its stated flaw are verbatim. The absolute magnitudes the cell
        uses — a loss increase of 0.0102 nats from about 3.030 — are axis annotations in Figure 2 rather
        than in-text numbers, which is why they are not quoted here; Appendix I independently gives the
        model''s average OpenWebText loss as 3.047 on a 3000-document sample, so the cell''s arithmetic
        of roughly 0.3% holds. The 82% and 45% pair is verbatim in Appendix J.2 and is the sharper calibration
        problem.

        '
      legacy_evidence: 'KL divergence is well motivated, with 0 having ``a natural interpretation as the
        ablated and clean distributions being identical,'''' and its failure mode is stated in Appendix
        J.1. The absolute scale is small: mean-ablating L10H7''s direct path raises OpenWebText loss by
        0.0102 nats from about 3.030 (Figure 2), so 76.9\% is a fraction of roughly 0.3\% of the model''s
        loss. Figure 16a shows the head is harmful on almost as many completions as it helps'
  M5:
    name: Sensitivity
    status: U
    short: ''
    verified: true
    reasoning: 'Every control in the paper is a known-negative. The same-matching baseline, the layer
      9-11 head sweep and mean ablation all establish what the measurement returns when copy suppression
      should be absent or weaker. None establishes what it returns when a copy-suppression mechanism of
      known strength is present, because no such mechanism is planted and recovered and no model is constructed
      where the answer is known in advance. The floor of the method is therefore unmeasured: a head with
      half the mechanism would score some number, and nothing says which. U.

      '
    notes:
      verification: 'Verified against a full read. The quotes bound the control set rather than asserting
        the absence. Appendix J.3 is the closest the paper comes, and its logic is explicitly the negative
        direction — the measure "should be smaller for heads in GPT-2 Small that aren''t negative heads".

        '
      legacy_evidence: 'Unattempted. No known-positive control: no copy-suppression circuit of known strength
        is planted and recovered, and no model is constructed where the correct answer is known in advance.
        Every control in the paper is a known-negative (same matching, other heads, mean ablation)'
  M6:
    name: Invariance
    status: PC
    short: ''
    verified: true
    reasoning: 'The claim is evaluated across the whole of OpenWebText rather than a template set, binned
      into 100 percentiles of effect size, under three metrics, at two granularities and in three further
      model settings. Conditions that would stress it are absent: no breakdown by document domain, sequence
      length or token frequency band appears. Appendix K then shows the operationalisation is itself condition-dependent,
      since in 42.00% of large-attention pairs the source token is suppressed without being the most suppressed,
      and in 90% of those the winner is a semantically related token. Broad coverage with an unstable
      definition at the margin is PC.

      '
    notes:
      verification: 'The 42.00% and 90% figures are verbatim and the cell reports them correctly. Note
        these two numbers cut both ways: they are evidence of non-invariance of the strict operationalisation,
        and evidence for the semantic reading the paper adopts in Appendix K and records at V3.

        '
      legacy_evidence: 'Reported across the full OpenWebText distribution binned into 100 effect-size
        percentiles, under three metrics, at two granularities (weights-static and on-distribution), and
        across three further model settings in appendices. Not reported across document domains, sequence
        lengths, or token frequency bands. Appendix K shows the operationalisation is itself condition-dependent:
        in 42.00\% of large-attention pairs the source token is suppressed but not most-suppressed, and
        in 90\% of those the most-suppressed token is semantically related to the source'
  M7:
    name: Selection correction
    status: U
    short: ''
    verified: true
    reasoning: 'Selection runs through the paper and is disclosed at every step. L10H7 is chosen as the
      most negative head in GPT-2 Small; the 80% behavioral figure is computed on a sample from the top
      5% of completions by L10H7''s own effect; the QK ablation retains the top 5% of predicted source
      tokens; the two faithfulness appendices evaluate on the top 5% again. Each choice is stated with
      its reason, which is more than most papers offer. None is corrected for, and no quantity is recomputed
      on a held-out or unselected slice, so nothing bounds how much of 76.9% is a property of the selection.
      U.

      '
    notes:
      verification: 'The four selections are verbatim and the cell lists them correctly, including the
        stated justification that the top 5% "accounted for half of the attention head''s loss reducing
        effect". Verified against a full read for the absence of any correction or held-out evaluation.
        Appendix N is the one exception and it points the other way: it reports "We never train on the
        test set we evaluate on" for the learned per-token scaling, a discipline applied nowhere else.

        '
      legacy_evidence: Unattempted. L10H7 is selected as the most negative head in GPT-2 Small; the 80\%
        behavioural figure is computed on a sample from the top 5\% of completions by L10H7's own effect,
        chosen because they ``accounted for half of the attention head's loss reducing effect''; the QK
        ablation retains the top 5\% of source tokens; Appendices M.2 and M.3 evaluate faithfulness on
        the top 5\% again. Each selection is stated; none is corrected for
