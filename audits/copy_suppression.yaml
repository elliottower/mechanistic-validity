- statement: The token the head suppresses is the source token itself
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: in 42.00\% of large-attention pairs the source token is suppressed
    without being the most suppressed, and a semantically related token takes first place in 90\% of those
    (M6); the authors conclude the mechanism is better read as semantic copy suppression and keep the
    coarser name elsewhere (V3)'
  primary: false
- statement: Copy suppression is what separates L10H7 from the other heads in its layers
  verdict: Underdetermined
  missing: Either half of the instrument alone clears 50\% recovered KL for many layer 9--11 heads, so
    the conjunction rather than the mechanism does the separating (I4, C4); the queryside direction perpendicular
    to the IO unembedding matters more than the parallel one and is left uncharacterised (I5)
  primary: false
- statement: Negative Heads do copy suppression across models
  verdict: Proposed
  missing: The structured ablation is never run outside GPT-2 Small (E4); GPT-2 Medium recovers two of
    its three most negative heads, Pythia's copy suppression is weaker, and Stanford GPT-2 Small E's analogue
    attends to IO and S2 equally (M1)
  primary: false
