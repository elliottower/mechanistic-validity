criteria:
  C1:
    name: Falsifiability
    status: C
    short: Each head assignment is a signed prediction that could have come out flat
    verified: true
    reasoning: 'Each head assignment is stated as a signed prediction about a measurable quantity and
      could have come out flat. The metric is a logit difference against the strongest wrong answer, so
      a component that mattered in the wrong direction would show; the circuit''s success rate is quoted
      against a stated chance level; and the positional hypothesis is put as a pair of contrasting interventions
      where one had to move the attention pattern and the other had not to. The paper also records a prediction
      that failed. The obvious explanation for head 1.4''s recency preference was the positional embedding,
      the swap was run, and it did nothing, which is what sent the authors to the causal mask. Risk taken,
      and taken more than once. C.

      '
    notes:
      verification: 'The cell''s quotation "inverts 1.4''s attention" is verbatim; the sentence reads
        "Swapping head 0.4''s attention pattern inverts 1.4''s attention, while swapping the positional
        embedding barely affects it" and sits in a figure caption under Positional Information Head 0.4,
        not in the body. The cell says "eight heads are named with role assignments". Eight heads carry
        role names in the circuit proper --- 0.2, 0.4, 0.5, 1.2, 1.4, 2.0, 3.0, 3.6 --- and that is exactly
        the set the post then scores, so the count checks out for the claim. Three further heads are given
        tentative role names in Open questions & leads (0.1 as a Duplicate Token Head, 1.0 as another
        Fuzzy Previous Token Head, 2.2 as a negative head), each hedged with "seems to" and none tested,
        so they do not add to the count of failable assignments.

        '
      legacy_evidence: Eight heads are named with role assignments, each making a patching prediction
        that could have failed. Head 0.4's positional role is tested by swapping its attention pattern
        between \texttt{A\_doc} and \texttt{B\_doc}, which ``inverts \textbf{1.4}'s attention,'' while
        swapping positional embeddings does not
  C2:
    name: Structural plausibility
    status: PC
    short: 'Argued at the activation level: patterns locate, patching confirms'
    verified: true
    reasoning: 'The mechanism is argued at the level of activations. Attention patterns establish where
      a head reads, patching establishes that what it reads matters, and the composition score is itself
      a patching quantity: it asks how much one head''s output changes when fed another''s corrupted output.
      The diagram''s Q, K and V labels are stated as inferences from behaviour, which is the author''s
      own description of the evidence class. Nothing is computed from the weights, so the structural story
      rests on a family of measurements that cannot separate a head that must compose from one that merely
      covaries. Two structural puzzles are left standing and named. Plausible and behaviourally argued,
      unverified at the parameter level, which is PC.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL. The legacy evidence says the authors "flag an unresolved
        structural puzzle --- why three levels of composition when two would suffice". No such sentence
        exists. Two separate remarks have been merged. The composition remark is "despite the circuit
        seemingly requiring just 3 levels of composition, only the 4-layer model could do the task", which
        is about layer count, not about two levels sufficing. The sufficiency remark is about the rival
        algorithms: "This is surprising, since one of the two should be sufficient to perform the task",
        where "the two" are the docstring-induction and line-number algorithms. Both are quoted above
        so the cell can be repaired against them. The composition-score quotation in the cell is verbatim
        from footnote 1. The absence claim holds: the words QK, OV and eigenvalue appear nowhere in the
        post, and the only weight-level statement is the inference note on the summary diagram.

        '
      legacy_evidence: 'The information path is argued through attention patterns and patching-based composition
        scores (``How much does \textbf{Top}''s output meaningfully change when we feed it the corrupted
        rather than clean output of \textbf{Bottom}?''''). No weight-level analysis: no QK or OV decomposition,
        no eigenvalue analysis. The plausibility argument is behavioural. The authors flag an unresolved
        structural puzzle --- why three levels of composition when two would suffice'
      legacy_warning: The legacy_evidence for this cell contains a paraphrase presented as a quotation,
        or a claim fused from two separate remarks in the source. Verified 2026-08-07. Use the quotes
        block, not the legacy text.
  C3:
    name: Convergent validity
    status: PC
    short: One instrument carries it; patching and composition share a primitive
    verified: true
    reasoning: 'One instrument carries the result. Residual-stream patching, head-output patching and
      the composition score are three granularities of a single operation, replacing an activation with
      the same activation from a corrupted run, so their agreement is close to arithmetic rather than
      independent. Attention-pattern inspection is genuinely a second instrument and is used throughout
      to confirm where a head reads, but it is observational and cannot on its own establish that the
      read matters. Two evidence classes, one of them not causal, is PC.

      '
    notes:
      verification: '"Our main method for investigating this circuit is activation patching" is verbatim
        and is the post''s own framing, so the cell''s "one family at origin" is fair. The cell''s post-origin
        claims --- SAE-based discovery (O''Neill & Bui 2024) and contextual decomposition (Hsu et al.
        2024) scoring themselves on recovering this head set --- cannot be checked against this source
        and are left unverified. The refs list is empty for that reason rather than because the claim
        was rejected.

        '
      legacy_evidence: 'One family at origin: activation patching, with attention-pattern inspection as
        support. Later agreement is circular rather than independent --- SAE-based discovery (O''Neill
        \& Bui 2024) and contextual decomposition (Hsu et al.\ 2024) score \emph{themselves} on recovering
        this head set, treating it as ground truth. No independent re-derivation of the mechanism has
        been located'
  C4:
    name: Discriminant validity
    status: U
    short: The circuit is never compared with one for a neighbouring task
    verified: true
    reasoning: 'No neighbouring construct is put up against this one. The circuit is never compared with
      a circuit for another task in the same model, and the authors state why: leaving the docstring distribution
      is out of scope. What exists is one head tested off-distribution. Head 1.4 is run on six-token synthetic
      prompts and shown to be inactive for ordinary words, which bounds that head''s range but says nothing
      about whether the circuit as a construct separates from a neighbour. A boundary drawn around one
      component is not a discriminant contrast. U.

      '
    notes:
      verification: 'Read looking for a second task: the Introduction ("How we chose the candidate task"),
        the Multi-Function Head 1.4 section, and Open questions & leads. The only off-docstring material
        is the |BOS|S0|A|B|C|S1| sweep, which varies the destination token for one head, and the |BOS|,|A|B|=|,|
        side note. Both are attention-pattern probes on one head, so the cell''s "the head set is never
        compared against a neighbouring task''s head set" survives as written. The cell''s Conmy et al.
        and uit de Bos & Garriga-Alonso claims are post-origin and cannot be checked here.

        '
      legacy_evidence: Unattempted. The head set is never compared against a neighbouring task's head
        set on this model. Docstring appears as one of six tasks in \citet{conmy2023towards} and one of
        three in uit de Bos \& Garriga-Alonso (2024), but always as a separate benchmark, never as a discriminant
        contrast
  C5:
    name: Nomological validity
    status: PC
    short: Placed inside an existing theory of head types, which does work
    verified: true
    reasoning: 'The circuit is placed inside an existing theory of head types and the theory does work
      rather than decoration. Induction-head theory says an induction head needs a previous-token head
      feeding it, the post treats that as a prediction, runs a targeted patch on param_2 and finds head
      0.2. That is a nomological link with a consequence. The link is loosened at the same time: the previous-token
      type has to be widened to a "fuzzy" variant to fit heads 1.4 and 2.0, and the connection to the
      IOI motifs is stated as resemblance. Embedded in theory, with the theory bent to fit, is PC.

      '
    notes:
      verification: 'PARAPHRASE IN QUOTATION MARKS. The cell quotes head 1.4 as "attending to the token
        following a previous occurrence of the current token". The post reads "a head that attends to
        the token (B_doc) following a previous occurrence (param_2) of the current token (param_3)" ---
        different verb form and the parenthetical anchors dropped. The full sentence is quoted above in
        place of the paraphrase. The cell''s second quotation, "the previous but the last couple of tokens,
        and sometimes the current token too", is verbatim. The cell attributes the induction-head definition
        to this post; the post itself defers to an external explainer ("see this post for a great explanation"),
        so the definition is borrowed rather than derived here.

        '
      legacy_evidence: 'Connects to induction-head theory: head 1.4 acts as a classic induction head,
        ``attending to the token following a previous occurrence of the current token,'''' fed by previous-token
        heads. The connection is by analogy to named head types rather than formal derivation, and the
        authors'' ``Fuzzy Previous Token Head'''' is a loosened version of the standard type, attending
        to ``the previous but the last couple of tokens, and sometimes the current token too'''''
      legacy_warning: The legacy_evidence for this cell contains a paraphrase presented as a quotation,
        or a claim fused from two separate remarks in the source. Verified 2026-08-07. Use the quotes
        block, not the legacy text.
  M1:
    name: Reliability
    status: U
    short: Fifty prompts behind every plot; dispersion is never stated
    verified: true
    reasoning: 'Sample size is stated once and dispersion is never stated at all. Fifty prompts back every
      patching plot and every attention figure, the figures are batch averages, and every number that
      carries an argument --- 42%, 56%, 72%, 48%, 58%, the logit differences of 1.1, 0.5, -0.12 and -0.20
      --- is a single value with no interval and no repetition. One released model is run once, so neither
      sampling variability nor initialisation variability is bounded anywhere. U.

      '
    notes:
      verification: 'Verified against a full read for the absence. The strings standard deviation, confidence,
        error bar, variance, bootstrap and seed do not occur anywhere in the post, including the comment
        thread; that count is corroboration after reading, not the basis for it. The cell''s "batch of
        50 prompts for every experiment" is exact --- the post says "for all experiments and visualizations".

        '
      legacy_evidence: Unattempted. Batch of 50 prompts for every experiment; no confidence intervals,
        standard deviations, repeated runs, or seed variation anywhere. Every reported figure is a point
        estimate
  M2:
    name: Baseline separation
    status: PC
    short: 42\% against a 17\% chance level, with two further reference points
    verified: true
    reasoning: 'A chance level is computed and quoted beside the result, and the gap is large: 42% against
      17%. Two further reference points are given, the unablated model at 56% and an augmented model at
      72%, so the circuit is bracketed above and below. What is missing is the baseline that would show
      the 42% belongs to these eight heads rather than to eight heads. No arbitrary or size-matched head
      set is ever scored. Separation from chance shown, separation from a matched alternative not, which
      is PC.

      '
    notes:
      verification: 'All four numbers are verbatim: 42%, 17%, 56%, 72%, plus the ~75% original-task figure.
        The cell''s "no random-circuit baseline" holds on a full read --- the only comparison sets in
        the post are the full model, the full model minus heads 0.0 and 2.2, and the circuit plus named
        extra heads, all of which are chosen rather than random.

        '
      legacy_evidence: 'A chance baseline is reported and separation is clear: circuit 42\% against chance
        17\%. There is no random-circuit baseline --- no comparison against eight arbitrarily chosen heads,
        which is the control that would show 42\% is about \emph{these} heads'
  M3:
    name: Stability
    status: U
    short: Head membership is varied upward only; nothing re-measures the claim
    verified: true
    reasoning: 'Nothing perturbs the circuit and re-measures the same claim. Head membership is varied,
      but only upward and only as a search for more performance, so the 48% and 58% figures record what
      adding heads buys rather than whether the eight-head result survives a jolt; no head is swapped
      for a neighbour and no leave-one-out is run. A second docstring style is mentioned and a second
      positional-swap variant is run, both reported as agreeing, but neither re-derives the circuit. Perturbations
      exist at the edges of the argument and none of them touches the conclusion. U.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL. The legacy evidence asserts "no variation of the prompt
        template family". The post does vary it: "We''ve also looked into Google-style docstrings and
        found similar performance, but won''t discuss this further here." The qualification that keeps
        the U intact is that this remark is about the model''s task performance on the original prompts,
        carries no number, and precedes the isolating prompt design; the circuit is never re-derived on
        Google-style docstrings. A second variation is also run inside the head 0.4 analysis (whole-line
        positional swaps, layer 0 leakage), likewise reported as "similar results" with no numbers. "No
        perturbation of the circuit boundary" is also loose --- the boundary is moved in Putting it all
        together --- but only in the direction of adding heads.

        '
      legacy_evidence: Unattempted. No perturbation of the circuit boundary, no swap of a head for a neighbour,
        no variation of the prompt template family
      correction: 'The legacy cell says there is ''no variation of the prompt template family''. The post
        varies it: ''We''ve also looked into Google-style docstrings and found similar performance, but
        won''t discuss this further here.'' U survives only because that remark carries no number and
        never re-derives the circuit.'
  M4:
    name: Calibration
    status: PC
    short: Logit difference against the highest wrong answer, recomputed throughout
    verified: true
    reasoning: 'The metric is well chosen for what is being claimed. Logit difference against the highest
      wrong answer, recomputed each time, cannot be gamed by a model that raises all argument names together,
      and the success rate is read directly off the task. The two scales are then compared without adjustment.
      The 42% circuit is set beside a 56% full model that the isolating prompts have already depressed
      from about 75%, and the authors say so themselves and call the resulting logit difference low. A
      sound metric read against a moving reference is PC.

      '
    notes:
      verification: 'DERIVED NUMBER. The cell says the isolating prompts "cost the model roughly 19 points
        from its ~75% standard performance". The post states ~75% and 56% in separate sections and never
        subtracts them; 19 is the auditor''s arithmetic, and it inherits the tilde on 75%. Both operands
        are quoted above, so the derivation is checkable, but it should not be read as a reported figure.
        Everything else in the cell is verbatim, including the authors'' own flag that "on this task the
        model performs worse than on the original one".

        '
      legacy_evidence: 'Logit difference against the highest wrong answer is well chosen and interpretable,
        and success rate is direct. The 42\% / 56\% comparison is uncalibrated in a way the authors themselves
        surface: the 56\% full-model baseline is artificially depressed, since the algorithm-isolating
        prompts cost the model roughly 19 points from its $\sim$75\% standard performance'
  M5:
    name: Sensitivity
    status: U
    short: Nothing with a known answer is fed in to see whether it comes back
    verified: true
    reasoning: 'Nothing with a known answer is fed to the method to see whether the method returns it.
      No component is planted, no synthetic circuit is built and recovered, and no head with an independently
      established role is used to calibrate the patching pipeline. The nearest thing is a theory-driven
      search: induction theory says a previous-token head must sit below head 1.4, the authors go looking
      and find 0.2, and they attach a confidence caveat to the identification. That is a prediction confirmed,
      not a positive control, because the answer was not known in advance of the search. U.

      '
    notes:
      verification: 'Read looking for a control: Methods (Patching experiments), the head 0.2 paragraph,
        the Multi-Function Head 1.4 sweep, and Putting it all together. The synthetic |BOS|S0|A|B|C|S1|
        prompts come with stated expectations for a pure induction head and a pure previous-token head,
        which is the closest the post gets to a reference behaviour, but they test what head 1.4 does
        rather than whether the method can detect a known head. The cell''s "no known-positive control"
        holds; "no synthetic circuit is recovered" holds.

        '
      legacy_evidence: 'Unattempted. No known-positive control: no head with a known role is planted and
        verified, no synthetic circuit is recovered'
  M6:
    name: Invariance
    status: U
    short: No conclusion is re-derived under a changed condition and shown to hold
    verified: true
    reasoning: 'The same conclusion is never re-derived under a changed condition and shown to hold. Each
      of the three corruptions probes a different piece of information, so they are complementary rather
      than redundant, and no result is reported twice under two settings for comparison. Both patching
      directions were in fact run, but the post reports only the selected ones, which converts a possible
      invariance check into a presentation choice. Two performance scales appear, logit difference and
      success rate, and they are used at different points rather than against each other. U.

      '
    notes:
      verification: 'CONTRADICTION WITH THE CELL, twice over, though neither forces the status. "One prompt
        family" is contradicted by the Google-style docstring remark. "One metric family" is loose: the
        post uses logit difference throughout the patching sections and switches to success rate for the
        circuit evaluation. The clean-to-corrupt direction is addressed only in the comment thread, where
        the author writes that all plots were run both ways and the informative ones kept; that is quoted
        here because it is the strongest evidence for or against the cell and it lives outside the post
        body.

        '
      legacy_evidence: Unattempted. One prompt family, one metric family, one corruption regime per experiment;
        no cross-condition consistency check
  M7:
    name: Selection correction
    status: U
    short: Components are chosen from the strongest cells of a patching grid
    verified: true
    reasoning: 'Components are chosen by looking at which cells of a patching grid are strongest, and
      the phrase for it is the authors'' own. The same success-rate metric that then scores the circuit
      is used to decide membership: head 1.0 is admitted because it lifts 42% to 48%, heads 0.1 and 2.3
      because they lift it to 58%, heads 0.0 and 2.2 are dropped from the full model because doing so
      lifts 56% to 72%. Selecting on a statistic and reporting the same statistic is exactly the situation
      a correction addresses, and none is applied. No candidate count is stated, so the size of the search
      is not even recoverable from the post. U.

      '
    notes:
      verification: 'The cell reads "further heads (0.1, 1.0, 2.3) are added or dropped". All three are
        added; the two heads dropped are 0.0 and 2.2, and they are dropped from the full model rather
        than from the circuit. "Added or dropped" reads as covering both, so the phrasing is imprecise
        rather than wrong. The cell''s "N is never stated as such" holds --- the post never gives the
        model''s head count, and an earlier correction to this repo removed a "from 32" that came from
        outside the source.

        '
      legacy_evidence: Unattempted. Eight heads are selected by inspection of patching results, and further
        heads (0.1, 1.0, 2.3) are added or dropped by their effect on the same success-rate metric that
        then scores the circuit. The candidate pool is small enough to state; $N$ is never stated as such
        and no multiplicity control is applied
  I1:
    name: Necessity
    status: PC
    short: Every head is knocked out by resampling and the tests bite
    verified: true
    reasoning: 'Necessity is tested component by component and the tests bite. Every head in the circuit
      is knocked out by resampling and the drop in logit difference is read off, under three corruptions
      that each remove a different piece of information, which is what lets a head be shown necessary
      for the B_doc value specifically rather than for the task in general. One ablation regime carries
      all of it. The post names zero and mean ablation in the same breath as the method it chose and never
      runs either, so no result is confirmed under a second removal operator. Necessity established within
      one regime is PC.

      '
    notes:
      verification: 'The "up to 1.1 logit diff change" figure is verbatim and belongs to head 0.5, as
        the cell implies. The three corruption names are verbatim. The cell''s "no zero- or mean-ablation
        cross-check" is confirmed by the post''s own sentence distinguishing resampling from both. The
