criteria:
  C1:
    name: Falsifiability
    status: C
    short: Point prediction against a linear control, plus a two-parameter phase diagram
    verified: true
    reasoning: 'The paper names the observation that would sink the hypothesis before running anything:
      if networks cannot noisily represent more features than they have neurons, superposition "may be
      comfortably dismissed." The test is then built so it could fail. Two models differ in one activation
      function, and the linear one is the well-understood case that cannot superpose, so the ReLU model
      matching it at every sparsity level would have settled the question negatively. It does match in
      the dense regime and departs as sparsity rises. The phase-change experiment adds a directional prediction
      over an importance x sparsity grid, scoring each cell as not learned, superposed, or orthogonal,
      against closed-form losses for the candidate weight configurations.

      '
    notes:
      legacy_evidence: 'The linear model makes a point prediction that could have failed and did not:
        with no output nonlinearity the optimum is the top-$m$ principal components at every sparsity
        level, so no extra features. The ReLU model differs by one activation function and superposes.
        The phase diagrams then make directional predictions over a two-parameter grid, with boundaries
        derived in closed form before being measured'
      verification: 'One qualification on the cell. It says the phase boundaries were "derived in closed
        form before being measured." The paper presents the theoretical and empirical diagrams side by
        side and states that the phase change is "observed in both"; it does not record which came first.
        The rest of the cell checks out verbatim.

        '
      verdict_derivation: 'Verdict computed from the criteria on 2026-08-07 rather than asserted: Mechanistically
        Supported, blocked above that by I6=U. The 35-criterion table scores the primary reading, so the
        criteria, the primary reading''s verdict and the overall verdict are one number by construction.'
  C2:
    name: Structural plausibility
    status: C
    short: Mechanism derived in closed form, then matched against the trained weights
    verified: true
    reasoning: 'The mechanism is computed rather than inferred from the trained model. Losses for each
      candidate way of storing two features in one dimension are determined analytically, the transition
      between them is confirmed to be first order by locating the crossover in the derivative of the optimal
      loss, and the same treatment is extended to three features in two dimensions. Where the paper reads
      structure off the weights, as in the asymmetric superposition motif, it names the parts: one neuron
      stores two features at reciprocal magnitudes, a second inhibits the case that would produce positive
      interference, and the output ReLU makes the resulting negative interference cheap.

      '
    notes:
      legacy_evidence: The mechanism is derived rather than inferred. Closed-form losses are computed
        for each candidate weight configuration in the $n=2, m=1$ and $n=3, m=2$ cases; the transition
        is ``analytically confirm[ed]'' to be first order, as a crossover between those loss curves; the
        pentagon radius is predicted from the bias as $\|W_i\| = 1/(1-b_i)$ and observed; and the asymmetric-superposition-and-inhibition
        motif in the computation model is read directly off the weight matrix, with the interference-cancelling
        neuron identified
      verification: 'The pentagon-radius quote stops at "setting their weights to" because pdftotext drops
        the formula into a separate math run that cannot be quoted contiguously. The formula the cell
        reports, ||W_i|| = 1/(1-b_i), is at that point in the source and is stated as the explanation
        for an observed deviation from the unit circle. The cell reads it as a prediction that was then
        observed; the text presents it in the other order.

        '
  C3:
    name: Convergent validity
    status: C
    short: Theory and experiment agree, and three outside groups replicated before publication
    verified: true
    reasoning: 'Agreement comes from families of evidence that could have disagreed. The closed-form "toy
      model of the toy model" and the trained models produce the same phase change. The geometric account,
      in which uniform superposition solves a generalised Thomson problem and lands on uniform polytopes,
      is a third description of the same solutions. Beyond the authors, the article carries three independent
      replications from Redwood Research, DeepMind and OpenAI, covering the demonstration, the phase change,
      feature dimensionality and the energy-level jumps.

      '
    notes:
      legacy_evidence: 'Three independent families at origin: closed-form analysis, trained-weight inspection,
        and a geometric characterisation (feature dimensionality, tegum factors, uniform polytopes) that
        uses neither. Later convergence from methods the origin did not use: feature-capacity theory (Scherlis
        et al.\ 2022, three weeks later, independently deriving the same tradeoff), sparse probing across
        seven real models 70M--6.9B (Gurnee et al.\ 2023), dictionary learning \citep{cunningham2023sparse,
        bricken2024monosemanticity}, and a scaling-law derivation confirmed in open-weight LLMs (Liu,
        Liu \& Gore 2025)'
      verification: 'The cell understates the origin-time evidence and overstates one part of it. The
        three replications reported in Comments & Replications and named in the acknowledgments are the
        strongest convergence available at publication and the cell does not mention them. Against that,
        the cell calls the geometric characterisation a family that uses neither closed-form analysis
        nor trained-weight inspection; feature dimensionality is computed from the trained W, so it is
        a statistic over the same weights rather than an independent measurement. One replication also
        disagrees with the paper on activation-function dependence, recorded under M3 and M6.

        '
  C4:
    name: Discriminant validity
    status: PC
    short: Three-way discrimination against planted features; PCA separated as a limiting case
    verified: true
    reasoning: 'The measures are built to separate outcomes that the planted data distinguishes in advance:
      a feature is unlearned, superposed, or given a dedicated dimension, and the norm of the embedding
      vector together with the projection of other features onto it decides which. Within the toy setting
      this is clean by construction. The correlated-feature experiments add a second separation, between
      superposition and PCA, by driving the model from one to the other as sparsity falls. Discriminant
      validity for the wider claim rests on polysemanticity implying capacity pressure, which the paper
      assumes rather than tests.

      '
    notes:
      legacy_evidence: 'Within the declared scope, separation is by construction and clean: the measures
        $\|W_i\|$ and $\sum_{j \neq i}(\hat{W}_i \cdot W_j)^2$ distinguish ``not learned,'''' ``represented
        in superposition'''' and ``dedicated dimension'''' against planted ground truth, and the correlated-features
        experiments separate superposition from PCA as the capacity runs out. Outside it, the diagnostic
        inference fails: Lecomte et al.\ (2023) show polysemanticity arises ``even when there are ample
        neurons to represent all features,'''' so the observation the hypothesis was built to explain
        does not discriminate'
  C5:
    name: Nomological validity
    status: C
    short: Formal links to compressed sensing, the Thomson problem and distributed codes
    verified: true
    reasoning: 'The hypothesis is placed in three literatures with content, not by analogy. Compressed
      sensing supplies a lower bound that is turned into an upper bound on superposition in the toy model,
      with the derivation carried out in the appendix. The 1-sparse loss term reduces to a generalised
      Thomson problem, which is what makes the polytope geometry a prediction rather than a description.
      The neuroscience section maps local and distributed codes onto the paper''s own decomposability
      and superposition axes. All of this sits on a decomposition of the linear-representation hypothesis
      into decomposability and linearity, with privileged basis stated as a separate question, before
      any experiment.

      '
    notes: &id001
      legacy_evidence: 'Connected to three literatures with formal content rather than by analogy: compressed
        sensing, with an appendix deriving the connection between compressed-sensing lower bounds and
        the toy model; the Thomson problem and uniform polytopes for the geometry; and distributed / population
        codes in neuroscience. The linear-representation hypothesis is decomposed into two separable sub-hypotheses
        --- decomposability and linearity --- and the privileged-basis question is stated as a third,
        all before any experiment'
  C6:
    name: Complementation validity
    status: U
    reasoning: 'The individual features are the subdivisions and the toy setting makes the test unusually
      cheap, since the ground-truth features are specified by construction. Nothing exploits that: the
      geometry is characterised in aggregate, and no experiment perturbs two features together and reads
      the result against each alone.'
    short: Ground truth is available by construction and the test is not run
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: PC
    short: Repetition run and reported; aggregation is selection by loss, with no dispersion
    verified: true
    reasoning: 'Repetition happens and the rule is stated each time, which is what separates this from
      an unreported single fit. The rule is selection in two of the three cases: the phase diagram averages
      ten models per point after discarding the worst, the m=2 geometries are the lowest-loss of several
      fits, and the neuron-level figures are the best of a thousand. Reading the sections that report
      these numbers, no standard deviation, interval or spread across the repeated fits accompanies any
      of them.

      '
    notes:
      legacy_evidence: 'Repetition is run and the aggregation rule is stated, but the rule is selection
        rather than averaging in two of three cases. Phase diagrams: ``we train ten models for each point
        and average over the results, discarding the model with the highest loss.'''' ReLU hidden layer:
        ``we trained 1000 models and visualized the one with the lowest loss.'''' The $m=2$ geometry:
        ``Getting clean results required fitting each model multiple times and taking the solution with
        the lowest loss.'''' No dispersion --- standard deviation, interval, or spread across the repeated
        fits --- is reported alongside any of the averaged or selected quantities'
  M2:
    name: Baseline separation
    status: C
    short: Linear control cannot superpose, runs at every sparsity, and separates completely
    verified: true
    reasoning: 'The baseline is chosen so that it cannot produce the effect: for a linear model it is
      never worthwhile to represent more features than dimensions, so any superposition in the ReLU model
      is attributable to the one component that differs. It is run in the same figures at every sparsity
      level, and its solution is sparsity-independent, which makes the separation visible rather than
      argued. A second baseline is analytic: closed-form losses for each candidate configuration give
      the value the observed solution had to beat.

      '
    notes:
      legacy_evidence: 'The linear model is a control that cannot exhibit the phenomenon by construction,
        is run at every sparsity level in the same figures, and separates completely --- it learns the
        top-$m$ most important features and nothing else, and its solution ``does not depend on sparsity
        level.'''' The ``toy model of the toy model'''' supplies a second kind of baseline: the closed-form
        loss of every candidate solution the observed one had to beat'
  M3:
    name: Stability
    status: PC
    short: Sparsity, importance, correlation and size all swept; activation function held fixed
    verified: true
    reasoning: 'Perturbation is the method here, and it reaches the data-generating process as well as
      the model: sparsity from 1.0 to 0.01, importance from 0.1 to 10, single features perturbed against
      a uniform background, correlation imposed in both directions, and the activation support widened
      to [-1,1] for the computation model. What stays fixed is the activation function, which Open Questions
      lists among the untried ways to control superposition. The paper also reports an instability of
      its own: the ReLU hidden layer model avoids its nonlinearity unless forced, which the authors call
      a significant mark against that variant.

      '
    notes:
      legacy_evidence: 'Perturbation is the method rather than a check on it, and it reaches the data-generating
        process as well as the model: sparsity swept over orders of magnitude, importance swept 0.1--10,
        single features perturbed against a uniform background, independence broken in both directions
        by correlated and anticorrelated feature sets, the activation support changed from $[0,1]$ to
        $[-1,1]$ for the computation model, and sizes from $(2,1)$ to $(80,20)$. What is not perturbed
        is the shape of the activation distribution, uniform in every experiment, and the activation function,
        ReLU in every experiment --- the latter named in Open Questions as a promising untried control
        (``changing the activation function all seem promising''''). The paper also reports its own instability:
        for the ReLU hidden layer model ``the model will only use the ReLU activation function if absolutely
        forced, which is a significant mark against studying this toy model'''''
      verification: 'Two corrections to the cell. First, the size range is given as (2,1) to (80,20);
        the uniform superposition experiments use n=400, m=30, and the computation model uses n=100, m=40,
        so the sweep is wider than recorded. Second, the article does contain a report of varying the
        activation function, in Kshitij Sachan''s replication comment, which found that the phase diagrams
        "look quite different depending on the activation function." That is an invited external replication
        rather than an author experiment, so the cell is right that the paper''s own experiments hold
        it fixed, and the evidence the article carries on the point is destabilising.

        '
  M4:
    name: Calibration
    status: PC
    short: Two purpose-built measures with stated readings and no external calibration
    verified: true
    reasoning: 'Both measures come with an interpretation attached rather than a threshold chosen after
      the fact: the embedding norm says whether a feature is represented, and the summed projection of
      other features onto its direction has a stated meaning at 1, where some group of other features
      can activate the direction as strongly as the feature itself. Feature dimensionality is anchored
      by summing to the number of hidden dimensions, which makes it a capacity accounting. Nothing is
      tied to a quantity outside the toy model, and the authors list the definition of superposition itself
      as an open question.

      '
    notes:
      legacy_evidence: 'Two purpose-built measures with stated interpretations: $\|W_i\|$ for whether
        a feature is represented, and $\sum_{j\neq i}(\hat{W}_i \cdot W_j)^2$ for shared dimension, where
        ``values $\geq 1$ mean that there is some group of other features which can activate $W_i$ as
        strongly as feature $i$ itself.'''' Feature dimensionality sums to $m$, which makes it a genuine
        capacity accounting. Nothing is calibrated against an external quantity, and Open Questions asks
        ``what is the most principled definition of superposition / polysemanticity?'''''
      verification: 'The cell says feature dimensionality "sums to m." The paper reports this as an empirical
        observation conditional on efficient packing, not as an identity.

        '
  M5:
    name: Sensitivity
    status: C
    short: Planted ground-truth features give a known positive at every point
    verified: true
    reasoning: 'Sensitivity is structural here. The features are synthesised, with sparsity and importance
      set per dimension, so every experiment has a known positive and any failure to recover it is visible.
      The authors name this as the reason the toy models are worth studying at all, in contrast to real
      models where no ground truth for features exists. The measures are then asked to recover planted
      structure that the design guarantees is present.

      '
    notes:
      legacy_evidence: 'The toy setting''s structural advantage, used as such: ground-truth features are
        planted, so a known-positive is available at every point in every experiment. The authors name
        it as the reason the model is worth studying --- ``This is also the reason why the toy models
        described in this paper can be studied -- we do know what the features are!'''' The measures recover
        the planted structure where theory says they should and fail where it says they should not'
  M6:
    name: Invariance
    status: PC
    short: Holds across sizes and data structures; one activation function and one loss
    verified: true
    reasoning: 'The phenomenon survives changes of scale and data structure: results are qualitatively
      similar as features and hidden dimensions grow, and the paper reports that the number of input features
      does not matter once it exceeds the hidden dimension, with the number of learned features scaling
      with hidden dimensions. Held fixed are the activation function, the importance-weighted squared-error
      loss and the optimiser. The one report in the article of varying the activation function comes from
      an external replicator and finds the phase diagrams differ, which is why this is partial rather
      than confirmed.

      '
    notes:
      legacy_evidence: 'The phenomenon is reported across four model variants, two tasks, sparsity and
        importance grids, and uniform / non-uniform / correlated / anticorrelated feature structure. Three
        conditions are held fixed rather than varied: the activation function (ReLU throughout, and Open
        Questions lists ``changing the activation function'''' among the untried ways to control superposition),
        the loss (importance-weighted MSE throughout), and the optimiser. The geometry results are additionally
        confined to $m \leq 3$ or small $n$ by the need to visualise them'
  M7:
    name: Selection correction
    status: U
    short: Best-of-1000 and worst-discarded selection documented, with no correction applied
    verified: true
    reasoning: 'Selection is on the outcome and is disclosed: a thousand fits per neuron-level figure
      with the lowest-loss one shown, ten models per phase-diagram point with the worst discarded, and
      lowest-loss selection for the m=2 geometries. The authors state what selection buys, that the minimal-loss
      solutions reveal more structure than typical ones, which concedes the reported structure is a property
      of the best-found optimum. No correction accompanies it.

      '
    notes:
      legacy_evidence: Unattempted, and the selection is on the outcome. The headline geometry figures
        show the best of 1000 fits; the phase diagram discards the worst of ten; the $m=2$ solutions are
        the lowest-loss of several. $N$ is stated in every case, so the procedure is documented rather
        than hidden, but the reported structures are properties of the best-found optimum rather than
        of what training typically produces, and no correction is applied
      verification: 'The cell says "the headline geometry figures show the best of 1000 fits." The thousand-fit
        selection belongs to the ReLU hidden layer neuron figures in Superposition in a Privileged Basis.
        The geometry figures use lowest-loss selection over several fits at m=2; the uniform superposition
        figures carry no stated selection rule.

        '
  I1:
    name: Necessity
    status: C
    short: Output nonlinearity, sparsity and negative bias each shown to be required
    verified: true
    reasoning: 'Necessary conditions are established by direct manipulation of one component at a time.
      Removing the output nonlinearity removes superposition, which the paper states as the reason the
      activation function is critical, and the linear model never benefits from representing more features
      than dimensions. Sparsity is necessary for superposition to occur, with the dense case reproducing
      linear-model behaviour. The negative bias is what lets the model discard small interference. Necessity
      for performance is argued analytically, by comparing closed-form losses of the candidate configurations,
      and empirically by L1 regularisation, which removes superposition at the cost of a higher loss.

      '
    notes:
      legacy_evidence: 'Established in two directions. The necessary \emph{conditions} are shown by direct
        manipulation: remove the output nonlinearity and superposition disappears at every sparsity; set
        $1-S = 1.0$ and the ReLU model matches the linear model exactly; remove the negative bias and
        the mechanism for discarding small interference goes with it. The necessity \emph{for performance}
        is shown analytically rather than asserted: in ``Superposition as a Phase Change'''' the loss
        of each candidate weight configuration is determined in closed form --- $W = [1,0]$, $W = [0,1]$
        and the antipodal $W = [1,-1]$ for $n=2, m=1$, and four configurations for $n=3, m=2$ --- and
        the superposed solution has the lowest loss over a located region of the sparsity--importance
        plane, with the crossover confirmed as a first-order transition (``there''s crossover between
        the functions, causing a discontinuity in the derivative of the optimal loss''''). L1 regularisation
        supplies the empirical counterpart, removing superposition ``albeit at the cost of a higher loss,''''
        without accompanying numbers'
      verification: 'One overstatement in the cell. It says that at 1-S = 1.0 the ReLU model "matches
        the linear model exactly." The paper says it "behaves the same on dense features." No numerical
        identity is reported. The L1 result is reported without accompanying numbers, as the cell says.

        '
  I2:
    name: Sufficiency
    status: C
    short: Built from the hypothesised ingredients alone, and superposition appears
    verified: true
    reasoning: 'Sufficiency is shown by construction, which is the strongest form available in a synthetic
      setting. The data has exactly the properties the hypothesis names, sparse features, more features
      than neurons, and varying importance, and the model adds one nonlinearity; nothing else is introduced
      and superposition appears. The authors describe the result as a direct demonstration under a relatively
      natural setup. The absolute-value model extends this from storage to computation: the same ingredients
      suffice for the network to compute a nonlinear function through a layer holding more features than
      neurons.

      '
    notes:
      legacy_evidence: 'Sufficiency is established by construction in the strongest available form: the
        model is built with exactly the four hypothesised ingredients (sparse features, more features
        than dimensions, varying importance, one nonlinearity) and superposition appears without anything
        else being added. For computation rather than storage, the absolute-value model shows the same
        ingredients suffice to carry a nonlinear function through a compressed layer, with the mechanism
        identified in the weights'
      verification: 'The cell says "exactly the four hypothesised ingredients." The paper states three
        assumptions about the data and treats the final activation function separately as the design choice
        that turns out to be critical. The count is defensible; the paper does not present them as one
        list of four.

        '
  I3:
    name: Minimality
    status: PC
    short: Load-bearing parts named and the smallest case solved; data assumptions untested
