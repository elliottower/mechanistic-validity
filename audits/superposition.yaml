  missing: '---'
- name: Mechanistically Supported
  requires: Sufficiency (I2); reach (E1); specificity (I4)
  missing: '\textbf{I4} not applicable: one objective, and superposition is induced by changing the task,
    so losses at different amounts of it are measured on different tasks'
- name: Triangulated
  requires: Convergence (C3); replication (E2/E4); dissociation (I6)
  missing: \textbf{I6} unattempted; no second property is shown intact while superposition is removed,
