claim: superposition
verdict: Mechanistically Supported
readings:
- statement: A ReLU network on sparse features represents more features than it has dimensions, in geometries
    set by sparsity and importance
  verdict: Mechanistically Supported
  missing: A converse arm, with some property shown intact while superposition is removed (I6); correction
    for the lowest-loss selection the reported geometries are drawn from (M7); an input distribution outside
    the synthetic family (E2)
  primary: true
- statement: The reported geometries are properties of the optimum rather than of the optimiser
  verdict: Underdetermined
  missing: The $m=2$ case is reported as much harder for gradient descent and its solutions are selected
    by loss (I7, M7); an invited comment in the same article shows the global minimum can have a smaller
    basin of attraction than nearby local minima, and the paper leaves it open (V3)
  primary: false
- statement: The phase diagram is fixed by sparsity and importance alone
  verdict: Disconfirmed
  missing: 'Nothing --- tested and failed: the paper holds the activation function fixed across every
    one of its own experiments, and a replication carried in the same article finds the phase diagrams
    look quite different under other activation functions (M3, M6)'
  primary: false
- statement: Language models represent features in superposition
  verdict: Insufficient
  missing: Every measurement is on a toy model, and the paper labels its real-model section validation
    by consistency with existing reports rather than measurement taken here (E4); no natural-data distribution
    appears anywhere, and Open Questions asks whether real importance and sparsity curves can be estimated
    at all (E2)
  primary: false
