criteria:
  C1:
    name: Falsifiability
    status: C
    short: Directional prediction against four named baselines; partly fails in layer 4
    verified: true
    reasoning: 'The comparison is directional and stated in advance of the result: scores from the learned
      dictionary against scores from named alternative decompositions, on the same metric. It could have
      come out the other way, and in two layers it substantially does — the paper reports the advantage
      collapsing to parity with ICA at layer 4 and to near-nothing at the final layer, rather than reporting
      only the layers where the effect holds.

      '
    notes:
      legacy_evidence: 'The comparative prediction is directional and could fail against six named baselines
        (default basis, random directions, PCA, ICA, top-$K$ PCA, top-$K$ ICA). It partly does: the advantage
        is ``comparable to ICA in layer 4'''' and shows ``minimal improvement in the final layer.''''
        Leask et al.''s stitching prediction is equally falsifiable --- adding novel latents should improve
        reconstruction and swapping reconstruction latents should not'
      verification: 'Contradiction with the cell as written. The origin names four baselines, not six.
        §3.2 lists the default basis, random directions, PCA and ICA, and Figure 2 — the headline comparison
        — is against those four. Top-K PCA and top-K ICA appear only in Appendix G (Figure 18) as a control
        against a specific objection, that a sparse-coding feature activates on less than a full direction
        while a PCA direction activates on a half-space. Calling them baselines is defensible; calling
        the headline comparison a six-baseline comparison is not. The two layer-4 and final-layer phrases
        are verbatim.

        '
  C2:
    name: Structural plausibility
    status: PC
    short: Predicted by superposition; MLP training fails, attention not attempted
    verified: true
    reasoning: 'The object is the one superposition predicts rather than one chosen for convenience: if
      a layer holds more features than dimensions, the features form an overcomplete non-orthogonal basis,
      and recovering them is sparse dictionary learning. The derivation is stated in §1 before any method
      appears. It is partial because the structural story is only carried through at one site. The residual
      stream works; the MLP requires untying encoder from decoder and still fails to give overcomplete
      bases in intermediate layers; and attention is named as future work.

      '
    notes:
      legacy_evidence: 'Grounded in the superposition account: an overcomplete dictionary over the residual
        stream is the object that account predicts. The structural story covers one site only. The authors
        report where it breaks: the pipeline ``is not able to robustly learn overcomplete bases in the
        intermediate layers of the MLP,'''' MLPs require untying the encoder and decoder, and attention
        is not attempted --- ``it''s unclear how to apply this to the Attention sublayer since we''d need
        to see which position dimension the feature is in'''''
      verification: 'Contradiction with the cell''s supporting quote. The sentence "Additionally, it''s
        unclear how to apply this to the Attention sublayer since we''d need to see which position dimension
        the feature is in" is in Appendix D.4, "Failed Interpretability Methods," and its referent is
        a weight-based cross-layer method — multiplying a layer-4 dictionary feature by the MLP and taking
        cosine similarity with layer-5 features, which "There were no meaningful connections." It is not
        a statement about training sparse autoencoders on attention activations. The claim that attention
        is not attempted is still correct and is better sourced to §6.2, quoted above. A second wrinkle:
        Figure 1''s caption says the method samples "either the residual stream, MLP sublayer, or attention
        head sublayer," so the paper''s own overview advertises an attention site for which it reports
        no results.

        '
  C3:
    name: Convergent validity
    status: PC
    short: Two evidence types; the concurrent-origin pairing comes from the follow-up, not here
    verified: true
    reasoning: 'Two evidence families are present and they are genuinely different instruments: an automated
      language-model scoring of activation patterns, and an interventional patching experiment scored
      by KL divergence. Neither depends on the other''s assumptions. What keeps this at partial is that
      both are run by the same authors on the same dictionaries, and the later literature that could have
      converged has instead split on whether the units are the model''s.

      '
    notes:
      legacy_evidence: 'Two evidence types at origin --- automated interpretability scoring and activation
        patching --- plus a concurrent independent origin (Bricken et al.\ 2023). Later convergence is
        broad on the method and divergent on the claim: SAEBench, MIB, AxBench and its 2026 rebuttal reach
        opposite conclusions about utility, and \citet{mueller2025mib} finds no causal-localisation advantage
        over neurons'
      verification: 'The two origin evidence types are confirmed. The concurrent-origin claim is not attested
        in Cunningham et al., which never cites Bricken et al. (2023) anywhere in its reference list;
        the pairing comes from Leask et al., who cite the two together as the joint origin of the method.
        SAEBench, MIB, AxBench and the 2026 rebuttal appear in neither audited paper, so nothing here
        is quotable for them.

        '
  C4:
    name: Discriminant validity
    status: PC
    short: Scored against the origin's operational construct, not the field's
    verified: true
    reasoning: 'The origin defines its construct as a dictionary feature that approximates an unknown
      ground truth network feature, and its case studies score against a weaker operational stand-in:
      whether a direction admits one human-readable explanation. The neighbouring constructs the construct
      must be separated from — an atomic unit, a complete unit, and a direction that is an artifact of
      the dictionary rather than a property of the model — are exactly the ones the follow-up tests. Atomicity
      fails: meta-SAE decomposition of a 49,152-latent GPT-2 dictionary recovers components that match
      latents of a comparably sized ordinary SAE, and the decompositions are themselves interpretable
      at 73% five-way identification. Completeness fails: 657 latents in a 1,536-latent SAE have no counterpart
      in the 768-latent SAE, and adding them reduces reconstruction error by almost 10%. Both tests were
      capable of returning nothing and did not.

      '
    notes:
      legacy_evidence: 'The construct is ``a feature of the model,'''' and both neighbouring constructs
        have been tested and not separated. Not atomic: meta-SAE decomposition recovers general components
        matching smaller-SAE latents, with 73\% five-way identification against a 20\% floor, and the
        cause named as the sparsity penalty. Not complete: 657 of 1{,}536 latents in the larger of a stitched
        GPT-2 pair are novel relative to the smaller, and adding them ``reduces the MSE by almost 10\%.''''
        Not distinguishable from a dictionary artifact: the origin''s headline metric returns similar
        values on randomly initialised transformers (Heap et al.\ 2025). Tests capable of exposing the
        failure were run and the criterion failed'
      verification: 'Every number in the cell checks out with one qualification. The 20% chance floor
        is not stated anywhere in Leask et al.; it is an inference from "ask it to choose which of 5 SAE
        latent explanations most relate to the explanations of the meta-SAE latents," where four of the
        five are random distractors. The floor is right, but it is the auditor''s arithmetic rather than
        the paper''s number, and the cell should say so. "657 of 1,536" is a fair restatement of "all
        657 latents in GPT-1536," since GPT2-1536 has 1,536 latents (Table 2). Heap et al. (2025) appears
        in neither audited paper, so the third leg of this cell is unquotable from these sources. The
        Leask PDF read for this audit is /Users/elliottower/Downloads/ICLR-2025-sparse-autoencoders-do-not-find-canonical-units-of-analysis-Paper-Conference.pdf,
        bib key leask2025canonical.

        '
  C5:
    name: Nomological validity
    status: PC
    short: Fits superposition; the theory does not underwrite the method
    verified: true
    reasoning: 'The theoretical chain is stated precisely and in the right order: superposition implies
      an overcomplete non-orthogonal basis, superposition requires sparsity, sparsity plus overcomplete
      recovery is sparse dictionary learning, and an ℓ1 penalty is cited as recovering ground truth. What
      the theory does not deliver is uniqueness. Nothing in the superposition account says the recovered
      dictionary is the only one, and the follow-up shows the sparsity penalty pushing in the opposite
      direction — rewarding composed latents precisely because they are sparser.

      '
    notes: &id001
      legacy_evidence: 'Fits superposition and the linear representation hypothesis, and the origin states
        the connection precisely. The theory does not underwrite the strong claim: nothing in superposition
        predicts a \emph{unique} dictionary, and Leask et al.\ show the training objective actively pushes
        against one --- ``The sparsity penalty incentivizes larger SAEs to learn compositions of latents
        rather than atomic latents'''''
      verification: 'The Leask quote in the cell is verbatim from the Figure 2 caption, where it is the
        caption''s closing sentence rather than a body claim. The cell''s stronger assertion, that nothing
        in superposition predicts a unique dictionary, is an argument rather than a quotable finding:
        neither paper states it, and the closest attested support is Leask''s demonstration that the penalty
        rewards composed latents. One quote in this cell was swapped during verification: the origin sentence
        about sparsity being required for superposition is interrupted in the PDF by a footnote block,
        a page break and the Figure 1 caption, so the contiguous sparse-dictionary-learning sentence from
        the same passage is quoted instead.'
  C6:
    name: Complementation validity
    status: U
    reasoning: 'The dictionary''s features are the subdivisions, and whether they are functionally distinct
      is the live question in this literature rather than a settled premise: feature splitting and absorption
      both describe a labeled subdivision that turns out not to be atomic. The audited work does not run
      the comparison, so the units are separated by the training objective rather than by any test of
      their distinctness.'
    short: Feature splitting is the open question; no test of atomicity is run
    verified: false
    notes: *id001
    quotes: []
  M1:
    name: Reliability
    status: I
    short: One training run per configuration; no repetition reported
    verified: true
    reasoning: 'The training appendix specifies the optimiser, the data volume and the epoch count and
      says nothing about seeds or repeated runs, and no figure caption in the paper reports variation
      across training runs. Figure 2''s error bars are confidence intervals over the 150 scored features
      from a single dictionary, which measures scoring spread rather than training reliability. Every
      reported quantity is therefore a single point estimate from one fit. The follow-up supplies the
      missing test at one width and finds high agreement, which is why the picture depends on scale rather
      than settling.

      '
    notes:
      legacy_evidence: 'Nothing at origin: the training appendix (\S B) specifies one run per configuration
        and reports no repetition, and the appendix inventory (A autointerpretation protocol, B training,
        C further autointerpretation, D qualitative analysis, E active features, F other layers, G top-$K$
        comparisons) contains no replication or seed-variation study, so every reported number is a single
        point estimate. Tested later, with results that depend on width: 94\% cross-seed agreement at
        3{,}072 latents on GPT-2 (Leask et al., Appendix A.6) against 30\% shared features at 131K latents
        on Llama 3 8B (Paulo \& Belrose 2025). Gerasimov et al.\ (2026) reconcile them by relocating the
        stable object --- unstable individual features concentrate in reproducible low-rank subspaces'
      verification: "The appendix inventory in the cell is exact and the absence of a seed study is confirmed\
        \ by reading all seven appendices. Two locator corrections. The 94% cross-seed figure is in Leask\
        \ et al. Appendix A.7 (Stitching experiments), with the seed axes labelled in Figure 18a; Appendix\
        \ A.6 is \"Open source SAE weights.\" And the 94% is a proportion of reconstruction latents at\
        \ a 0.7 cosine threshold, which is agreement in the sense the paper defines rather than a feature-identity\
        \ match. Paulo & Belrose (2025) and Gerasimov et al. (2026) appear in neither audited paper.\n\
        \ The seed axes are labelled in Leask et al. Figure 18a, \"Proportion of reconstruction latents\
        \ in GPT-2 SAEs with 3072 latents. X and Y labels are random training seeds\"; that caption is\
        \ set in two columns and does not extract contiguously, so the contiguous sentence from Appendix\
        \ A.7 is quoted instead."
  M2:
    name: Baseline separation
    status: PC
    short: SAE beats four baselines; the two negative controls do not separate from each other
    verified: true
    reasoning: 'The negative controls are constructed to be comparable rather than to lose: random directions
      and the default basis are rectified so their activations are nonnegative like the dictionary''s,
      which removes the obvious way a control could fail for a reason unrelated to the hypothesis. Both
      separate from the learned dictionary, and the separation survives the harder random-only scoring
      regime. The paper also reports the sharper negative that the two controls do not separate from each
      other, which is what a null-of-the-null looks like when it is honestly handled. What holds this
      at partial is that no random-network control exists — every baseline is a different decomposition
      of the same trained model''s activations, so nothing here distinguishes structure in the model from
      structure the dictionary imposes.

      '
    notes:
      legacy_evidence: 'Two baselines with opposite verdicts. The origin''s random-\emph{direction} and
        default-basis controls separate cleanly, and the paper reports the sharper negative alongside:
        ``We do not find residual stream basis directions to be any more interpretable than random directions.''''
        The random-\emph{network} baseline was not run at origin and fails when run: auto-interpretability
        scores on randomly initialised transformers are ``similar to those from trained models'''' (Heap
        et al.\ 2025)'
      verification: 'The default-basis quote is verbatim and sits in Appendix C.2, in the paragraph about
        transformers storing information in the residual stream basis. One thing the cell''s phrasing
        obscures: the quoted sentence says the two negative controls do not separate from each other,
        so "separate cleanly" must mean each separates from the learned dictionary, not that they separate
        from one another. The separation itself is reported as a figure with 95% confidence intervals
        over 150 features and no significance test. Heap et al. (2025) is not in either audited paper.

        '
  M3:
    name: Stability
    status: I
    short: Sparsity sweep gives a smooth tradeoff, not a stable optimum
    verified: true
    reasoning: 'The perturbation test was run and returned a negative, and the authors read it correctly.
      A stable decomposition would show a knee: a sparsity setting past which accuracy falls away, so
      that the chosen dictionary is picked out by the data rather than by the practitioner. The sweep
      shows a smooth exchange rate instead, at every setting tried, which is exactly the signature of
      a free parameter. The follow-up makes the same point on the other axis — the thresholds separating
      novel from reconstruction latents are set by inspection and differ by model family, and the conclusion
      is that no width is privileged.

      '
    notes:
      legacy_evidence: 'Perturbation was run at origin and returned a negative that the authors read correctly:
        sweeping the sparsity coefficient gives ``a smooth tradeoff between the sparsity and accuracy,''''
        and ``the lack of a `bump'' or `knee'' in these plots provides some evidence that there is not
        a single correct way to decompose activation spaces into a sparse basis.'''' Dictionary width
        changes which latents exist. Against this, subspaces are reproducible where features are not (Gerasimov
        et al.\ 2026), and Leask et al.''s own thresholds are hand-set per model family (0.7 for GPT-2,
        0.4 for Gemma Scope) ``based on our exploratory analysis'''''
      verification: 'Both origin quotes are verbatim; the cell truncates the second before the authors''
        own hedge, "though to confirm this would require many additional experiments," which is restored
        in the quote above. The Leask threshold quote is verbatim, and the paper spells "Gemmascope" that
        way in this sentence. Gerasimov et al. (2026) is in neither audited paper. One detail the cell
        asserts without a source in either paper: that dictionary width changes which latents exist is
        established by Leask''s novel-latent result, not by the Cunningham sweep, which varies the sparsity
        coefficient rather than the width.

        '
  M4:
    name: Calibration
    status: PC
    short: Interpretability score is a correlation with a meaningful zero
    verified: true
    reasoning: 'The metric is a correlation, so zero has a meaning that does not depend on the experiment:
      a description that predicts activations no better than chance. That is a real anchor, and the paper
      does not hide what the scale delivers — the unselected first-five sample in Table 1 includes a negative
      score of -0.11 and a top score of 0.57, and the sample is explicitly unselected. Calibration is
      partial in the direction that matters for the claim: nothing converts a score of 0.33 into a statement
      about how much of a feature''s behaviour is explained, and no upper reference point is established
      for what a genuinely monosemantic direction should score.

      '
    notes:
      legacy_evidence: 'The interpretability score is a correlation with a meaningful zero, and the origin
        prints an unselected sample including a negative value ($-0.11$ among the first five features).
        Leask et al.''s 73\% against a 20\% chance floor is properly anchored. Uncalibrated in the respect
        that matters: no absolute scale says what a score of 0.33 licenses, and the scale is known not
        to separate trained from random networks'
      verification: Table 1 confirms the -0.11 (feature 1-0001) and the 0.33 (feature 1-0000), and §3.1
        confirms the sample is the first five under an arbitrary ordering rather than a chosen five. The
        20% chance floor is the auditor's arithmetic from Leask's five-option protocol, not a number Leask
        reports. The claim that the scale does not separate trained from random networks rests on Heap
        et al. (2025), which is in neither audited paper.
  M5:
    name: Sensitivity
    status: U
    short: Unattempted; no planted ground-truth features
    verified: true
    reasoning: 'The premise that an ℓ1 penalty recovers the features that generated the data is imported
      by citation and never tested on a system whose features are known. Every control the paper runs
      is a known-negative: rectified random directions, the default basis, PCA, ICA, and a non-sparse
      dictionary, each of which should score low and does. A known-positive would require a model with
      planted features and a check that the dictionary returns them, and no such construction appears
      in §§1-6 or Appendices A-G. Without one, a low score is uninformative about whether the method missed
      a feature or the feature was not there.'
    notes:
      legacy_evidence: 'Unattempted at origin. No known-positive control: no synthetic model with planted
        ground-truth features is used to check that the method recovers them. The only controls are known-negatives
        (random directions, non-sparse dictionary, random SAE latents)'
      verification: 'The cell is right that the origin runs only known-negatives. One qualification worth
        recording: the follow-up does run a known-positive-style evaluation, sparse probing for benchmark
        concepts described as "known ground-truth features," which is not a synthetic model with planted
        features but is closer to a sensitivity test than anything at origin. It is also the evaluation
        whose result is reported as complex and dataset dependent, so it does not rescue the criterion.'
  M6:
    name: Invariance
    status: PC
    short: All layers of Pythia-70M, five expansion ratios, two scoring regimes
    verified: true
    reasoning: 'The result is not reported at one setting. It is reported across every residual stream
      layer of Pythia-70M, five dictionary-width ratios spanning undercomplete to eight times overcomplete,
      six layers of a second and larger model, and two scoring regimes of which the harder one is run
      precisely because the easier one could be flattering. That is a wide invariance envelope for a 2023
      result. It stops short of complete because the envelope is one architecture family, one tokeniser
      and one training corpus, and because the paper reports where invariance breaks rather than explaining
      it: the advantage is gone by layer 4.'
    notes:
      legacy_evidence: 'Reported across all layers of Pythia-70M, six layers of Pythia-410M, five expansion
        ratios, and two scoring regimes (top-and-random, random-only). Reported where invariance \emph{fails}:
        the advantage over ICA vanishes by layer 4. Leask et al.\ add a second model family. Not checked
        across tokenisers, training corpora, or architectures beyond decoder-only transformers'
      verification: 'Every count in the cell checks out: five expansion ratios (R ∈ {0.5, 1, 2, 4, 8},
        Table 2 caption), six Pythia-410M layers (3, 7, 11, 15, 19, 23, Figure 17), two scoring regimes
        (top-and-random, random-only). This creates a conflict with E2, which describes the causal evidence
        as covering "one layer." Figure 3 is one layer; Appendix F repeats the procedure on six. The two
        cells cannot both stand as written.'
  M7:
    name: Selection correction
    status: U
    short: A feature scoring fewer than 20 varying fragments is skipped; the count is unreported
    verified: true
    reasoning: 'The counts that exist are disclosed and the search that produced the showcase is disclosed
      in unusual detail, down to the probe sentence and the fact that the apostrophe feature was the third
      hit rather than the first. None of that is a correction. No adjustment for multiplicity is applied
      anywhere, and the scored 150 are a survivor population: step 5 of the protocol discards any feature
      with fewer than 20 varying fragments among 50,000 before scoring begins, and the number discarded
      is never reported. Sparser dictionaries lose more features to that filter, which cuts in the direction
      of the paper''s own comparison.'
    notes:
      legacy_evidence: Unattempted. 150 features per method are scored for the headline comparison; the
        showcased apostrophe feature is disclosed as the third hit of a hand-run search (``The top activating
        feature in our dictionary was an outlier dimension feature \ldots then the apostrophe-preceding-s
        feature''); the circuit-detection case study uses 20 contexts and one target feature. $N$ is partly
        stated; no multiplicity control is applied anywhere
      verification: 'The 150 figure is verbatim from the Figure 2 caption and applies to that figure only;
        Figures 8, 9, 10 and 18 report no N. The third-hit reading of Appendix D.3 is correct: an outlier-dimension
        feature, then the apostrophes-after-O feature, then the apostrophe-preceding-s feature that the
        paper showcases. Two of the sentences quoted above are entered as two quotes each because they
        run across page furniture in the PDF and do not resolve whole against the pinned extraction —
        the Appendix D.3 sentence across a footnote, a page break and two figure captions, the §5.3 sentence
        across footnote 5 and a page break. Each pair reassembles to the whole sentence with nothing omitted.
        The cell does not mention the step-5 skip rule, which is the sharper selection problem, since
        it is a filter applied before scoring whose magnitude is never reported.'
  I1:
    name: Necessity
    status: PC
    short: One feature ablated for behaviour; a full previous-layer sweep reads out to features
    verified: true
    reasoning: 'Removal is performed and the direction of the effect matches the feature''s reading: take
      away the apostrophe feature and the model stops predicting the possessive s. The report is qualitative.
      There is no effect size, no comparison against ablating a random direction of the same norm, and
      no necessity test over a set of features with a stated criterion. The ablation is also deliberately
      minimal by construction, lowering activation only to the threshold, which bounds how much necessity
      it could demonstrate.'
    notes:
      legacy_evidence: 'One removal experiment, on one feature, qualitatively reported: ``less-than-rank-one
        ablation'''' of the apostrophe feature lowers the logit for the following \texttt{''s}. The off-target
        scale is disclosed in the same caption --- ``there are 12k logits negatively effected, but we
        set a threshold of 0.1 for visual clarity.'''' No systematic necessity test over a feature set'
      verification: 'Contradiction with the cell''s summary. "One feature, one removal" holds for necessity
        with respect to behaviour, which is tested once, on the apostrophe feature, against logits. It
        does not hold for ablation as such: §5.3 ablates every dictionary feature in the previous layer,
        one at a time, and ranks them by effect on a target feature, then applies the procedure recursively.
        That is a systematic ablation sweep whose outcome variable is another feature''s activation rather
        than model behaviour.'
  I2:
    name: Sufficiency
    status: PC
    short: Interchange intervention on IOI; counterfactual features written in
