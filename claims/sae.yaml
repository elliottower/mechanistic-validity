claim: sae
title: SAE Features as Units of Analysis
description: 'Sparse autoencoders are trained on residual-stream activations to recover an overcomplete
  dictionary of directions, evaluated two ways: automated interpretability scoring of 150 features per
  method against six baselines (default basis, random directions, PCA, ICA, top-$K$ PCA, top-$K$ ICA),
  and activation patching on 50 IOI data points. Evaluated on: Pythia-70M and 410M at origin, GPT-2 small and
  Gemma 2 2B in the follow-up. Being a method-level claim, these are the systems the evidence was gathered
  on rather than one audited model. Description mode: representational.'
source:
  citation: cunningham2024sparse
  title: Sparse Autoencoders Find Highly Interpretable Features
  url: https://arxiv.org/abs/2309.08600
  local: reference/cunningham_2023_sparse_autoencoders.pdf
  sha256: 0475237e835c07738a74b2f372f0b7aa33ac047dce6affd49bb750dc4009e661
  extract_cmd: pdftotext -layout
  read_in_full: true
claims:
  C1:
    quotes:
    - exact: In particular, we compare interpretability scores on our dictionary features to those produced
        by a) the default basis, b) random directions, c) Principal Component Analysis (PCA), and d) Independent
        Component Analysis (ICA).
      prefix: ''
      suffix: ''
      section: §3.2, p.3
      page: null
      line: null
    - exact: We find that the strength of this effect declines as we move through the model, being comparable
        to ICA in layer 4 and showing minimal improvement in the final layer.
      prefix: ''
      suffix: ''
      section: §3.2, p.5
      page: null
      line: null
    - exact: To test whether this difference is responsible for the higher scores, we run a variant of
        PCA and ICA in which we have a fixed number of directions, K, which can be active for any single
        datapoint.
      prefix: ''
      suffix: ''
      section: Appendix G, p.18
      page: null
      line: null
    refs:
    - citation: leask2025canonical
      text: If we stitch a latent from a larger SAE into a smaller SAE and the reconstruction
      section: §4.2, p.6
      page: null
      direction: raises
      local: reference/leask_2025_canonical_units.pdf
      sha256: 27d45ba26a8ec59d99cd752559b387ead0bbbca635a5f0bcb6730a0c49a4195e
      extract_cmd: pdftotext -layout
    - citation: leask2025canonical
      text: performance improves, this indicates that the latent is adding new information to the smaller
        SAE.
      section: §4.2, p.6
      page: null
      direction: raises
      local: reference/leask_2025_canonical_units.pdf
      sha256: 27d45ba26a8ec59d99cd752559b387ead0bbbca635a5f0bcb6730a0c49a4195e
      extract_cmd: pdftotext -layout
  C2:
    quotes:
    - exact: Since a vector space can only have as many orthogonal vectors as it has dimensions, this
        means the network would learn an overcomplete basis of non-orthogonal features.
      prefix: ''
      suffix: ''
      section: §1, p.1
      page: null
      line: null
    - exact: This suggests that we may be able to recover the network’s features by finding a set of directions
        in activation space such that each activation vector can be reconstructed from a sparse linear
        combinations of these directions.
      prefix: ''
      suffix: ''
      section: §1, p.2
      page: null
      line: null
    - exact: There is evidence that they may be applicable to the MLPs (see Appendix C), but the training
        pipeline used to train the dictionaries in this paper is not able to robustly learn overcomplete
        bases in the intermediate layers of the MLP.
      prefix: ''
      suffix: ''
      section: §6.2, p.9
      page: null
      line: null
    - exact: For learning features in MLP layers, we find that we retain a larger number of features if
        we use a different matrix for the encoder and decoder, so that Equations 1 and 2 become
      prefix: ''
      suffix: ''
      section: Appendix C.3, p.15
      page: null
      line: null
    - exact: We’re excited by future work investigating what changes can be made to better understand
        the computations performed by the attention heads and MLP layers, each of which poses different
        challenges.
      prefix: ''
      suffix: ''
      section: §6.2, p.9
      page: null
      line: null
  C3:
    quotes:
    - exact: First, we show that our features are on average more interpretable than neurons and other
        matrix decomposition techniques, as measured by autointerpretability scores (Section 3) (Bills
        et al., 2023).
      prefix: ''
      suffix: ''
      section: §1, p.2
      page: null
      line: null
    - exact: Next, we show that we are able to pinpoint the features used for a set task more precisely
        than other methods (Section 4).
      prefix: ''
      suffix: ''
      section: §1, p.2
      page: null
      line: null
    - exact: We do this via activation patching, a form of causal mediation analysis (Vig et al., 2020),
        through which we edit the model’s internal activations along the directions indicated by our dictionary
        features and measure the changes to the model’s outputs.
      prefix: ''
      suffix: ''
      section: §4, p.5
      page: null
      line: null
    refs:
    - citation: leask2025canonical
      text: Recently, sparse autoencoders (SAEs) have emerged as a promising alternative by decomposing
        the activations of LLMs into a dictionary of interpretable and monosemantic features (Bricken
        et al., 2023; Cunningham et al., 2023).
      section: §1, p.2
      page: null
      direction: raises
      local: reference/leask_2025_canonical_units.pdf
      sha256: 27d45ba26a8ec59d99cd752559b387ead0bbbca635a5f0bcb6730a0c49a4195e
      extract_cmd: pdftotext -layout
    - citation: leask2025canonical
      text: Our findings challenge the idea that SAEs can discover a canonical set of features.
      section: §7, p.10
      page: null
      direction: lowers
      local: reference/leask_2025_canonical_units.pdf
      sha256: 27d45ba26a8ec59d99cd752559b387ead0bbbca635a5f0bcb6730a0c49a4195e
      extract_cmd: pdftotext -layout
  C4:
