      sha256: 27d45ba26a8ec59d99cd752559b387ead0bbbca635a5f0bcb6730a0c49a4195e
      extract_cmd: pdftotext -layout
    - citation: leask2025canonical
      text: Averaging this metric across all 657 latents in GPT-1536 that have low maximum cosine similarity
