  C5:
    quotes:
    - exact: Elhage et al. (2022b) investigate why polysemanticity might arise and hypothesise that it
        may result from models learning more distinct features than there are dimensions in the layer.
      prefix: ''
      suffix: ''
      section: §1, p.1
      page: null
