claim: gender
title: Gender Bias Circuits
description: 'Causal mediation analysis treats a gender edit to the input as a treatment and each neuron,
  layer, head or attention weight as a mediator, splitting the effect on a two-pronoun probability ratio
  into a natural direct and a natural indirect effect. Three properties of the effect distribution are
  reported --- sparsity, with ten of 144 heads reproducing the effect of intervening on all of them; synergy
  among neurons; and decomposition into direct and indirect parts --- against a randomly initialised GPT2-small
  carried through as a matched negative control. Evaluated on: five GPT-2 sizes on 17 templates over 169 professions
  plus WinoBias Type 1 and Winogender, with five further model families added in \S5.5. Description mode:
  implementational-topographic.'
source:
  citation: vig2020gender
  title: 'Causal Mediation Analysis for Interpreting Neural NLP: The Case of Gender Bias'
  url: https://arxiv.org/abs/2004.12265
  local: reference/vig_2020_gender_mediation.pdf
  sha256: 1e35f3c72663d08be952910fd20caa7a6c4dc353544424a81a1a05808cd7a35e
  extract_cmd: pdftotext -layout
