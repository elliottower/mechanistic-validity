    quotes:
    - exact: 'At least two importantly different ways of conceptualizing and measuring in-context learning
        exist in

        the literature.'
      prefix: ''
      suffix: ''
      section: Key Concepts, In-context Learning
      page: null
      line: null
    - exact: 'However, for the purposes of this work, we focus instead on the Kaplan et al. conception:

