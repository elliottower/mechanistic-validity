claim: induction_broad
title: 'Induction Heads: General In-Context Learning'
description: 'The two-head composition that performs in-context copying is advanced as the mechanistic
  source of in-context learning in general, on the argument that copying a token which followed the same
  context earlier is the literal case of in-context nearest-neighbour retrieval. In-context learning is
  operationalized as the difference in loss between the 500th and the 50th token of the context, and the
  claim rests on induction-head formation, the jump in that quantity, a loss bump and a PCA pivot all
  arriving together in a 2.5e9--5e9 token window. Evaluated on: the same 34 decoder-only models, with the co-occurrence
  observed across all of them and ablation confined to the twelve small models at $d_{\mathrm{model}}
  = 768$, so no causal evidence touches the models the claim is about. Description mode: implementational-functional,
  carried to a claim about a computational-level capability by Argument 6''s continuity argument.'
source:
  citation: olsson2022context
  title: ''
  url: https://arxiv.org/abs/2209.11895
  local: reference/olsson_2022_induction_heads.pdf
  sha256: 9fa4a667e559431efac5bf1d9463f3b0005633e0b78f3ebbacfb901e4ed36e50
  extract_cmd: pdftotext -layout
  read_in_full: false
claims:
  C1:
    quotes:
    - exact: 'we present preliminary and indirect evidence for a tantalizing hypothesis: that induction
        heads

        might constitute the mechanism for the actual majority of all in-context learning in large transformer

        models.'
      prefix: ''
      suffix: ''
      section: Introduction
      page: null
      line: null
    - exact: 'Specifically, the paper presents six complementary lines of evidence arguing that induction
        heads

        may be the mechanistic source of general in-context learning in transformer models of any size:'
      prefix: ''
      suffix: ''
      section: Introduction
      page: null
      line: null
    - exact: 'The most compelling alternative possibility we see is that other composition mechanisms
        may also

        form during the phase change. Larger models have more heads, which gives them more capacity

        for other interesting Q-composition and K-composition mechanisms that small models can’t afford

        to express.'
      prefix: ''
      suffix: ''
      section: Argument 6
      page: null
      line: null
    - exact: 'If all “composition heads” form simultaneously during the phase change, then it’s

        possible that above some size, non-induction composition heads could together account for more

        of the phase change and in-context learning improvement than induction heads do.'
      prefix: ''
      suffix: ''
      section: Argument 6
      page: null
      line: null
    - exact: Put another way, perhaps the co-occurrence is primarily caused by a shared latent variable,
        rather than direct causality from induction heads to the full observed change in in-context learning.
      prefix: ''
      suffix: ''
      section: Argument 1, Assessing the Evidence
      page: null
      line: null
  C2:
    quotes:
    - exact: 'A bigger

        issue is that right now we''re unable to reverse engineer induction heads in models with MLP layers.'
      prefix: ''
      suffix: ''
      section: Argument 5
      page: null
      line: null
    - exact: 'Presently, fully reverse

        engineering them is beyond us, since they exist in large models with MLPs, which we don''t have
        a

        strong framework for mechanistically understanding.'
      prefix: ''
      suffix: ''
      section: Argument 5, What About More Complex Induction Heads?
      page: null
      line: null
    - exact: 'However, we hypothesize they''re different in

        two ways: (1) using more complex QK terms rather than matching on just the previous token; and
        (2)

        matching and copying more abstract and sophisticated linguistic features, rather than precise

        tokens.'
      prefix: ''
      suffix: ''
      section: Argument 5, What About More Complex Induction Heads?
      page: null
      line: null
    - exact: 'From this perspective, it seems natural that applying the same

        mechanism to more abstract features can produce more complex behavior.'
      prefix: ''
      suffix: ''
      section: Argument 5, What About More Complex Induction Heads?
      page: null
      line: null
    - exact: One of things we’ll be trying to establish is that when induction heads occur in sufficiently
        large models and operate on sufficiently abstract representations, the very same heads that do
        this sequence copying also take on a more expanded role of analogical sequence copying or in-context
        nearest neighbors.
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: We are not yet able to prove mechanistically that induction heads do this in general
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: 'In the small models we

        studied in our previous paper, all induction heads have the described QK term driving their attention

        pattern and a positive eigenvalue circuit performing copying.'
      prefix: ''
      suffix: ''
      section: Argument 5, Summary of Reverse Engineering Induction Heads
      page: null
      line: null
  C3:
    quotes:
    - exact: 'Specifically, the paper presents six complementary lines of evidence arguing that induction
        heads

        may be the mechanistic source of general in-context learning in transformer models of any size:'
      prefix: ''
      suffix: ''
