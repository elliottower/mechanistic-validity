claim: othello
title: Othello World Model
description: 'A GPT variant trained from random initialization on Othello transcripts carries the board
  state in its activations. Nonlinear probes decode all 64 tiles where linear probes never dip below 20\%
  error, and 2,000 interventions move the top-$N$ predictions onto the counterfactual legal-move set (errors
  0.12 and 0.06 against null baselines of 2.68 and 2.59), half of them on boards unreachable by legal
  play. Evaluated on: one 8-layer architecture trained twice, on championship games and on uniformly sampled
  legal moves, with both runs probed across all eight layers. Description mode: representational.'
source:
  citation: li2023othello
  title: 'Emergent World Representations: Exploring a Sequence Model Trained on a Synthetic Task'
  url: https://arxiv.org/abs/2210.13382
  local: reference/li_2023_othello.pdf
  sha256: 3a64ec2e9610837e577578397e7fd8b6bb49adbe60bed026a496a94356866391
  extract_cmd: pdftotext -layout
  read_in_full: true
