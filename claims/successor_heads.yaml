  M3:
    quotes:
    - exact: '1. Mean ablation: replacing the output of a head with the average head output over a chosen
        distribution. We choose this distribution to be the current batch we are using.'
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: '2. Resampling ablation: replacing the output of a head with the head’s activation on a randomly
        sampled example from a dataset (e.g. the Pile). When using this method, we repeat this process
        a number of times and average the results.'
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: '1. Direct effect resampling ablation: 33% for successorship, 11% for acronym, 10% for greater-than,
        and 11% for copying behavior.'
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: '4. Total effect mean ablation: 27% for successorship, 8.2% for acronym, 10% for greater-than,
        and 8.4% for copying behavior.'
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: '5. Total effect resampling ablation: 30% for successorship, 6.5% for acronym, 11% for greater-than,
        and 6.2% for copying behavior.'
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: Result 1 demonstrates that using resampling ablation instead of mean ablation for analyzing
        the loss reducing effect has little effect on the results in Figure 11. Additionally, the indirect
        effect results (2 and 3) provide some evidence that downstream effects of the successor head are
        not highly significant to successorship.
      prefix: ''
      suffix: ''
      section: Appendix K
      page: null
      line: null
    - exact: By checking this criterion for a range λ ∈ {0.0, ..., 0.75, 1.0, 1.25, ..., 3.0}, we find
        that λ = 1 achieves this criterion for all tasks other than months, where months instead have
        λ = 2.
      prefix: ''
      suffix: ''
      section: Appendix D
      page: null
      line: null
    - exact: While our experiments in Section 3 focus on the study of mod-10 features, one might hypothesize
        that there exist similar natural mod-k features for other k. To explore this hypothesis, we repeat
        the linear probing experiment detailed in Section 3.3 for a range of moduli m ∈ {2, ..., 25}.
      prefix: ''
      suffix: ''
      section: Appendix P
      page: null
      line: null
    - exact: Observe that, while for almost all moduli, validation and test performance are above random
        chance, we cannot easily extract ‘mod-m data’ from token representations for all m.
      prefix: ''
      suffix: ''
      section: Appendix P
      page: null
      line: null
    - exact: To find these hyperparameters, we used the metric of mean max cosine similarity between two
        trained SAEs, as described in Sharkey et al. (2022) and Cunningham et al. (2023).
      prefix: ''
      suffix: ''
      section: Appendix A.2
      page: null
      line: null
