claim: greater_than
title: Greater-Than Circuit in Year-Span Prediction
description: 'Iterative path patching over GPT-2 small recovers a circuit for prompts that supply a two-digit
  start year and ask for an end year: attention heads carry the start year to the final position, and
  MLPs 8--11 raise the probability of every year above it. Feeding the circuit real input while the rest
  of the model receives 01-input recovers 72.7\% of an 81.7\% probability-difference baseline, measured
  over 10,000 examples spanning 120 nouns and 768 years, and the inverse assignment drives the same quantity
  to -36.6\%. The circuit also fires on prompts requiring less-than, where the model answers greater,
  which the authors report as a property of the mechanism rather than a defect in the account. Description
  mode: implementational, with the algorithmic question in the title left open.'
source:
  citation: hanna2023greater
  title: 'How Does GPT-2 Compute Greater-Than?: Interpreting Mathematical Abilities in a Pre-Trained Language Model'
  url: https://arxiv.org/abs/2305.00586
  local: reference/hanna_2023_greater_than.pdf
  sha256: c23636a032c05443bd82984c6e8949d1b24f8b84ae4afa3a9ca634abbc7d15d1
  extract_cmd: pdftotext -layout
  read_in_full: true
claims:
  C1:
    quotes:
    - exact: Probability difference verifies that model output reflects a greater-than operation by measuring
        the extent to which GPT-2 assigns higher probability to years >YY. It ranges from -1 to 1; higher
        is better.
      prefix: ''
      suffix: ''
      section: §2, Quantitative Evaluation
      page: null
      line: null
    - exact: In doing so, it checks that the model depends on YY, and does not produce constant (but valid)
        output, e.g. by always outputting p(99) = 1.
      prefix: ''
      suffix: ''
      section: §2, Quantitative Evaluation
      page: null
      line: null
    - exact: If a component normally boosts logits of years>YY, patching it with the 01-dataset will cause
        it to boost the logits of years > 01, inducing a larger error in the model.
      prefix: ''
      suffix: ''
      section: §3.1
      page: null
      line: null
    - exact: 'We perform this evaluation with our same 10,000-element dataset; on this dataset, GPT-2
        achieves 81.7% probability difference (SD: 19.3%) and a cutoff sharpness of 6.0% (SD: 7.2%).'
      prefix: ''
      suffix: ''
      section: §2, Quantitative Evaluation
      page: null
      line: null
    - exact: 'The circuit is also necessary: performing the opposite of the prior experiment, giving nodes
        in our circuit the 01-dataset, and those outside it the normal dataset, leaves GPT-2 unable to
        perform the task: it achieves a probability difference of -36.6%.'
      prefix: ''
      suffix: ''
      section: §3.2, Evaluation
      page: null
      line: null
  C2:
    quotes:
    - exact: At the relevant (end) position, in-circuit attention heads attend to the YY position, suggesting
        that they detect the year which the output year must be greater than.
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
    - exact: Note that YY was not just upweighted highly compared other 2-digit years; YY was the most
        highly upweighted token across all tokens.
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
    - exact: 'The results indicate that MLPs of 9 and 10 directly specify which years are greater than
        YY: the logit lens of each layer’s output has an upper triangular pattern, indicating that they
        upweight precisely those years greater than YY.'
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
    - exact: Including more top neurons produces sharper approximations of greater-than; see Appendix
        D for examples.
      prefix: ''
      suffix: ''
      section: §4.2
      page: null
      line: null
    - exact: Our prior experiments show that MLPs 9-11 directly compute greater-than. But how do they
        do so? We cannot provide a conclusive answer, but identify avenues by which MLPs might compute
        this.
      prefix: ''
      suffix: ''
      section: §4
      page: null
      line: null
    - exact: When we ablate the dimensions found through PCA, to test their importance to the greater-than
        task, we found little change in model performance.
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
    - exact: Similarly, removing linearly-extractable YY information from attention head output using
        LEACE [5] yielded only slightly lower probability difference (64.7%) than the baseline (81.7%).
        This indicates that structured YY information may not fully explain GPT-2’s greater-than abilities.
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
  C3:
