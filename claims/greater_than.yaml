      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
    - exact: We find, as in Wallace et al. [49], that structure already exists in the static year embeddings,
        though the years 02-09 are clustered apart from the rest.
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
