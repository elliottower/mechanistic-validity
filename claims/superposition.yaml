      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: 'Features Vary in Importance: Not all features are equally useful to a given task.'
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: For interpretability researchers, our main contribution is providing a direct demonstration
        that superposition occurs in artificial neural networks given a relatively natural setup, suggesting
        this may also occur in practice.
      prefix: ''
      suffix: ''
      section: Introduction
      page: null
      line: null
    - exact: However, once the features become sufficiently sparse, this model, too, uses superposition
        to represent more features than it has neurons. This result is notable because it demonstrates
        the ability of neural networks to perform computation even on data that is represented in superposition.
      prefix: ''
      suffix: ''
      section: Computation in Superposition — Superposition vs Sparsity
      page: null
      line: null
  I3:
    quotes:
    - exact: The issue is that the model doesn't benefit from the ReLU hidden layer – it has no role except
        limiting how the model can encode information. If given any chance, the model will circumvent
        it.
      prefix: ''
      suffix: ''
      section: Superposition in a Privileged Basis — Limitations of the ReLU Hidden Layer Toy Model
      page: null
      line: null
    - exact: We chose a very small model (only 5 neurons) both for ease of visualization, and to circumvent
        some issues with this toy model we'll discuss below.
      prefix: ''
      suffix: ''
      section: Superposition in a Privileged Basis
      page: null
      line: null
    - exact: We made some progress towards this for the n = 2; m = 1 ReLU output model (and Tom McGrath
        makes further progress in his comment), but it would be nice to solve this more generally.
      prefix: ''
      suffix: ''
      section: Open Questions
      page: null
      line: null
  I4:
    quotes:
    - exact: One question you might ask is whether we can quantify the ability of superposition to enable
        extra computation by examining the loss. Unfortunately, we can't easily do this. Superposition
        occurs when we change the task, making it sparser. As a result, the losses of models with different
        amounts of superposition are not comparable – they're measuring the loss on different tasks!
      prefix: ''
      suffix: ''
      section: Footnote 17
      page: null
      line: null
    - exact: 'Our loss is weighted mean squared error weighted by the feature importances, Ii , described
        above:'
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: We found that this did reduce superposition, but attacks had to be made unreasonably large
        (80% input L2 norm) to fully eliminate it, which didn't seem satisfying.
      prefix: ''
      suffix: ''
      section: Relationship to Adversarial Robustness
      page: null
      line: null
  I5:
    quotes:
    - exact: If one wants to understand why linear models don't exhibit superposition, the easy answer
        is to observe that linear models essentially perform PCA.
      prefix: ''
      suffix: ''
      section: Mathematical Understanding
      page: null
      line: null
    - exact: These results seem to hint that PCA and superposition are in some sense complementary strategies
        which trade off with one another. As features become more correlated, PCA becomes a better strategy.
        As features become sparser, superposition becomes a better strategy.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Collapsing of Correlated Features
      page: null
      line: null
    - exact: In very dense regimes, the solution becomes equivalent to PCA.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Collapsing of Correlated Features
      page: null
      line: null
  I7:
    quotes:
    - exact: Although we can see hints of this in our previous experiment, it's hard to really isolate
        what's going on because many features are changing at once and there may be interaction effects.
        As a result, we set up the following experiment to better isolate the effects.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: 'A note for reimplementations: optimizing with a two-dimensional hidden space makes this
        easier to study, but the actual optimization process to be really challenging from gradient descent
        – a lot harder than even just having three dimensions.'
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Perturbing a Single Feature
      page: null
      line: null
    - exact: Mathematically, we represent this by linking the choice of whether all the features in a
        correlated feature set are zero or not together.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Setup for Exploring Correlated and Anticorrelated Features
      page: null
      line: null
  I9:
    quotes:
    - exact: Correlated features prefer to be orthogonal, often forming in different tegum factors. As
        a result, correlated features may form an orthogonal local basis. When they can't be orthogonal,
        they prefer to be side-by-side.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Non-Uniform Superposition
      page: null
      line: null
    - exact: Anti-correlated features prefer to be in the same tegum factor when superposition is necessary.
        They prefer to have negative interference, ideally being antipodal.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Non-Uniform Superposition
      page: null
      line: null
    - exact: The model ideally represents correlated features orthogonally, in separate tegum factors
        with no interactions between them. When that fails, it prefers to arrange them so that they're
        as close together as possible – it prefers positive interference between correlated features over
        negative interference. Finally, when there isn't enough space to represent all the correlated
        features, it will collapse them and represent their principal component instead!
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Correlated and Anticorrelated Features
      page: null
      line: null
    - exact: One neuron does asymmetric superposition. In normal superposition, one might store features
        with equal weights (eg. W = [1, −1]) and then have equal output weights
      prefix: ''
      suffix: ''
      section: Computation in Superposition — The Asymmetric Superposition Motif
      page: null
      line: null
  I11:
    quotes:
    - exact: Perhaps the most striking phenomenon we've noticed is that the learning dynamics of toy models
        with large numbers of features appear to be dominated by "energy level jumps" where features jump
        between different feature dimensionalities.
      prefix: ''
      suffix: ''
      section: 'Superposition and Learning Dynamics — Phenomenon 1: Discrete Energy Level Jumps'
      page: null
      line: null
    - exact: Note how the dimensionality of some features "jump" between different values and swap places.
        As this happens, the loss curve also undergoes a sudden drop (a very small one at the first jump,
