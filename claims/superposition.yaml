      prefix: ''
      suffix: ''
      section: 'Superposition and Learning Dynamics — Phenomenon 1: Discrete Energy Level Jumps'
      page: null
      line: null
  I12:
    quotes:
    - exact: Unfortunately, we aren't able to give these questions the detailed investigation they deserve
