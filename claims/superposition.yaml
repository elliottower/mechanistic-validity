      page: null
      line: null
  I1:
    quotes:
    - exact: The final step is whether to add an activation function. This turns out to be critical to
        whether superposition occurs.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: 'In the previous section, we observed a surprising empirical result: adding a ReLU to the
        output of our model allowed a radically different solution – superposition – which doesn''t occur
        in linear models.'
      prefix: ''
      suffix: ''
      section: Mathematical Understanding
      page: null
      line: null
    - exact: As expected, sparsity is necessary for superposition to occur, but we can see that it interacts
        in an interesting way with relative feature importance.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: But we'll see later that the ability to set a negative bias is important for superposition
        for a second set of reasons – roughly, it allows models to discard small amounts of noise.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: It's actually quite easy to get rid of superposition in the toy models described in this
        paper, albeit at the cost of a higher loss.
      prefix: ''
      suffix: ''
      section: 'The Strategic Picture of Superposition — Approach 1: Creating Models Without Superposition'
      page: null
      line: null
  I2:
    quotes:
    - exact: 'Feature Sparsity: In the natural world, many features seem to be sparse in the sense that
        they only rarely occur.'
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: 'More Features Than Neurons: There are an enormous number of potentially useful features
