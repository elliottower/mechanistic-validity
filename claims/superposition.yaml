claim: superposition
title: Superposition of Features in Toy Models
description: 'A ReLU network trained to reconstruct sparse features stores more of them than it has dimensions,
  giving each a non-orthogonal direction and absorbing the interference that creates, which the linear
  model differing only in that activation function never does at any sparsity. Where the tradeoff falls
  is mapped over an importance $\times$ sparsity grid against closed-form losses for each candidate weight
  configuration, and the geometries the trained models settle into are uniform polytopes solving a generalised
  Thomson problem. Systems: toy autoencoders on synthetic features whose sparsity, importance and correlation
  are set by hand, across four architectures and sizes from $(2,1)$ to 400 features in 30 dimensions,
  plus an absolute-value model that computes through a compressed layer rather than storing. Description
  mode: representational.'
source:
  citation: elhage2022superposition
  title: Toy Models of Superposition
  url: https://transformer-circuits.pub/2022/toy_model/index.html
  local: reference/elhage_2022_superposition.pdf
  sha256: 0acd3e05e40c1b703be3aed15c8cdbd5713a1840df9738b495d2bde2e8eb1e3a
  extract_cmd: pdftotext -layout
  read_in_full: true
claims:
  C1:
    quotes:
    - exact: If one takes the superposition hypothesis seriously, a natural first question is whether
        neural networks can actually noisily represent more features than they have neurons. If they can't,
        the superposition hypothesis may be comfortably dismissed.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition
      page: null
      line: null
    - exact: We will actually consider two models, which we motivate below. The first "linear model" is
        a well understood baseline which does not exhibit superposition. The second "ReLU output model"
        is a very simple model which does exhibit superposition. The two models vary only in the final
        activation function.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: As our standard intuitions would expect, the linear model always learns the top-m most important
        features, analogous to learning the top principal components. The ReLU output model behaves the
        same on dense features (1 − S = 1.0), but as sparsity increases, we see superposition emerge.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Basic Results
      page: null
      line: null
    - exact: We then plot whether the 2nd "extra" feature is not learned, learned in superposition, or
        learned and represented orthogonally.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
  C2:
    quotes:
    - exact: It turns out we can analytically determine the loss for these solutions (details can be found
        in this notebook).
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: 'But most interestingly, there appears to be a real phase change, observed in both the empirical
        and theoretical diagrams! The optimal weight configuration discontinuously changes in magnitude
        and superposition. (In the theoretical model, we can analytically confirm that there''s a first-order
        phase change: there''s crossover between the functions, causing a discontinuity in the derivative
        of the optimal loss.)'
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: The reason pentagonal solutions are not on the unit circle is because models reduce the effect
        of positive interference, setting a slight negative bias to cut off noise and setting their weights
        to
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Perturbing a Single Feature
      page: null
      line: null
    - exact: 'These other neurons implement two instances of asymmetric superposition and inhibition.
        Each instance consists of two neurons:'
      prefix: ''
      suffix: ''
      section: Computation in Superposition — The Asymmetric Superposition Motif
      page: null
      line: null
    - exact: To avoid the consequences of that interference, the model has another neuron heavily inhibit
        the feature in the case where there would have been positive interference. This essentially converts
        positive interference (which could greatly increase the loss) into negative interference (which
        has limited consequences due to the output ReLU).
      prefix: ''
      suffix: ''
      section: Computation in Superposition — The Asymmetric Superposition Motif
      page: null
      line: null
  C3:
    quotes:
    - exact: we replicated many of the experiments in this paper. Specifically, we replicated all plots
        in the Demonstrating Superposition and Superposition as a Phase Change sections (visualizations
        of the relu models with different sparsities and the phase diagrams) as well as the plot in The
        Geometry of Superposition – Uniform Superposition.
      prefix: ''
      suffix: ''
      section: Comments & Replications — Kshitij Sachan
      page: null
      line: null
    - exact: We’ve reproduced the experiments in the Demonstrating Superposition and Superposition as
        a Phase Change sections and have a minor additional result to contribute.
      prefix: ''
      suffix: ''
      section: Comments & Replications — Tom McGrath
      page: null
      line: null
    - exact: The results have been surprisingly easy to replicate -- we have reproduced (with very little
        fuss) plots similar to those in the Demonstrating Superposition – Basic Results, Geometry – Feature
        Dimensionality, and Learning Dynamics – Discrete "Energy Level" Jumps sections.
      prefix: ''
      suffix: ''
      section: Comments & Replications — Jeffrey Wu and Dan Mossing
      page: null
      line: null
    - exact: Jeff Wu, Daniel Mossing, Tom McGrath, and Kshitij Sachan did independent replications of
        many of our experiments, greatly increasing our confidence in our results.
      prefix: ''
      suffix: ''
      section: Acknowledgments
      page: null
      line: null
  C4:
    quotes:
    - exact: 'The results in the previous section seem to suggest that there are three outcomes for a
        feature when we train a model: (1) the feature may simply not be learned; (2) the feature may
        be learned, and represented in superposition; or (3) the model may represent a feature with a
        dedicated dimension.'
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: As we vary the sparsity of the features, we find that in the very sparse regime, we observe
        superposition as expected, with features arranged in a hexagon and correlated features side-by-
        side. As we decrease sparsity, the features progressively "collapse" into their principal components.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Collapsing of Correlated Features
      page: null
      line: null
    - exact: We'd also like to understand whether a given feature shares its dimension with other features.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Basic Results
      page: null
      line: null
  C5:
    quotes:
    - exact: 'One might think of this as two separate properties, which we''ll explore in more detail
        shortly: Decomposability: Network representations can be described in terms of independently understandable
        features. Linearity: Features are represented by direction.'
      prefix: ''
      suffix: ''
      section: 'Definitions and Motivation: Features, Directions, and Superposition'
      page: null
      line: null
    - exact: 'We hypothesize that there are really two countervailing forces driving this: Privileged
        Basis: Only some representations have a privileged basis which encourages features to align with
        basis directions (i.e. to correspond to neurons). Superposition: Linear representations can represent
        more features than dimensions, using a strategy we call superposition. This can be seen as neural
        networks simulating larger networks. This pushes features away from corresponding to neurons.'
      prefix: ''
      suffix: ''
      section: 'Definitions and Motivation: Features, Directions, and Superposition'
      page: null
      line: null
    - exact: As a result, compressed sensing lower bounds—which give lower bounds on the dimension of
        the embedding such that recovery is still possible—can be interpreted as giving an upper bound
        on the amount of superposition in our toy model. In particular, in various compressed sensing
        settings, one can recover an n-dimensional k-sparse vector from an m dimensional projection if
        and only if m = Ω(k log(n/k)) [47, 48, 49] . While the connection is not entirely straightforward,
        we apply one such result to the toy model in the appendix.
      prefix: ''
      suffix: ''
      section: Related Work — Compressed Sensing
      page: null
      line: null
    - exact: In our framework, these senses correspond to decomposability (representing stimuli as compositions
        of independent features) and superposition (representing more features than neurons, at cost of
        interference if features co-occur).
      prefix: ''
      suffix: ''
      section: Related Work — Theories of Neural Coding and Representation
      page: null
      line: null
    - exact: We'll also discover a connection to the famous Thomson Problem in chemistry.
      prefix: ''
      suffix: ''
      section: Mathematical Understanding
      page: null
      line: null
  M1:
    quotes:
    - exact: To reduce noise, we train ten models for each point and average over the results, discarding
        the model with the highest loss.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: Getting clean results required fitting each model multiple times and taking the solution
        with the lowest loss.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Perturbing a Single Feature
      page: null
      line: null
  M2:
    quotes:
    - exact: if optimized well enough, the linear model solution does not depend on sparsity level.)
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Basic Results
      page: null
      line: null
    - exact: In fact, this makes it never worthwhile for the linear model to represent more features than
        it has dimensions.
      prefix: ''
      suffix: ''
      section: Mathematical Understanding
      page: null
      line: null
    - exact: We can compare this to a theoretical "toy model of the toy model" where we can get closed
        form solutions for the loss of different weight configurations as a function of importance and
        sparsity.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: 'There are three natural ways to store 2 features in 1 dimension: W = [1, 0] (ignore [0,
        1], throwing away the extra feature), W = [0, 1] (ignore [1, 0], throwing away the first feature
        to give the extra feature a dedicated dimension), and W = [1, −1] (store the features in superposition,
        losing the ability to represent [1, 1], the combination of both features at the same time).'
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
  M3:
    quotes:
    - exact: On one axis, we vary the importance of the 2nd "extra" feature from 0.1 to 10. On the other
        axis, we vary the sparsity of all features from 1.0 to 0.01.
      prefix: ''
      suffix: ''
      section: Superposition as a Phase Change
      page: null
      line: null
    - exact: The model will only use the ReLU activation function if absolutely forced, which is a significant
        mark against studying this toy model.
      prefix: ''
      suffix: ''
      section: Superposition in a Privileged Basis — Limitations of the ReLU Hidden Layer Toy Model
      page: null
      line: null
    - exact: L1 regularization of activations, adversarial training, and changing the activation function
        all seem promising.
      prefix: ''
      suffix: ''
      section: Open Questions
      page: null
      line: null
  M4:
    quotes:
    - exact: ≥ 1 mean that there is some group of other features which can activate Wi as strongly as
        feature i
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Basic Results
      page: null
      line: null
    - exact: Empirically, it seems that the dimensionality of all features add up to the number of embedding
        dimensions when the features are "packed efficiently" in some sense.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Feature Dimensionality
      page: null
      line: null
    - exact: Are we measuring the maximally principled things? For example, what is the most principled
        definition of superposition / polysemanticity?
      prefix: ''
      suffix: ''
      section: Open Questions
      page: null
      line: null
  M5:
    quotes:
    - exact: At present, it's challenging to study superposition in models because we have no ground truth
        for what the features are. (This is also the reason why the toy models described in this paper
        can be studied – we do know what the features are!)
      prefix: ''
      suffix: ''
      section: The Strategic Picture of Superposition — Additional Considerations
      page: null
      line: null
    - exact: Since we don't have any ground truth for features, we need to create synthetic data for x
        which simulates any important properties we believe features have from the perspective of modeling
        them.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
    - exact: We consider each dimension xi to be a "feature". Each one has an associated sparsity Si and
        importance Ii .
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Experiment Setup
      page: null
      line: null
  M6:
    quotes:
    - exact: The results are qualitatively similar for models with more features and hidden dimensions.
      prefix: ''
      suffix: ''
      section: Demonstrating Superposition — Basic Results
      page: null
      line: null
    - exact: the number of input features n doesn't matter as long as it's much larger than the number
        of hidden dimensions, n ≫ m. And it also turns out that the number of hidden dimensions doesn't
        really matter as long as we're interested in the ratio of features learned to hidden features.
        Doubling the number of hidden dimensions just doubles the number of features the model learns.
      prefix: ''
      suffix: ''
      section: The Geometry of Superposition — Uniform Superposition
      page: null
      line: null
    - exact: We found the phase diagrams look quite different depending on the activation function, suggesting
