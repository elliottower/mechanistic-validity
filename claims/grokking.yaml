claim: grokking
title: Fourier Multiplication in Modular Addition
description: 'A one-layer transformer trained on $a+b \bmod 113$ maps each input to $\cos$ and $\sin$
  at five key frequencies, multiplies those components so the products encode $a+b$, and reads the sum
  off at the same five frequencies. The frequencies are identified from the embedding''s Fourier spectrum;
  the account is validated by ablating in Fourier space and by two progress measures, restricted and excluded
  loss, tracked across training. Restricted and excluded loss move before test accuracy does, which is
  what makes the account predictive rather than descriptive. Description mode: algorithmic.'
