claim: induction
title: 'Induction Heads: In-Context Token Copying'
description: 'A two-head composition: a previous-token head writes the identity of the token before a
  repeat into the residual stream, and an induction head reads it to predict what followed last time.
  Heads are identified by two behavioral scores on sequences of repeated uniform-random tokens, prefix
  matching and copying, and the mechanism is derived at the weight level for the two-layer attention-only
  case. Evaluated on: 34 decoder-only models from one to forty layers, with causal ablation confined to the
  twelve small models, six attention-only and six with MLPs. Description mode: implementational-functional.'
source:
  citation: olsson2022context
  title: In-context Learning and Induction Heads
  url: https://arxiv.org/abs/2209.11895
  local: reference/olsson_2022_induction_heads.pdf
  sha256: 9fa4a667e559431efac5bf1d9463f3b0005633e0b78f3ebbacfb901e4ed36e50
  extract_cmd: pdftotext -layout
  read_in_full: false
claims:
  C1:
    quotes:
    - exact: Formally, we define an induction head as one which exhibits the following two properties
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: 'Prefix matching: The head attends back to previous tokens that were followed by the current
        and/or recent tokens.'
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: 'Copying: The head’s output increases the logit corresponding to the attended-to token.'
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: In other words, induction heads are any heads that empirically increase the likelihood of
        [B] given [A][B]...[A] when shown a repeated sequence of completely random tokens.
      prefix: ''
      suffix: ''
      section: Key Concepts, Induction Heads
      page: null
      line: null
    - exact: In practice, induction heads don't exhibit these properties perfectly, and our measurements
        give us a continuum, but there is a clear subset of heads which exhibit these properties with
        much greater than random chance.
      prefix: ''
      suffix: ''
      section: Footnote 5
      page: null
      line: null
    - exact: Note that induction heads don’t occur in 1 layer models, because they require a composition
        of attention heads in different layers.
      prefix: ''
      suffix: ''
      section: Footnote 2
      page: null
      line: null
    - exact: The hypothesis that induction heads are the primary mechanism of in-context learning predicts
        that the phase change will happen in one-layer models with this change, and perhaps might happen
        earlier in models with more layers.
      prefix: ''
      suffix: ''
      section: Argument 2
      page: null
      line: null
    - exact: 'The results (figure below) are in line with the predictions: when we use the smeared-key
        architecture, in-context learning does indeed form for one-layer models (when it didn’t before),
        and it forms earlier for two-layer and larger models.'
      prefix: ''
      suffix: ''
      section: Argument 2
      page: null
      line: null
    - exact: In fact, almost all the in-context learning in small attention-only models appears to come
        from these induction heads! This begins at the start of the phase change, and remains true through
        the end of training.
      prefix: ''
      suffix: ''
      section: Argument 3
      page: null
      line: null
