  C5:
    quotes:
    - exact: Why do induction heads require composition? In an induction head, where the head attends
        must be a function of the token before the token it attends to. But an individual attention head
        computes attention scores only from the source and destination token.
      prefix: ''
      suffix: ''
      section: Footnote 15
      page: null
      line: null
