  E1:
    quotes:
    - exact: 'A first naïve knockout approach consists of simply deleting each node in K from M. The net
        effect of this removal is to zero ablate K, meaning that we set its output to 0. This naïve approach
        has an important limitation: 0 is an arbitrary value, and subsequent nodes might rely on the average
        activation value as an implicit bias term. Perhaps because of this, we find zero ablation to lead
        to noisy results in practice.'
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
    - exact: Mean-ablations remove the information that varies in the reference distribution (e.g. the
        value of the name outputted by a head) but will preserve constant information (e.g. the fact that
        a head is outputting a name).
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
    - exact: In this work, all knockouts are performed in a modified pIOI distribution called pABC.
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
    - exact: Path patching replaces part of a model's forward pass with activations from a different input.
      prefix: ''
      suffix: ''
      section: §3.1
      page: null
      line: null
    - exact: In our case, h will be a fixed attention head and P consists of all direct paths from h to
        a set of components R, i.e. paths through residual connections and MLPs (but not through other
        attention heads); this measures the counterfactual effect of h on the members of R.
      prefix: ''
      suffix: ''
      section: §3.1
      page: null
      line: null
    - exact: Instead of patching isolated paths, we patch the output of a set of heads and recompute the
        forward pass of the model after this modification.
      prefix: ''
      suffix: ''
      section: Appendix A
      page: null
      line: null
    - exact: In all of our experiments, we do not intervene on MLPs, layer norms, or embedding matrices,
        focusing our investigation on understanding the attention heads.
      prefix: ''
      suffix: ''
      section: §3
      page: null
      line: null
  E2:
    quotes:
    - exact: We create dataset samples for IOI using 15 templates (see Appendix E) with random single-token
        names, places and items. We use the notation pIOI for the distribution over sentences generated
        by this procedure.
      prefix: ''
      suffix: ''
      section: §2, Task description
      page: null
      line: null
    - exact: We find that this significantly reduces the logit difference and causes the model to predict
        S over IO 23% of the time (Figure 8).
      prefix: ''
      suffix: ''
      section: §4.4
      page: null
      line: null
    - exact: Moreover, we do not have a full understanding of the mechanisms at play in these adversarial
        examples. For instance, the S-Inhibition Heads attend not only to S2, but also to the second occurrence
        of IO. As this pattern is not present in pIOI nor in pABC , it is beyond the analysis presented
        in Section 3.
      prefix: ''
      suffix: ''
      section: §4.4, Limitations of the attack
      page: null
      line: null
  E3:
    quotes:
    - exact: We also noticed that the majority of the Negative, Backup and regular Name Mover Heads appear
        to write in the next token direction on repeated sequences of random tokens, and Negative Name
        Movers Heads contribute negatively. This suggests that these heads are involved beyond the IOI
        task to produce next-token prediction relying on contextual information.
      prefix: ''
      suffix: ''
      section: Appendix H
      page: null
      line: null
    - exact: 3.0 and 0.1 are among the three heads with the highest duplicate token score (Figure 18).
        This is evidence of their role of Duplicate Token Heads outside the circuit for the IOI task.
      prefix: ''
      suffix: ''
      section: Appendix I
      page: null
      line: null
    - exact: 4.11 and 2.2 are the two heads with the highest previous token score on sequences of random
        tokens. This is a strong validation of their role outside pIOI .
      prefix: ''
      suffix: ''
      section: Appendix H
      page: null
      line: null
    - exact: We identified heads compensating for the loss of function of other heads, and heads contributing
        negatively to the next-token prediction. Early results suggest that the latter phenomenon occurs
        for other tasks beyond IOI (see Appendix H).
      prefix: ''
      suffix: ''
      section: §5
      page: null
      line: null
  E4:
    quotes:
    - exact: As a starting point, we performed a preliminary analysis of GPT-2 medium. We found that this
        model also has a sparse set of heads directly influencing the logits. However, not all of these
        heads attend to IO and S, suggesting more complex behavior than the Name Movers Heads in GPT-2
        small.
      prefix: ''
      suffix: ''
      section: §5
      page: null
      line: null
    - exact: Second, the number of parameters in GPT-2 small is orders of magnitude away from state-of-the-art
        transformer language models. A future challenge is to scale this approach to these larger models.
      prefix: ''
      suffix: ''
      section: §5
      page: null
      line: null
    refs:
    - citation: tigges2024llm
      text: tend to replicate across model scale
      section: body
      page: null
