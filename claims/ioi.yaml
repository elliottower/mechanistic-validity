      section: §4.3
      page: null
      line: null
    - exact: This circuit has a faithfulness score of 0.1, comparable to the full circuit C.
      prefix: ''
      suffix: ''
      section: §4.3
      page: null
      line: null
    - exact: 'However, the naïve circuit can be more easily proven incomplete: by sampling random sets
