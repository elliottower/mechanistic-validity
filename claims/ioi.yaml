  E5:
    quotes:
    - exact: Plot of points (xK , yK ) = (F (C \ K), F (M \ K)) for (a) our circuit and (b) a naive circuit.
        Each point is for a different choice of K.
      prefix: ''
      suffix: ''
      section: Figure 6 caption
      page: null
      line: null
    - exact: In practice, because the naïve and the full circuit are not of the same size, we chose respectively
        k = 5 and k = 10 to ensure a similar amount of stochasticity in the process. We run the procedure
        10 times and kept the 5 sets with the maximal important incompleteness score (including the intermediate
        K).
      prefix: ''
      suffix: ''
      section: Appendix M
      page: null
      line: null
    - exact: Mean-ablations remove the information that varies in the reference distribution (e.g. the
        value of the name outputted by a head) but will preserve constant information (e.g. the fact that
        a head is outputting a name).
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
  E6:
    quotes:
    - exact: As presented in Section 3, the model relies on duplicate detection to differentiate between
        S and IO. Motivated by this, we constructed passages where both the S and IO tokens are duplicated.
      prefix: ''
      suffix: ''
      section: §4.4
      page: null
      line: null
    - exact: We find that this significantly reduces the logit difference and causes the model to predict
        S over IO 23% of the time (Figure 8).
      prefix: ''
      suffix: ''
      section: §4.4
      page: null
      line: null
    - exact: To ensure that the observed effect is not an artifact of the additional sentences, we included
        a control dataset using the same templates, but where the middle sentence contains S instead of
        IO.
      prefix: ''
      suffix: ''
      section: §4.4
      page: null
      line: null
    - exact: On this distribution, the model has an even higher logit difference than on pIOI , and predicts
        S over IO only 0.4% of the time.
      prefix: ''
      suffix: ''
      section: §4.4
      page: null
      line: null
    - exact: Despite being inspired by our understanding of our circuit, those examples are simple enough
        that they could have been found without our circuit with enough effort.
      prefix: ''
      suffix: ''
      section: §4.4, Limitations of the attack
      page: null
      line: null
  V1:
    quotes:
    - exact: If we think of a model as a computational graph M where nodes are terms in its forward pass
        (neurons, attention heads, embeddings, etc.) and edges are the interactions between those terms
        (residual connections, attention, projections, etc.), a circuit C is a subgraph of M responsible
        for some behavior (such as completing the IOI task).
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
    - exact: This definition of a circuit is more coarse-grained than the one presented in Olah et al.
        (2020), where nodes are features (meaningful directions in the latent space of a model) instead
        of model components.
      prefix: ''
      suffix: ''
      section: §2.1
      page: null
      line: null
    - exact: 'Below we present a circuit that we claim implements this functionality. Our circuit contains
        three major classes of heads, corresponding to the three steps of the algorithm above:'
      prefix: ''
      suffix: ''
      section: §3
      page: null
      line: null
  V2:
    quotes:
    - exact: We discovered two signals through which S-Inhibition Heads do this. The first, the token
        signal, contains the value of the token S and causes Name Mover Heads to avoid occurrences of
        that token. The second, the position signal, contains information about the position of the S1
        token, causing Name Mover Heads to avoid the S1 position no matter the value of the token at this
        position.
      prefix: ''
      suffix: ''
      section: §3.2
      page: null
      line: null
    - exact: Then the Figure 9 suggests that the logit difference can be well approximated by 2.31Spos
        + 0.99Stok , with a mean error of 7% relative to the baseline logit difference.
      prefix: ''
      suffix: ''
      section: Appendix A
      page: null
      line: null
    - exact: To fully validate the claimed function of the Duplicate Token and Induction Heads, we would
        want to perform additional checks that we omitted due to time constraints.
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
    - exact: In our circuit, Induction Heads’ outputs are used as positional signals for S-Inhibition
        values. We did not investigate how this mechanism was implemented.
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
  V3:
    quotes:
    - exact: To establish a baseline for these criteria, we compare to a naïve circuit that consists of
        the Name Mover Heads (but no Backup nor Negative Name Mover Heads), S-Inhibition Heads, two Induction
        Heads, two Duplicate Token Heads, and the Previous Token Heads.
      prefix: ''
      suffix: ''
      section: §4.3
      page: null
      line: null
    - exact: This circuit has a faithfulness score of 0.1, comparable to the full circuit C.
      prefix: ''
      suffix: ''
      section: §4.3
      page: null
      line: null
    - exact: Nonetheless, when we applied the greedy heuristic to optimize for the incompleteness score,
        both circuits have similarly large incompleteness scores.
      prefix: ''
      suffix: ''
      section: §4.3
      page: null
      line: null
  V4:
    quotes:
    - exact: We hypothesize that these heads (i) attend to the correct name and (ii) copy whatever they
        attend to. We therefore call these heads Name Mover Heads.
      prefix: ''
      suffix: ''
      section: §3.1
      page: null
      line: null
    - exact: We therefore call these heads S-Inhibition Heads, since their effect is to decrease attention
        to S1.
      prefix: ''
      suffix: ''
      section: §3.2
      page: null
      line: null
    - exact: We hypothesize that these heads attend to the previous occurrence of a duplicate token and
        copy the position of this previous occurrence to the current position. We therefore call them
        Duplicate Token Heads.
      prefix: ''
      suffix: ''
      section: §3.3
      page: null
      line: null
    - exact: A fourth major family of heads writes in the opposite direction of the Name Mover Heads,
        thus decreasing the confidence of the predictions. We speculate that these Negative Name Mover
        Heads might help the model “hedge” so as to avoid high cross-entropy loss when making mistakes.
      prefix: ''
      suffix: ''
      section: §3
      page: null
      line: null
    - exact: Finally, Backup Name Mover Heads do not normally move the IO token to the output, but take
        on this role if the regular Name Mover Heads are knocked out.
      prefix: ''
      suffix: ''
      section: §3
      page: null
      line: null
  V5:
    quotes:
    - exact: Though these criteria support our explanation, they also point to remaining gaps in our understanding.
      prefix: ''
      suffix: ''
      section: Abstract
      page: null
      line: null
    - exact: Our circuit shows significant improvements compared to a naïve (but faithful) circuit, but
        fails to pass the most challenging tests.
      prefix: ''
      suffix: ''
      section: §1
      page: null
      line: null
    - exact: In all of our experiments, we do not intervene on MLPs, layer norms, or embedding matrices,
        focusing our investigation on understanding the attention heads.
      prefix: ''
      suffix: ''
      section: §3
      page: null
      line: null
    - exact: However, our work also has several limitations. First, despite the detailed analysis presented
        here, we do not understand several components.
      prefix: ''
      suffix: ''
      section: §5
      page: null
      line: null
    - exact: In the same way model organisms in biology enable discoveries valuable beyond a specific
        species, we think these highly detailed (though narrow) examples are crucial to developing a comprehensive
        understanding of machine learning models.
      prefix: ''
      suffix: ''
      section: §5
