    quotes:
    - exact: The first one, faithfulness, asks that C has similar performance to the full model M, as
        measured by |F(M) - F(C)|.
      prefix: ''
      suffix: ''
      section: §4, opening definition
      page: null
      line: null
    - exact: For the circuit C from Figure 2, we find that |F(M) - F(C)| = 0.46, or only 13% of F(M) =
