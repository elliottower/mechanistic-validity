        the distance between mean harmful and harmless activations.
      prefix: ''
      suffix: ''
      section: §2.3
      page: null
      line: null
    - exact: Zheng et al. (2024) and Zou et al. (2023a) both use contrastive pairs of harmful and harmless
        inputs to identify the model’s representation of harmfulness, asserting that this direction is
        distinct from the model’s representation of refusal.
      prefix: ''
      suffix: ''
      section: §6
      page: null
      line: null
    - exact: Zheng et al. (2024) argue this by showing that safety prompts shift activations in a distinct
        direction, while Zou et al. (2023a) show that the representation is not significantly altered
        by adversarial suffixes. Note that this is in contrast to our findings in §5.1 that the refusal
        direction is significantly suppressed in the presence of an adversarial suffix.
      prefix: ''
      suffix: ''
      section: §6
      page: null
      line: null
    - exact: We find that, similarly to the chat models, corresponding base models have high cosine similarity
        with the refusal direction when run on harmful prompts, and low cosine similarity when run on
        harmless prompts. This suggests that, rather than developing the “refusal direction” from scratch
        during fine-tuning, this representation exists already in the base model, and is repurposed for
        refusal during safety fine-tuning.
      prefix: ''
      suffix: ''
      section: §J
      page: null
      line: null
