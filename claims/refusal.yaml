      section: §2.3
      page: null
      line: null
    - exact: One natural question is whether this direction, or feature, is learned from scratch during
        safety fine-tuning specifically to mediate refusal, or whether this direction is already present
        in the base model and gets repurposed, or “hooked into”, during safety fine-tuning.
      prefix: ''
