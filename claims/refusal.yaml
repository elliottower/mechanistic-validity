claim: refusal
title: Refusal Mediated by a Single Direction
description: 'A difference in means between activations on harmful and harmless instructions yields one
  residual-stream direction per model. Projecting that direction out of every matrix that writes to the
  residual stream stops the model from refusing harmful instructions, and adding it at its extraction layer
  makes the model refuse harmless ones, down to a request for the benefits of yoga. The direction is chosen
  as the minimizer of bypass\_score over every post-instruction position crossed with every layer subject
  to three thresholds, and the result is reported for 13 open-weight chat models in 5 families over a
  40x parameter range. Description mode: undeclared --- representational in the title, causal-behavioral
  in the evidence.'
source:
  citation: arditi2024refusal
  title: Refusal in Language Models Is Mediated by a Single Direction
  url: https://arxiv.org/abs/2406.11717
  local: reference/arditi_2024_refusal_direction.pdf
  sha256: 9e0ca3b77c0678b289df869493ecb72f7b6b3a4dc6891769c1f5e8511b46d6db
  extract_cmd: pdftotext -layout
  read_in_full: true
claims:
  C1:
    quotes:
    - exact: Specifically, for each model, we find a single direction such that erasing this direction
        from the model’s residual stream activations prevents it from refusing harmful instructions, while
        adding this direction elicits refusal on even harmless instructions.
      prefix: ''
      suffix: ''
      section: Abstract
      page: null
      line: null
    - exact: Following prior work (Lermen et al., 2023; Liu et al., 2023; Robey et al., 2023; Shah et
        al., 2023a; Xu et al., 2023; Zou et al., 2023b), we compile a set of these common “refusal substrings”.
        If a model completion includes at least one such substring, it is classified as a refusal (refusal_score=1);
        otherwise, it is classified as a non-refusal (refusal_score=0).
      prefix: ''
      suffix: ''
      section: §2.5
      page: null
      line: null
    - exact: This condition filters out directions that are not sufficient to induce refusal.
      prefix: ''
      suffix: ''
      section: §C.1
      page: null
      line: null
    - exact: This condition filters out directions that significantly change model behavior on harmless
        prompts when ablated.
      prefix: ''
      suffix: ''
      section: §C.1
      page: null
      line: null
    - exact: L LAMA -3 70B −5 25/80 −7.839 0.126 0.021
      prefix: ''
      suffix: ''
      section: Table 5
      page: null
      line: null
  C2:
    quotes:
    - exact: 'In a transformer architecture, the matrices that write to the residual stream are: the embedding
        matrix, the positional embedding matrix, attention out matrices, and MLP out matrices. Orthogonalizing
        all of these matrices, as well as any output biases, with respect to the direction r̂ effectively
        prevents the model from ever writing r̂ to its residual stream.'
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
    - exact: Note that this weight modification is equivalent to the previously described inference-time
        directional ablation, as shown explicitly in §E.
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
    - exact: 'To further investigate how the refusal direction is suppressed, we examine the contributions
        of individual attention head and MLP components to the refusal direction. We quantify each component’s
        contribution to this direction using direct feature attribution (DFA) (Kissane et al., 2024; Makelov
        et al., 2024): each component’s direct contribution can be measured by projecting its output onto
        the refusal direction. We select the top eight attention heads with the highest DFA on harmful
        instructions,'
      prefix: ''
      suffix: ''
      section: §5.2
      page: null
      line: null
    - exact: We analyze the top eight attention heads that most significantly write to the refusal direction.
      prefix: ''
      suffix: ''
      section: Figure 6 caption
      page: null
      line: null
  C3:
    quotes:
    - exact: To identify the “refusal direction” in the model’s residual stream activations, we compute
        the difference between the model’s mean activations when run on harmful and harmless instructions.
      prefix: ''
      suffix: ''
      section: §2.3
      page: null
      line: null
    - exact: Note that this weight modification is equivalent to the previously described inference-time
        directional ablation, as shown explicitly in §E. Therefore, the performance of the inference-time
        intervention in bypassing refusal, presented in §3.1, also exactly characterizes that of the direct
        weight modification.
      prefix: ''
      suffix: ''
      section: §4.1
      page: null
      line: null
    - exact: 'In this section, we compare directional ablation to two other weight modification methodologies:
        activation addition and fine-tuning.'
      prefix: ''
      suffix: ''
      section: §I
      page: null
      line: null
    - exact: As shown in Figure 21, this activation addition intervention is effective in bypassing refusal.
        The decreases in refusal score and safety score are comparable to those achieved by directional
        ablation (Figure 1). However, Table 7 displays that the activation addition intervention, labeled
        as act add, causes increased loss over harmless data, in particular compared to directional ablation.
      prefix: ''
      suffix: ''
      section: §I.1
      page: null
      line: null
    - exact: Second, the methodology we used to extract the “refusal direction” is likely not optimal
        and relies on several heuristics. We see this paper as more of an existence proof that such a
        direction exists, rather than a careful study of how best to extract it, and we leave methodological
        improvements to future work.
      prefix: ''
